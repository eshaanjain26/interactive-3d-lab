    SK.bus.emit('ops', { t: now(), kind: 'warn', msg: SK.PAX_PER_FIGURE + ' passengers missed ' + a.flight.num + ' (gate closed); rebooking at the transfer desk' });
    log(a, 'Missed the flight; sent to rebooking');
    yield* go(a, 'gate' + a.flight.gate);
    yield waitSim(300);
    if (a.helper) kill(a.helper);
    kill(a);
  }
  function checkBags(a, server) {
    if (!a.bags) return;
    const x = server ? server.x + 1.2 : a.x;
    for (let i = 0; i < a.bags; i++) SK.bags.induct(a, x + i * 0.5, a.flight);
    log(a, a.bags + ' bag' + (a.bags > 1 ? 's' : '') + ' tagged ' + a.tags.join(', '));
  }
  function takeSeat(list) {
    const free = list.filter((s) => !s.taken);
    if (!free.length) return null;
    const s = free[Math.floor(SK.rng.next() * free.length)];
    return s;
  }
  function sit(a, s) { s.taken = a; a.seat = s; a.anim = 'sit'; a.heading = s.ry; }
  function freeSeat(a) { if (a.seat) { a.seat.taken = null; a.seat = null; } }

  // ---------- spawn ----------
  AG.spawnPax = function (spec, x, z, node) {
    const a = make(Object.assign({ kind: 'pax', role: 'r_pax', x, z, node, log: [] }, spec));
    a.carry = a.bags > 0 || a.cabinBag;
    a.tags = [];
    if (a.prm) { a.wheelchair = true; a.speed = 1.3; }
    a.script = paxScript(a);
    AG.stats.spawned++;
    log(a, 'Arrived by ' + spec.mode + ' for ' + spec.flight.num + ' to ' + spec.flight.city + ' (' + (a.cls === 'F' ? 'First' : a.cls === 'J' ? 'Business' : 'Economy') + ')');
    return a;
  };
  SK.bus.on('deliver', (d) => AG.spawnPax(d.spec, d.x, d.z, d.node));

  function spawnAssistant(pax) {
    const h = make({ role: 'r_wheelchair', x: pax.x - 0.8, z: pax.z + 0.8, kind: 'staff' });
    h.follow = pax;
    pax.helper = h;
    h.script = (function* () { yield until(() => false); })();
  }

  // ---------- staff ----------
  AG.post = function (role, x, z, ry, visible, anim) {
    const a = make({ role, x, z, heading: ry, anim: anim || 'idle', kind: 'staff' });
    a.visibleFn = visible || null;
    a.workAnim = anim || 'idle';
    a.script = (function* () { yield until(() => false); })();
    return a;
  };
  D.staffPosts.forEach((p) => {
    let vis = null, anim = 'work';
    const r = p.ref || {};
    const stMap = { priority: 'priority', economy: 'economy', special: 'special' };
    if (stMap[r.st]) { const st = AG.st[stMap[r.st]]; vis = () => st.servers[r.i] && st.servers[r.i].open; }
    if (r.st === 'lane') {
      const st = r.i === 0 ? AG.st.ftLane : AG.st.lanes;
      const s = r.i === 0 ? st.servers[0] : st.servers[r.i - 1];
      vis = () => s.open || !st.idle(s);
      anim = r.pos === 'xray' ? 'work' : 'idle';
    }
    if (r.st === 'manual') { const s = AG.st.manual.servers[r.i]; vis = () => s.open || !AG.st.manual.idle(s); }
    if (r.st === 'doc') anim = 'work';
    if (r.st === 'gate' || r.st === 'lounge' || r.st === 'egateSup' || r.st === 'laneOfficer' || r.st === 'search') anim = 'idle';
    let role = p.role;
    if (r.st === 'cafe' && r.i === 1) role = 'r_chef';
    const a = AG.post(role, p.x, p.z, p.ry, vis, anim);
    if (role === 'r_chef') a.role = 'r_barista', a.look.torso = 0xf4f4f2, a.look.toque = 0xffffff, a.look.band = null;
  });

  // roaming staff: cleaners, police, K9 team
  function* roam(a, nodes, pause) {
    for (;;) {
      yield* go(a, SK.rng.pick(nodes));
      a.anim = a.role === 'r_cleaner' ? 'work' : 'idle';
      yield waitSim(SK.rng.range(pause[0], pause[1]));
      a.anim = 'idle';
    }
  }
  [['hall0', 'hall1', 'hall2', 'hall3', 'hall4', 'q_economy', 'q_kiosk'], ['conW', 'conC', 'conE', 'gateA1', 'gateA2', 'gateA3', 'gateA4', 'airHub', 'foodIn']].forEach((nodes, i) => {
    for (let k = 0; k < 2; k++) {
      const n = N[nodes[k]];
      const a = make({ role: 'r_cleaner', x: n.x, z: n.z, node: nodes[k] });
      a.speed = 1.1;
      a.script = roam(a, nodes, [60, 240]);
    }
  });
  [['curb0', 'curb2', 'curb4', 'hall1', 'hall3'], ['airHub', 'conC', 'gateA2', 'gateA3', 'conE', 'conW']].forEach((nodes) => {
    const n = N[nodes[0]];
    const p1 = make({ role: 'r_police', x: n.x, z: n.z, node: nodes[0] });
    p1.speed = 1.2;
    p1.script = roam(p1, nodes, [120, 300]);
    const p2 = make({ role: 'r_police', x: n.x + 1, z: n.z, node: nodes[0] });
    p2.follow = p1; p2.script = (function* () { yield until(() => false); })();
  });
  // K9 team works the doc-check and security queues
  const k9 = make({ role: 'r_k9handler', x: 40, z: 33, node: 'secDoor' });
  k9.speed = 1.0;
  const dog = SK.crowd.makeDog();
  AG.dog = { g: dog, x: 40, z: 33, heading: 0, sit: 0 };
  k9.script = (function* () {
    const beats = [{ x: 32, z: 32.5 }, { x: 74, z: 32.5 }, { x: 74, z: 22.5 }, { x: 34, z: 22.5 }];
    for (let k = 0; ; k++) {
      const b = beats[k % beats.length];
      yield* walkTo(k9, { x: b.x, z: b.z + (k9.z > 28 ? 0 : 0) });
      k9.anim = 'idle';
      // occasional alert on a nearby passenger: dog sits, passenger is sent to secondary screening
      const near = AG.list.filter((p) => p.kind === 'pax' && !p.hidden && SK.dist(p.x, p.z, k9.x, k9.z) < 6 && !p.k9Flag);
      if (near.length && SK.rng.chance(0.08)) {
        const p = near[0];
        p.k9Flag = true; AG.stats.k9++;
        AG.dog.sit = 4;
        log(p, 'K9 dog alerted near this passenger');
        SK.bus.emit('ops', { t: now(), kind: 'warn', msg: 'K9 alert in the security queue: passenger referred for additional screening' });
      }
      yield waitSim(SK.rng.range(20, 60));
    }
  })();
  AG.k9 = k9;

  // crew: walk from the crew room to the aircraft before boarding
  AG.spawnCrew = function (f) {
    const t = SK.AIRCRAFT_TYPES[f.wide ? 'wide' : 'narrow'].crew;
    const roles = Array(t.pilots).fill('r_pilot').concat(Array(t.cabin).fill('r_cabin'));
    roles.forEach((role, i) => {
      const a = make({ role, x: 106 + (i % 3) * 0.7, z: -33 + Math.floor(i / 3) * 0.7, node: 'crewRoom', kind: 'crew', flight: f, log: [] });
      a.carry = true; a.look.case = 0x1a1f2b;
      a.script = (function* () {
        yield waitSim(i * 8);
        yield* go(a, 'gate' + f.gate);
        yield until(() => f.plane && f.plane.state === 'parked' && (f.bus || SK.airfield.bridgeReady(f.gate)));
        yield* go(a, 'pod' + f.gate);
        if (f.bus) {
          yield* go(a, 'door' + f.gate);
          a.hidden = true;
          yield waitSim(60);
          kill(a);
          return;
        }
        yield* go(a, 'door' + f.gate);
        setPath(a, SK.airfield.bridgePath(f.gate));
        yield ARRIVE;
        f.crewOnBoard = (f.crewOnBoard || 0) + 1;
        kill(a);
      })();
    });
    SK.bus.emit('ops', { t: now(), kind: 'info', msg: f.num + ' crew briefed, walking to ' + f.gate });
  };

  // ---------- per-frame ----------
  function step(a, dtGame) {
    // run the script until it blocks
    for (let guard = 0; guard < 20; guard++) {
      const w = a.waitFor;
      if (w) {
        if (w.type === 'arrive' && !a.arrived) break;
        if (w.type === 'until' && !w.fn()) break;
        if (w.type === 'station' && a.stationDone !== w.st) break;
      }
      const r = a.script.next();
      if (r.done) { a.dead = true; return; }
      a.waitFor = r.value || null;
    }
    // followers (assistant pushing a wheelchair, patrol partner)
    if (a.follow) {
      const t = a.follow;
      if (t.dead) { kill(a); return; }
      const bx = t.x - Math.sin(t.heading) * 0.95, bz = t.z - Math.cos(t.heading) * 0.95;
      const ox = a.role === 'r_police' ? Math.cos(t.heading) * 1.1 : 0, oz = a.role === 'r_police' ? -Math.sin(t.heading) * 1.1 : 0;
      const tx = a.role === 'r_police' ? t.x + ox : bx, tz = a.role === 'r_police' ? t.z + oz : bz;
      const d = SK.dist(a.x, a.z, tx, tz);
      a.x += (tx - a.x) * Math.min(1, dtGame * 6); a.z += (tz - a.z) * Math.min(1, dtGame * 6);
      a.y = t.y; a.heading = t.heading; a.hidden = t.hidden;
      a.anim = t.anim === 'walk' || d > 0.2 ? (a.role === 'r_wheelchair' ? 'push' : 'walk') : 'idle';
      a.phase += dtGame * 7;
      return;
    }
    // movement
    if (a.path.length) {
      const p = a.path[0];
      const dx = p.x - a.x, dz = p.z - a.z, d = Math.hypot(dx, dz);
      const stepLen = a.speed * dtGame;
      if (p.y != null) a.y += (p.y - a.y) * Math.min(1, d > 0 ? stepLen / d : 1);
      if (d <= stepLen || d < 0.02) {
        a.x = p.x; a.z = p.z; a.path.shift();
        if (!a.path.length) a.arrived = true;
      } else {
        a.x += (dx / d) * stepLen; a.z += (dz / d) * stepLen;
        const h = Math.atan2(dx, dz);
        let dh = h - a.heading;
        while (dh > Math.PI) dh -= Math.PI * 2;
        while (dh < -Math.PI) dh += Math.PI * 2;
        a.heading += dh * Math.min(1, dtGame * 10);
      }
      if (a.anim !== 'sit') a.anim = 'walk';
      a.phase += dtGame * a.speed * 4.2;
    } else {
      if (a.anim === 'walk') a.anim = a.kind === 'staff' ? a.workAnim || 'idle' : 'idle';
      a.phase += dtGame * 3;
    }
  }

  AG.update = function (dtGame) {
    if (dtGame > 0) {
      // sub-step so fast-forward stays stable
      const n = Math.max(1, Math.ceil(dtGame / 0.12));
      const h = dtGame / n;
      for (let s = 0; s < n; s++) {
        for (const st of Object.values(AG.st)) st.update(now() + (s - n + 1) * h * SK.TIME_SCALE);
        for (const a of AG.list) if (!a.dead) step(a, h);
      }
    }
    // dog follows the handler on a short lead
    const dg = AG.dog;
    const tx = k9.x + Math.cos(k9.heading) * 0.7 + Math.sin(k9.heading) * 0.5, tz = k9.z - Math.sin(k9.heading) * 0.7 + Math.cos(k9.heading) * 0.5;
    const moving = SK.dist(dg.x, dg.z, tx, tz) > 0.05;
    dg.x += (tx - dg.x) * Math.min(1, dtGame * 5); dg.z += (tz - dg.z) * Math.min(1, dtGame * 5);
    dg.heading = k9.heading;
    if (dg.sit > 0) dg.sit -= dtGame;
    SK.crowd.poseDog(dg.g, dg.x, dg.z, dg.heading, moving && k9.anim === 'walk', k9.phase, dg.sit > 0);
    dg.g.visible = !SK.layers || SK.layers.staff !== false;

    // staff visibility follows open servers
    for (let i = AG.list.length - 1; i >= 0; i--) {
      const a = AG.list[i];
      if (a.dead) { freeSeat(a); if (a.highlight && SK.cam.mode === 'follow') SK.cam.stopFollow(); AG.list.splice(i, 1); delete AG.byId[a.id]; continue; }
      if (a.visibleFn) a.hidden = !a.visibleFn();
    }
  };
  // shared helpers for other sim modules (arrivals, crisis responders)
  Object.assign(AG, { make, setPath, go, walkTo, use, station, waitSim, until, ARRIVE, log, jit, takeSeat, sit, freeSeat, WALK });
  AG.rendered = function () {
    const lay = SK.layers || {};
    return AG.list.filter((a) => !a.hidden && (a.kind === 'pax' ? lay.pax !== false : lay.staff !== false) && (!SK.filterFn || SK.filterFn(a)));
  };
  AG.count = (fn) => AG.list.reduce((n, a) => n + (fn(a) ? 1 : 0), 0);
  return AG;
})();

// ===== sim/bags.js =====
// SkyOps baggage handling: hall belts, CT screening, sortation, make-up carousel, carts to the aircraft.
// Each bag object stands for the bags of one passenger figure. Every step is logged as a tracking event.
SK.bags = (function () {
  const K = SK.kit, M = K.mat, L = SK.L, E = SK.engine, H = L.bhs;
  const BG = { list: [], carts: [], stats: { inducted: 0, screened: 0, alarms: 0, loaded: 0, short: 0 } };
  const root = new THREE.Group(); root.name = 'bhs';
  E.scene.add(root);
  const B = new K.Batch();
  const now = () => SK.sim.now;
  let serial = 120000;

  // ---------- baggage hall geometry ----------
  const w = H.x1 - H.x0, d = H.z1 - H.z0, cx = (H.x0 + H.x1) / 2, cz = (H.z0 + H.z1) / 2;
  K.ground(w, d, M.concrete, cx, 0.03, cz, root);
  [[H.x0, H.z0, H.x1, H.z0], [H.x1, H.z0, H.x1, H.z1], [H.x0, H.z1, H.x1, H.z1]].forEach(([x0, z0, x1, z1]) => {
    const len = Math.hypot(x1 - x0, z1 - z0);
    B.add(K.geo.box(len, 4, 0.3), M.wall, K.matrix((x0 + x1) / 2, 2, (z0 + z1) / 2, -Math.atan2(z1 - z0, x1 - x0)));
  });

  // conveyor polyline from the hall wall to the carousel
  const PATH = [[H.x0, 30.9], [H.ctX, 30.9], [H.ctX, 17], [H.ctX, 9], [H.carouselX - H.carouselR, H.carouselZ]];
  for (let i = 0; i < PATH.length - 1; i++) {

    const len = Math.hypot(x1 - x0, z1 - z0), ang = -Math.atan2(z1 - z0, x1 - x0);
    B.add(K.geo.box(len + 0.9, 0.6, 0.9), M.beltFrame, K.matrix((x0 + x1) / 2, 0.3, (z0 + z1) / 2, ang));
    B.add(K.geo.box(len + 0.9, 0.05, 0.75), M.belt, K.matrix((x0 + x1) / 2, 0.62, (z0 + z1) / 2, ang));
  }
  // CT scanner
  B.box(2.6, 2.2, 4, M.white, H.ctX, 0, H.ctZ);
  B.box(2.65, 0.4, 4.05, M.blueMark, H.ctX, 2.2, H.ctZ);
  B.box(0.6, 1.1, 0.6, M.desk, H.ctX + 3, 0, H.ctZ + 2);
  B.box(0.5, 0.35, 0.05, M.screen, H.ctX + 3, 1.15, H.ctZ + 1.7);
  // inspection (level 3) table and side belt
  B.box(H.inspect.x - H.ctX - 1, 0.6, 0.8, M.beltFrame, (H.inspect.x + H.ctX) / 2, 0, H.ctZ - 3);
  B.box(3, 0.9, 1.4, M.steel, H.inspect.x, 0, H.inspect.z);
  // carousel ring
  const ring = new THREE.Mesh(new THREE.TorusGeometry(H.carouselR, 0.55, 6, 48), M.belt);
  ring.rotation.x = Math.PI / 2; ring.position.set(H.carouselX, 0.6, H.carouselZ); ring.scale.set(1.25, 1, 1);
  ring.receiveShadow = true;
  root.add(ring);
  B.cyl(H.carouselR * 0.8, 0.5, M.beltFrame, H.carouselX, 0, H.carouselZ, 32);
  // cart slots and exit door
  K.paint('MAKE-UP', 10, 2, '#f1c232', root, H.carouselX, -6.5);
  const slotsX = [107, 112, 117, 122, 127, 132];
  slotsX.forEach((x) => B.box(3.2, 0.02, 7, M.yellowMark, x, 0.025, H.cartZ - 2.5));
  const sign = K.sign(['BAGGAGE HALL', 'Screening · Sortation · Make-up'], 12, 1.8, { bg: '#2f3a48', font: 'bold 64px system-ui, sans-serif', accent: '#ff8a2a' });
  sign.position.set(cx, 5.4, H.z1 + 0.2); root.add(sign);
  K.hit(w, 4, d, cx, 0, cz, root, 'bhs');
  B.build(root);

  // BHS staff
  SK.agents.post('r_bhs', H.ctX + 3, H.ctZ + 1.1, 0, null, 'work');
  SK.agents.post('r_bhs', H.inspect.x, H.inspect.z - 1.2, 0, () => BG.list.some((b) => b.state === 'inspect'), 'work');
  SK.agents.post('r_bhs', H.carouselX - 3, H.carouselZ - H.carouselR - 1.6, 0, null, 'work');
  SK.agents.post('r_bhs', H.carouselX + 4, H.carouselZ - H.carouselR - 1.6, 0, null, 'work');

  // ---------- bags (instanced) ----------
  const MAXB = 1500;
  const bagMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(0.62, 0.36, 0.42), new THREE.MeshStandardMaterial({ roughness: 0.6 }), MAXB);
  bagMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  bagMesh.setColorAt(0, new THREE.Color());
  bagMesh.count = 0; bagMesh.castShadow = true; bagMesh.frustumCulled = false;
  root.add(bagMesh);
  const bagMap = [];
  E.pick.add(bagMesh, (hit) => { const b = bagMap[hit.instanceId]; return b ? { entry: 'bhs', bag: b } : null; });
  const COLORS = [0x1e1e1e, 0x2f4f7f, 0x7f2f2f, 0x5f5f5f, 0x2f6f5f, 0xc7a64a, 0x6b3f8f, 0xd9d4c7];

  const ev = (b, text) => { b.log.push({ t: now(), text }); };
  BG.induct = function (pax, x, f) {
    const tag = '0' + String(100 + (f.airline.code.charCodeAt(0) * 7 + f.airline.code.charCodeAt(1)) % 900) + String(serial++).padStart(6, '0');
    const b = { id: serial, tag, f, pax, x: x, z: L.checkin.beltZ, y: 0.82, state: 'belt', color: SK.rng.pick(COLORS), log: [], t: 0 };
    pax.tags.push(tag);
    ev(b, 'Accepted at check-in for ' + f.num + ' (IATA 753 tracking point: acceptance)');
    BG.list.push(b);
    BG.stats.inducted++;
    f.bagsAccepted++;
    return b;
  };

  // ---------- carts ----------
  function makeCart() {
    const g = new THREE.Group();
    const tug = new THREE.Group();
    K.box(1.6, 1.0, 2.4, M.yellow, 0, 0.3, 0, tug);
    K.box(1.4, 0.9, 0.9, M.glassDark, 0, 1.3, -0.5, tug);
    tug.position.z = 2.8;
    g.add(tug);
    const piles = [];
    [-0.3, -3.6].forEach((z) => {
      K.box(1.8, 0.2, 2.8, M.darkSteel, 0, 0.45, z, g);
      const pile = K.box(1.6, 1, 2.4, new THREE.MeshStandardMaterial({ color: 0x5a4a3a, roughness: 0.8 }), 0, 0.65, z, g);
      pile.scale.y = 0.01;
      piles.push(pile);
    });
    root.add(g);
    E.pick.add(g, 'bagcart');
    return { g, piles };
  }
  function cartFor(f) {
    let c = BG.carts.find((k) => k.f === f);
    if (c) return c;
    const used = BG.carts.map((k) => k.slot);
    const slot = slotsX.findIndex((_, i) => !used.includes(i));
    if (slot < 0) return null;
    const m = makeCart();
    c = Object.assign(m, { f, slot, x: slotsX[slot], z: H.cartZ - 2.5, heading: 0, state: 'makeup', bags: 0, path: null, s: 0 });
    c.g.position.set(c.x, 0, c.z);
    BG.carts.push(c);
    return c;
  }
  function cartPath(c, target) {
    const pts = [[c.x, c.z], [H.carouselX, -16], [H.carouselX, -24], [96, -44], [target.x + 6, -44], [target.x + 2, target.z + 3], [target.x, target.z]];
    const curve = new THREE.CatmullRomCurve3(pts.map((p) => new THREE.Vector3(p[0], 0, p[1])), false, 'centripetal');
    return { c: curve, len: curve.getLength() };
  }

  // belt loader at the aircraft
  const loaders = {};
  function loaderFor(p) {
    if (loaders[p.f.id]) return loaders[p.f.id];
    const g = new THREE.Group();
    K.box(1.8, 0.8, 4, M.yellow, 0, 0.3, 0, g);
    const belt = K.box(0.9, 0.12, 7, M.belt, 0, 1.1, 2.6, g);

    E.pick.add(g, 'bagcart');
    return (loaders[p.f.id] = g);
  }

  // ---------- update ----------
  const SPEED = 1.6;                 // belt speed, m/s game time
  const mx = new THREE.Matrix4(), col = new THREE.Color();
  BG.update = function (dt) {
    for (let i = BG.list.length - 1; i >= 0; i--) {
      const b = BG.list[i];
      b.t += dt;
      switch (b.state) {
        case 'belt': {
          // hall collector belt: priority section dives at its east end; main dives at the security entrance;
          // the special-assistance section runs straight through the wall into the hall
          const pEnd = L.groups.priority.x1 + 0.6;
          const dive = b.x < pEnd ? pEnd : b.x < L.beltDropX + 0.5 ? L.beltDropX : null;
          b.x += SPEED * dt;
          if (dive != null && b.x >= dive + 0.6) { b.state = 'tunnel'; b.t = 0; b.hidden = true; ev(b, 'Below floor to the baggage hall'); }
          if (dive == null && b.x >= H.x0) { b.state = 'annex'; b.seg = 0; b.x = H.x0; b.z = PATH[0][1]; }

        case 'annex': {

          break;
        }
        case 'ct':

            b.screened = true; BG.stats.screened++;

              BG.stats.alarms++;

    sat -= Math.min(15, missRate * 3);
    sat -= Math.min(10, k.mishandledRate * 0.5);
    if (SK.arrivals) {
      SK.arrivals.kpi(k);
      sat -= Math.max(0, k.waitArrImm - 10) * 0.8;
      if (k.firstBag != null) sat -= Math.max(0, k.firstBag - 20) * 0.5;
    }
    if (SK.support) SK.support.kpi(k);
    k.satisfaction = Math.round(SK.clamp(sat, 0, 100));
    if (!O.lastHist || t - O.lastHist >= 600) {
      O.lastHist = t;
      O.hist.push({ t, sec: k.waitSecurity, chk: k.waitCheckin, pp: k.waitPassport, pax: k.paxIn, sat: k.satisfaction, otp: k.otp });
      if (O.hist.length > 288) O.hist.shift();
    }
  }

  // auto staffing (sandbox): open servers to keep predicted waits inside ADRM ranges
  function autoStaff() {
    const st = AG.st;
    const want = (station, target, min) => {
      const perServer = (target * 60) / station.meanCycle;   // agents one server clears within the target wait
      return Math.max(min, Math.ceil(station.queue.length / Math.max(1, perServer)));
    };
    O.setOpen('lanes', want(st.lanes, 8, 2));
    O.setOpen('economy', want(st.economy, 15, 3));
    O.setOpen('priority', want(st.priority, 5, 1));
    O.setOpen('manual', want(st.manual, 8, 2));
    O.setOpen('bagdrop', 6); O.setOpen('kiosk', 12); O.setOpen('egate', 8);
  }

  SK.bus.on('sale', (s) => { O.money[s.kind] += s.amount; });

  // ---------- main update ----------
  let kpiTimer = 0, fidsTimer = 0, staffTimer = 0;
  O.update = function (dtGame) {
    if (dtGame <= 0) return;
    SK.sim.now += dtGame * SK.TIME_SCALE;
    const t = now();
    O.money.staff += (O.kpi.staffCost || 0) * (dtGame * SK.TIME_SCALE) / 3600;
    while (O.pending.length && O.pending[0].t <= t) {
      const q = O.pending.shift();
      const spec = makeSpec(q.f);
      q.f.spawned++;
      SK.landside.request(spec.mode, spec);
    }
    for (const f of O.flights) {
      if (f.departed && t - f.airborneAt > 1800) continue;
      if (f.std - t > SK.minutes(200)) break;
      turn(f);
    }
    SK.landside.update(dtGame);
    SK.aircraft.update(dtGame, t);
    SK.agents.update(dtGame);
    SK.bags.update(dtGame);
    if (SK.arrivals) SK.arrivals.update(dtGame);
    if (SK.support) SK.support.update(dtGame);
    SK.airfield.update(dtGame);
    updateBus(dtGame);
    updateTugs();
    staffTimer -= dtGame;
    if (O.autoStaff && staffTimer <= 0) { autoStaff(); staffTimer = 4; }
    kpiTimer -= dtGame;
    if (kpiTimer <= 0) { computeKpi(); kpiTimer = 0.5; }
  };
  O.visual = function (dtGame, dtReal) {
    SK.airfield.visual(dtReal);
    if (SK.arrivals) SK.arrivals.visual(dtReal);
    if (SK.support) SK.support.visual(dtReal);
    SK.terminal.update(dtGame);
    fidsTimer -= dtReal;
    if (fidsTimer <= 0) {
      fidsTimer = 1;
      const t = now();
      const board = O.flights.filter((f) => f.std > t - SK.minutes(40) && f.std < t + SK.minutes(360));
      board.forEach((f) => (f.statusText = SK.flightStatus(f, t)));
      SK.terminal.updateFids(board, t);
      L.gates.forEach((g) => {
        const f = board.find((x) => x.gate === g.id && !x.departed && !x.offBlock);
        const key = f ? f.num + f.statusText : '-';
        if (O['gs' + g.id] === key) return;
        O['gs' + g.id] = key;
        SK.terminal.setGateScreen(g.id, f ? [g.id + '  ' + f.num, f.city + ' · ' + f.statusText] : [g.id, 'No departures'], f && f.boarding ? '#0f5132' : '#0c1522');
      });
    }
  };
  O.flightsAhead = function (n) {
    const t = now();
    return O.flights.filter((f) => !f.departed && f.std > t - SK.minutes(90)).slice(0, n || 12);
  };
  return O;
})();

  const bagMap = [];
  E.pick.add(bagMesh, (hit) => { const b = bagMap[hit.instanceId]; return b ? { entry: 'carousel', abag: b } : null; });
  const BCOL = [0x1e1e1e, 0x2f4f7f, 0x7f2f2f, 0x5f5f5f, 0x2f6f5f, 0xc7a64a, 0x6b3f8f, 0xd9d4c7];
  const ovalPos = (i, th, off) => ({ x: C.x + (C.rx + (off || 0)) * Math.cos(th), z: C.carousels[i] + (C.rz + (off || 0)) * Math.sin(th) });

  // ---------- inbound carts ----------
  function makeCart() {
    const g = new THREE.Group();
    K.box(1.6, 1, 2.4, M.yellow, 0, 0.3, 2.8, g);
    K.box(1.4, 0.9, 0.9, M.glassDark, 0, 1.3, 2.3, g);

  }

    const c = new THREE.CatmullRomCurve3(pts.map((p) => new THREE.Vector3(p[0], 0, p[1])), false, 'centripetal');
    return { c, len: c.getLength() };
  }

  // ---------- pickup cars ----------
  const cars = [];
  const waiting = [];
  function car() {
    const g = new THREE.Group();
    const col = SK.rng.chance(0.35) ? 0xf1c232 : SK.rng.pick([0xd9dde2, 0x1f2329, 0x7b8691, 0xa62b2b, 0x274b8a]);
    K.box(1.9, 0.8, 4.4, new THREE.MeshStandardMaterial({ color: col, roughness: 0.35, metalness: 0.5 }), 0, 0.35, 0, g);
    K.box(1.7, 0.65, 2.4, M.glassDark, 0, 1.15, 0.2, g);
    root.add(g); E.pick.add(g, 'pickup');
    return g;
  }

  // ---------- inbound flights ----------
  const carouselLoad = [0, 0, 0];
  SK.bus.on('blockIn', (p) => {
    const f = p.f;
    if (f.cargo) return;
    const kind = f.wide ? 'wide' : 'narrow';
    const seats = SK.AIRCRAFT_TYPES[kind].seats;
    const figures = Math.max(6, Math.round((seats * SK.rng.range(0.7, 0.92)) / P));
    const origin = SK.rng.pick(SK.DESTS[kind]);
    const ci = carouselLoad.indexOf(Math.min(...carouselLoad));
    carouselLoad[ci]++;
    const rec = {
      f, plane: p, figures, spawned: 0, origin: origin[1], num: f.airline.code + ' ' + (parseInt(f.num.split(' ')[1], 10) + 1),
      carousel: ci, blockIn: now(), nextSpawn: now() + SK.minutes(3), bags: [], bagQueue: 0, firstBag: null, lastBag: null, pax: [],
      cart: null, cartState: 'wait', feeding: false, done: false,
    };
    f.arrivalsPending = true;
    A.list.push(rec);
    SK.bus.emit('ops', { t: now(), kind: 'info', msg: rec.num + ' from ' + rec.origin + ' on blocks at ' + (f.bus ? 'R1' : f.gate) + ': ' + figures * P + ' arriving passengers, bags to carousel ' + (ci + 1) });
  });

  function spawnArrival(rec) {
    const f = rec.f;
    const g = L.gates.find((x) => x.id === f.gate);
    const r = SK.rng;
    const u = r.next();
    const cls = f.wide ? (u < 0.03 ? 'F' : u < 0.15 ? 'J' : 'Y') : u < 0.09 ? 'J' : 'Y';
    let start, path;
    if (f.bus) {
      const d = L.gateDoor(g);
      start = { x: d.x + r.range(-1, 1), z: L.term.z0 - 1.5, y: 0 };
      path = [{ x: d.x, z: CZ, y: Y }];
    } else {
      const bp = SK.airfield.bridgePath(f.gate);
      start = { x: bp[3].x, z: bp[3].z, y: bp[3].y };
      path = [{ x: bp[2].x, z: bp[2].z, y: 3 }, { x: bp[2].x, z: CZ - 1.6, y: Y - 0.4 }, { x: bp[2].x, z: CZ, y: Y }];
    }
    path.push({ x: CX, z: CZ, y: Y }, { x: CX, z: AR.escTop.z, y: Y }, { x: AR.escTop.x, z: AR.escTop.z, y: Y }, { x: AR.escBottom.x, z: AR.escBottom.z, y: 0 });
    path.forEach((p) => { p.x += AG.jit({ id: rec.spawned + 7 }, p.z) * 0.5; });
    const a = AG.make({ kind: 'pax', role: 'r_pax', arriving: true, arr: rec, cls, x: start.x, y: start.y, z: start.z, log: [], flight: null,
      egate: r.chance(0.55), bags: r.chance(0.72) ? 1 : 0, cabinBag: r.chance(0.65), red: r.chance(0.04) });
    a.carry = a.cabinBag;
    a.script = arrScript(a, path);
    rec.pax.push(a);
    if (a.bags) {
      const delayed = r.chance(0.015);
      rec.bags.push({ owner: a, state: delayed ? 'delayed' : 'hold', color: r.pick(BCOL), th: 0, rec });
      if (delayed) A.stats.delayedBags++;
    }
    rec.spawned++;
    A.stats.arrived++;
    AG.log(a, 'Deplaned ' + rec.num + ' from ' + rec.origin + ' at ' + (f.bus ? 'R1 (bus to the terminal)' : f.gate));
  }

  function* arrScript(a, path) {
    const rec = a.arr;
    AG.setPath(a, path);
    yield AG.ARRIVE;
    AG.log(a, 'Through the arrivals corridor');
    a.node = 'aEsc';
    // immigration
    const s = a.egate ? st.egate : st.manual;
    yield* AG.use(a, s, a.egate ? 'aImmE' : 'aImmM', a.egate ? 'Arrivals e-gate' : 'Arrivals passport booth');
    yield* AG.walkTo(a, { x: I.x + 4, z: a.z });
    a.node = a.z < 10 ? 'aClaimN' : a.z > 30 ? 'aClaimS' : 'aClaim';
    AG.log(a, 'Admitted to the country');
    // baggage claim
    const bag = rec.bags.find((b) => b.owner === a);
    if (bag) {
      yield* AG.go(a, 'aCar' + rec.carousel);
      const th = SK.rng.range(-0.6, 0.6) + Math.PI;     // west side of the oval, facing the belt
      const spot = ovalPos(rec.carousel, th, 1.5);
      yield* AG.walkTo(a, spot);
      a.heading = Math.atan2(C.x - spot.x, C.carousels[rec.carousel] - spot.z);
      a.waitTh = th;
      AG.log(a, 'Waiting at carousel ' + (rec.carousel + 1));
      yield AG.until(() => bag.state === 'taken' || (bag.state === 'delayed' && rec.lastBag && now() - rec.lastBag > SK.minutes(4)));
      if (bag.state === 'taken') {
        a.carry = true; a.look.case = bag.color;
        AG.log(a, 'Collected bag after ' + Math.round((now() - rec.blockIn) / 60) + ' min from on-blocks');
      } else {
        AG.log(a, 'Bag did not arrive');
        yield* AG.use(a, st.serv, 'aServ', 'Baggage services');
        A.stats.pir++;
        AG.log(a, 'Filed a Property Irregularity Report; bag will be traced and delivered');
        SK.bus.emit('ops', { t: now(), kind: 'warn', msg: 'Delayed bag on ' + rec.num + ': PIR filed at baggage services' });
      }
      a.node = 'aCar' + rec.carousel;
    } else AG.log(a, 'No hold bag, straight to customs');
    // customs
    yield* AG.go(a, 'aCustIn');
    if (a.red) {
      yield* AG.go(a, 'aRed');
      yield* AG.use(a, st.red, null, 'Red channel');
      const duty = Math.round(SK.rng.range(25, 320)) * P;
      A.stats.red++; A.stats.duty += duty;
      AG.log(a, 'Declared goods; paid $' + duty + ' duty and tax');
      a.node = 'aRed';
      yield* AG.go(a, 'aRedOut');
    } else {
      yield* AG.go(a, 'aGreen');

        a.anim = 'idle';
        AG.log(a, 'Stopped in the green channel: bags X-rayed and opened');

      }
      yield* AG.go(a, 'aGreenOut');

    // arrivals hall and pickup
    yield* AG.go(a, 'aHall');
    const g = greeters.find((x) => !x.follow && !x.dead && SK.rng.chance(0.5));
    if (g) { g.follow = a; AG.log(a, 'Met by family at the barrier'); }
    const door = SK.rng.int(0, AR.doors.length - 1);
    yield* AG.go(a, 'aCurb' + door);
    yield* AG.walkTo(a, { x: AR.curbX + SK.rng.range(-0.8, 0.8), z: AR.doors[door] + SK.rng.range(-6, 6) });

  // greeters waiting behind the barrier
  const greeters = [];
  function topUpGreeters() {
    for (let i = greeters.length - 1; i >= 0; i--) if (greeters[i].dead || greeters[i].follow) greeters.splice(i, 1);
    while (greeters.length < 12) {
      const g = AG.post('r_greeter', AR.hall.barrierX + SK.rng.range(1.5, 6), SK.rng.range(AR.z0 + 4, AR.z1 - 4), -Math.PI / 2, null, 'idle');

  }
  topUpGreeters();
  A.stopRate = 0.03;

  // ---------- update ----------
  const mx = new THREE.Matrix4(), col = new THREE.Color();
  let staffT = 0, greetT = 0, carT = 0;
  A.update = function (dt) {
    if (dt <= 0) return;
    const t = now();
    staffT -= dt; if (staffT <= 0 && SK.ops.autoStaff) { autoStaff(); staffT = 4; }
    greetT -= dt; if (greetT <= 0) { topUpGreeters(); greetT = 6; }
    for (let i = A.list.length - 1; i >= 0; i--) {
      const rec = A.list[i];
      const f = rec.f;
      // deplaning: one figure every ~10 sim s once the bridge is on the door (bus: after the ride in)

      while (ready && rec.spawned < rec.figures && t >= rec.nextSpawn) { spawnArrival(rec); rec.nextSpawn += f.bus ? 4 : 10; }

        rec.cart = makeCart(); rec.path = cartPath(from); rec.s = 0; rec.cartState = 'tow';
      }
      if (rec.cartState === 'tow') {
        rec.s = Math.min(rec.path.len, rec.s + 7 * dt);
        const u = rec.s / rec.path.len, pt = rec.path.c.getPointAt(u), tg = rec.path.c.getTangentAt(u);
        rec.cart.position.set(pt.x, 0, pt.z); rec.cart.rotation.y = Math.atan2(tg.x, tg.z);
        if (rec.s >= rec.path.len) { rec.cartState = 'feed'; rec.feeding = true; rec.feedT = 0; }
      }
      if (rec.cartState === 'feed') {
        rec.feedT -= dt;
        const next = rec.bags.find((b) => b.state === 'hold');
        const entry = Math.PI / 2;
        const clear = !rec.bags.some((b) => b.state === 'belt' && Math.abs(Math.atan2(Math.sin(b.th - entry), Math.cos(b.th - entry))) < 0.3);
        if (next && rec.feedT <= 0 && clear) {
          next.state = 'belt'; next.th = entry; rec.feedT = 1.2;
          if (!rec.firstBag) { rec.firstBag = t; SK.bus.emit('ops', { t, kind: 'info', msg: 'First bag on carousel ' + (rec.carousel + 1) + ' for ' + rec.num + ', ' + Math.round((t - rec.blockIn) / 60) + ' min after on-blocks' }); }
        }
        if (!next && rec.spawned >= rec.figures) {
          rec.lastBag = rec.lastBag || t; rec.feeding = false; rec.cartState = 'done';
          root.remove(rec.cart); E.pick.remove(rec.cart);
          A.recent.push({ first: (rec.firstBag || t) - rec.blockIn, last: t - rec.blockIn });
          if (A.recent.length > 8) A.recent.shift();
        }
      }
      rec.bags.forEach((b) => {
        if (b.state !== 'belt') return;
        b.th += dt * 0.32;
        const o = b.owner;
        // owner standing at the belt grabs the bag as it passes
        if (o.waitTh != null && !o.dead && Math.abs(Math.atan2(Math.sin(b.th - o.waitTh), Math.cos(b.th - o.waitTh))) < 0.12 && o.arrived) { b.state = 'taken'; A.stats.bagsDelivered++; }
      });
      const live = rec.pax.some((a) => !a.dead) || rec.spawned < rec.figures || rec.cartState !== 'done';
      if (!live) { carouselLoad[rec.carousel]--; A.list.splice(i, 1); }
    }
    // e-gate doors
    egDoors.forEach((g) => { if (g.open > 0) g.open -= dt; g.d.scale.z += ((g.open > 0 ? 0.06 : 1) - g.d.scale.z) * Math.min(1, dt * 8); });
    // pickup cars
    carT -= dt;
    const unassigned = waiting.filter((a) => !a.car && !a.dead);
    if (carT <= 0 && unassigned.length) {
      const target = unassigned[0];
      const g = car();
      const c = { g, z: AR.roadZ1, stopZ: target.z, state: 'in', riders: [target], wait: 0 };
      unassigned.slice(1).forEach((o) => { if (c.riders.length < 2 && Math.abs(o.z - target.z) < 5) c.riders.push(o); });

      cars.push(c);
      carT = 1.5;
    }
    for (let i = cars.length - 1; i >= 0; i--) {
      const c = cars[i];
      if (c.state === 'in') { c.z -= Math.max(2, Math.min(14, (c.z - c.stopZ) * 1.2)) * dt; if (c.z - c.stopZ < 0.2) { c.state = 'stop'; c.wait = 2.5; } }
      else if (c.state === 'stop') { c.wait -= dt; if (c.wait <= 0) { c.riders.forEach((r) => { r.picked = true; r.hidden = true; }); c.state = 'out'; } }
      else { c.z -= 12 * dt; if (c.z < AR.roadZ0) { root.remove(c.g); E.pick.remove(c.g); cars.splice(i, 1); continue; } }
      c.g.position.set(AR.roadX - 2.4, 0, c.z); c.g.rotation.y = Math.PI;
    }
    for (let i = waiting.length - 1; i >= 0; i--) if (waiting[i].dead || waiting[i].picked) waiting.splice(i, 1);
  };

  // draw carousel bags + arrivals board
  let boardT = 0;
  A.visual = function (dtReal) {

    c.fillStyle = '#62d48f'; c.font = 'bold 40px system-ui, sans-serif'; c.textBaseline = 'middle';
    c.fillText('ARRIVALS', 30, 38);
    c.fillStyle = '#9fb3c8'; c.font = 'bold 30px system-ui, sans-serif'; c.fillText(SK.fmtTime(now()), 870, 38);
    c.font = 'bold 22px system-ui, sans-serif'; c.fillStyle = '#7f93a8';
    ['ON BLOCKS', 'FLIGHT', 'FROM', 'BELT', 'STATUS'].forEach((h, i) => c.fillText(h, [30, 190, 360, 660, 760][i], 86));
    A.list.slice(-9).reverse().forEach((r, k) => {
      const y = 128 + k * 50;
      c.fillStyle = k % 2 ? '#101c2b' : '#0c1522'; c.fillRect(0, y - 24, 1024, 50);
      c.fillStyle = '#ffffff'; c.font = 'bold 30px ui-monospace, monospace';
      c.fillText(SK.fmtTime(r.blockIn), 30, y); c.fillText(r.num, 190, y);
      c.font = 'bold 30px system-ui, sans-serif'; c.fillText(r.origin, 360, y); c.fillText(String(r.carousel + 1), 675, y);
      const s = r.cartState === 'done' ? 'Bags delivered' : r.firstBag ? 'Bags on belt' : 'On blocks';
      c.fillStyle = r.firstBag ? '#62d48f' : '#f2d38a'; c.fillText(s, 760, y);
    });
    ftex.needsUpdate = true;
  };

  A.kpi = function (k) {
    const t = now();
    k.waitArrImm = Math.round(Math.max(st.manual.predictedWait(), st.manual.observedWait(t, 1200)) / 60);
    const r = A.recent;
    k.firstBag = r.length ? Math.round(r.reduce((s, x) => s + x.first, 0) / r.length / 60) : null;
    k.lastBag = r.length ? Math.round(r.reduce((s, x) => s + x.last, 0) / r.length / 60) : null;
    k.arrived = A.stats.arrived * P;
    k.pir = A.stats.pir * P;
    k.customsStops = A.stats.stops * P;
    k.duty = A.stats.duty;
  };
  A.root = root;
  return A;
})();

  CR.scenarios = SCEN;

  CR.openPicker = function () {
    SK.ui.modal('Crisis scenarios', [], () => `<p style="color:var(--muted);margin-top:0">Pick an incident. You will get timed decisions; the sim reacts to each call and you get a scored debrief with the real procedure.</p>
      <div class="grid2">${SCEN.map((s) => `<div class="card2"><b>${s.title}</b><p style="color:var(--muted);margin:6px 0 10px">${s.brief}</p><button class="btn primary" data-sc="${s.id}">Start</button></div>`).join('')}</div>`,

  };
  CR.start = function (id) {
    if (CR.active) finish(true);
    const s = SCEN.find((x) => x.id === id);
    const c = { s, step: 0, picks: [], wait: 3, phase: 'intro', t: 0 };
    CR.active = c;
    SK.ui.setSpeed(1);
    SK.cam.flyTo({ x: s.at.x, z: s.at.z }, { dist: s.dist });
    s.start(c);
  };
  function showStep(c) {
    const st = c.s.steps[c.step];
    $('crTitle').textContent = c.s.title;
    $('crText').innerHTML = `<p style="margin:0 0 6px">${c.step === 0 ? c.s.brief + ' ' : ''}${st.text}</p>`;
    $('crOpts').innerHTML = st.opts.map((o, i) => `<button data-o="${i}">${o.t}</button>`).join('');
    $('crOpts').querySelectorAll('button').forEach((b) => b.addEventListener('click', () => choose(c, Number(b.dataset.o))));
    $('crisis').classList.add('on');
    c.phase = 'decide'; c.timer = st.timeout || 30; c.timerMax = c.timer;
    $('crOpts').querySelector('button').focus();
  }
  function choose(c, i) {
    const st = c.s.steps[c.step];
    const o = i == null ? null : st.opts[i];
    c.picks.push({ q: st.text, o, best: st.opts.find((x) => x.s === 2) });
    if (o && o.fx) o.fx(c);
    if (!o) log('No decision made in time');
    $('crisis').classList.remove('on');
    c.step++;
    c.phase = c.step < c.s.steps.length ? 'gap' : 'run';
    c.wait = c.step < c.s.steps.length ? 6 : c.s.duration || 18;
  }
  function finish(silent) {
    const c = CR.active;
    if (!c) return;
    if (c.s.end) c.s.end(c);
    clearProps();
    if (c.van) props.remove(c.van);
    $('crisis').classList.remove('on');
    CR.active = null;
    if (silent) return;
    const score = c.picks.reduce((s, p) => s + (p.o ? p.o.s : 0), 0), max = c.s.steps.length * 2;
    SK.ui.modal('Debrief: ' + c.s.title, [], () => `<div class="quiz-q">Score ${score} / ${max}</div>
      ${c.picks.map((p) => `<div class="card2" style="margin-bottom:8px"><div class="eyebrow">${p.q}</div><p style="margin:6px 0"><b>Your call:</b> ${p.o ? p.o.t : 'no decision'}</p><p style="margin:0;color:var(--muted)">${p.o ? p.o.why : 'Time ran out. In a real incident, indecision is a decision.'}</p>${p.o && p.o.s < 2 ? `<p style="margin:6px 0 0"><b style="color:var(--ok)">Best:</b> ${p.best.t}</p>` : ''}</div>`).join('')}
      <h3 style="font-size:14px;margin:14px 0 6px">Standard procedure</h3><ol>${c.s.sop.map((x) => `<li>${x}</li>`).join('')}</ol>
      <button class="btn" id="crRef">Learn more: ${SK.CONTENT[c.s.ref].name}</button> <button class="btn primary" id="crAgain">Another scenario</button>`, (body) => {
      body.querySelector('#crRef').addEventListener('click', () => { SK.ui.closeModal(); SK.ui.open(c.s.ref); });
      body.querySelector('#crAgain').addEventListener('click', () => CR.openPicker());
    });
  }
  CR.frame = function (dtGame, dtReal) {
    const c = CR.active;
    if (!c) return;
    if (c.s.tick) c.s.tick(c, dtGame);
    if (c.phase === 'intro' || c.phase === 'gap') { c.wait -= dtReal; if (c.wait <= 0) showStep(c); }
    else if (c.phase === 'decide') {
      c.timer -= dtReal;
      $('crTimer').style.width = Math.max(0, (c.timer / c.timerMax) * 100) + '%';
      if (c.timer <= 0) choose(c, null);
    } else if (c.phase === 'run') { c.wait -= dtGame; if (c.wait <= 0) finish(false); }
  };
  return CR;
})();

// SkyOps accessibility + settings: theme, colour-blind palette, text size, reduced motion, announcements, keyboard map.
SK.settings = (function () {
  const S = { theme: 'auto', cb: false, text: 1, reduced: window.matchMedia('(prefers-reduced-motion: reduce)').matches, speech: false, autoQuality: true, ambient: false, atc: false };
  try { Object.assign(S, JSON.parse(localStorage.getItem('skyops.settings') || '{}')); } catch (e) { /* storage unavailable */ }
  S.save = function () { try { localStorage.setItem('skyops.settings', JSON.stringify({ theme: S.theme, cb: S.cb, text: S.text, reduced: S.reduced, speech: S.speech, autoQuality: S.autoQuality, ambient: S.ambient, atc: S.atc })); } catch (e) { /* ignore */ } };
  S.apply = function () {
    const r = document.documentElement;
    if (S.theme === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', S.theme);
    r.setAttribute('data-cb', S.cb ? 'on' : 'off');
    r.style.setProperty('--font', Math.round(13 * S.text) + 'px');
    SK.reducedMotion = S.reduced;
    SK.engine.reducedMotionBloomOff = S.reduced;
    SK.engine.autoQuality = S.autoQuality;
    SK.engine.bloom.enabled = SK.engine.quality.bloom && !S.reduced;
    SK.bus.emit('settings', S);
  };
  // spoken announcements for boarding calls (off by default)
  S.say = function (text) {
    if (!S.speech || !window.speechSynthesis) return;
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 1.02; u.pitch = 1;
    window.speechSynthesis.speak(u);
  };
  SK.bus.on('ops', (e) => { if (/now boarding|final call/.test(e.msg)) S.say(e.msg.replace(/SK /g, 'S K ')); });
  S.apply();

// ===== ui/audio.js =====
// SkyOps audio (opt-in): procedural ambience (terminal hum, crowd murmur, jet rumble near aircraft) and ATC radio calls.
// Everything is synthesised with WebAudio and speechSynthesis, so there are no audio files to load.
SK.audio = (function () {
  const S = SK.settings;
  const A = { ctx: null };
  let master, hum, crowd, jet, jetGain, crowdGain;

  function noiseBuffer(ctx, seconds) {
    const b = ctx.createBuffer(1, ctx.sampleRate * seconds, ctx.sampleRate), d = b.getChannelData(0);
    let last = 0;
    for (let i = 0; i < d.length; i++) { const w = Math.random() * 2 - 1; last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; }   // brown noise
    return b;
  }
  function loop(ctx, buf) { const s = ctx.createBufferSource(); s.buffer = buf; s.loop = true; s.start(); return s; }

  // AudioContext can only start after a user gesture; settings toggles provide one
  A.start = function () {
    if (A.ctx) { A.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = (A.ctx = new AC());
    master = ctx.createGain(); master.gain.value = 0.5; master.connect(ctx.destination);
    const buf = noiseBuffer(ctx, 4);
    // terminal HVAC hum: low-passed noise plus a quiet 60 Hz tone
    hum = ctx.createBiquadFilter(); hum.type = 'lowpass'; hum.frequency.value = 180;
    const hg = ctx.createGain(); hg.gain.value = 0.18;
    loop(ctx, buf).connect(hum); hum.connect(hg); hg.connect(master);
    const tone = ctx.createOscillator(); tone.frequency.value = 60; const tg = ctx.createGain(); tg.gain.value = 0.015; tone.connect(tg); tg.connect(master); tone.start();
    // crowd murmur: band-passed noise whose level follows how many people are near the camera
    crowd = ctx.createBiquadFilter(); crowd.type = 'bandpass'; crowd.frequency.value = 600; crowd.Q.value = 0.8;
    crowdGain = ctx.createGain(); crowdGain.gain.value = 0;
    loop(ctx, buf).connect(crowd); crowd.connect(crowdGain); crowdGain.connect(master);
    // jet rumble: louder near moving aircraft, much louder at take-off
    jet = ctx.createBiquadFilter(); jet.type = 'lowpass'; jet.frequency.value = 400;
    jetGain = ctx.createGain(); jetGain.gain.value = 0;
    loop(ctx, buf).connect(jet); jet.connect(jetGain); jetGain.connect(master);
  };
  A.stop = function () { if (A.ctx) A.ctx.suspend(); };

  // chime before a terminal announcement
  A.chime = function () {
    if (!A.ctx || !S.ambient) return;
    const t = A.ctx.currentTime;
    [659, 523].forEach((f, i) => {
      const o = A.ctx.createOscillator(), g = A.ctx.createGain();
      o.frequency.value = f; g.gain.setValueAtTime(0.0001, t + i * 0.45); g.gain.exponentialRampToValueAtTime(0.25, t + i * 0.45 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.45 + 0.9);
      o.connect(g); g.connect(master); o.start(t + i * 0.45); o.stop(t + i * 0.45 + 1);
    });
  };

  // ATC radio: short tower calls in standard phraseology when an aircraft lands, lines up or takes off
  let lastRadio = 0;
  SK.bus.on('ops', (e) => {
    if (!S.atc || !window.speechSynthesis) return;
    if (performance.now() - lastRadio < 4000) return;
    let msg = null;
    const call = (txt) => txt.replace(/\b([A-Z]{2}) (\d+)/g, (m, a, n) => ({ SK: 'Sky', NW: 'Northwind', AU: 'Aurora', MR: 'Meridian', CB: 'Cobalt', SC: 'Sky Cargo' }[a] || a) + ' ' + n.split('').join(' '));
    if (/cleared for take-off/.test(e.msg)) msg = call(e.msg.split(' cleared')[0]) + ', runway two seven, wind calm, cleared for take-off.';
    else if (/landed on 27/.test(e.msg)) msg = call(e.msg.split(' landed')[0]) + ', vacate left when able, contact ground.';
    else if (/pushback approved/.test(e.msg)) msg = call(e.msg.split(' pushback')[0]) + ', push and start approved, face east.';
    if (!msg) return;
    lastRadio = performance.now();
    const u = new SpeechSynthesisUtterance('Sky Tower. ' + msg);
    u.rate = 1.15; u.pitch = 0.85; u.volume = 0.8;
    window.speechSynthesis.speak(u);
  });
  SK.bus.on('ops', (e) => { if (/now boarding|final call/.test(e.msg)) A.chime(); });

  window.addEventListener('pointerdown', () => { if ((S.ambient || S.atc) && (!A.ctx || A.ctx.state !== 'running')) A.start(); }, { once: false });
  const v = new THREE.Vector3();
  A.frame = function () {
    if (!A.ctx || A.ctx.state !== 'running') return;
    const cam = SK.engine.camera.position, t = A.ctx.currentTime;
    // people within 40 m of the camera target
    const tg = SK.engine.controls.target;
    let n = 0;
    for (const a of SK.agents.list) if (!a.hidden && Math.abs(a.x - tg.x) < 40 && Math.abs(a.z - tg.z) < 40) n++;
    const near = SK.clamp(1 - cam.distanceTo(tg) / 250, 0, 1);
    crowdGain.gain.setTargetAtTime(S.ambient ? Math.min(0.5, n / 120) * near : 0, t, 0.5);
    let jl = 0;
    for (const p of SK.aircraft.planes) {
      if (!p.grp.visible || p.state === 'parked' || p.state === 'queued') continue;
      v.set(p.x, p.y || 0, p.z);
      const d = cam.distanceTo(v);
      const loud = p.state === 'takeoff' ? 1 : p.state === 'approach' || p.state === 'rollout' ? 0.6 : 0.25;
      jl = Math.max(jl, loud * SK.clamp(1 - d / 700, 0, 1));
    }
    jetGain.gain.setTargetAtTime(S.ambient ? jl * 0.9 : 0, t, 0.3);
    master.gain.setTargetAtTime(S.ambient || S.atc ? 0.5 : 0, t, 0.2);
  };
  return A;
})();

// ===== ui/edu.js =====
// SkyOps education layer: animated explainers, learn modal (dashboard, quiz, glossary), onboarding tour, search.
SK.edu = (function () {
  const U = SK.ui, $ = U.$, esc = U.esc, E = SK.engine;
  const ED = {};
  const P = SK.PAX_PER_FIGURE;

  // ---------- explainer: camera path + captions + 3D motion graphics ----------
  const ring = new THREE.Mesh(new THREE.RingGeometry(1.6, 2.1, 40), new THREE.MeshBasicMaterial({ color: 0xffd34d, transparent: true, opacity: 0.9, side: THREE.DoubleSide, depthWrite: false, toneMapped: false }));
  ring.rotation.x = -Math.PI / 2; ring.visible = false; ring.renderOrder = 5;
  E.scene.add(ring);
  const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 6, 8), ring.material);
  beam.visible = false; E.scene.add(beam);
  let arrow = null;
  const arrowTexC = document.createElement('canvas'); arrowTexC.width = 128; arrowTexC.height = 32;
  (function () { const x = arrowTexC.getContext('2d'); x.fillStyle = '#ffd34d'; for (let i = 0; i < 2; i++) { x.beginPath(); x.moveTo(i * 64 + 8, 4); x.lineTo(i * 64 + 40, 16); x.lineTo(i * 64 + 8, 28); x.lineTo(i * 64 + 20, 16); x.closePath(); x.fill(); } })();
  const arrowTex = new THREE.CanvasTexture(arrowTexC); arrowTex.wrapS = THREE.RepeatWrapping;
  function drawArrow(a, b) {
    if (arrow) { E.scene.remove(arrow); arrow.geometry.dispose(); arrow = null; }
    if (!a || SK.dist(a.x, a.z, b.x, b.z) < 2) return;
    const mid = new THREE.Vector3((a.x + b.x) / 2, 2 + SK.dist(a.x, a.z, b.x, b.z) * 0.15, (a.z + b.z) / 2);
    const curve = new THREE.QuadraticBezierCurve3(new THREE.Vector3(a.x, (a.y || 0) + 1, a.z), mid, new THREE.Vector3(b.x, (b.y || 0) + 1, b.z));
    arrowTex.repeat.set(curve.getLength() / 3, 1);
    arrow = new THREE.Mesh(new THREE.TubeGeometry(curve, 40, 0.3, 6, false), new THREE.MeshBasicMaterial({ map: arrowTex, transparent: true, depthWrite: false, toneMapped: false }));
    arrow.renderOrder = 6;
    E.scene.add(arrow);
  }
  let ex = null;
  ED.exploring = () => !!ex;
  ED.explain = function (e) {
    const steps = e.explainer || (e.sop.length ? e.sop.map((t, i) => ({ x: e.at.x, z: e.at.z, y: e.at.y, d: (e.kind === 'zone' ? 40 : 16) + (i % 2) * 4, az: 0.5 + i * 0.35, text: t })) : [{ x: e.at.x, z: e.at.z, d: 24, text: e.summary }]);
    ex = { e, steps, i: 0, t: 0, paused: false };
    $('exTitle').textContent = 'Explainer · ' + e.name;
    $('explainer').classList.add('on');
    $('exSteps').innerHTML = steps.map(() => '<i></i>').join('');
    show(0);
  };
  function show(i) {
    const s = ex.steps[i], prev = i > 0 ? ex.steps[i - 1] : null;
    ex.i = i; ex.t = 0;
    $('exText').textContent = (i + 1) + '. ' + s.text;
    $('exSteps').querySelectorAll('i').forEach((el, k) => el.classList.toggle('on', k <= i));
    $('exNext').textContent = i === ex.steps.length - 1 ? 'Done' : 'Next';

    ring.position.set(s.x, (s.y || 0) + 0.2, s.z); ring.visible = true;

  $('exPause').addEventListener('click', () => { if (!ex) return; ex.paused = !ex.paused; $('exPause').textContent = ex.paused ? 'Play' : 'Pause'; });

        ${card('Staffing', '$' + (k.staffCost || 0).toLocaleString() + '/hr', 'Labour so far $' + Math.round(SK.ops.money.staff).toLocaleString())}
        ${card('Boarded', (k.boarded || 0).toLocaleString(), (k.missed || 0) + ' missed their flight')}
        ${card('Cargo', (k.cargoT || 0) + ' t handled', (k.ulds || 0) + ' ULDs · ' + (k.freighters || 0) + ' freighters dispatched')}
        ${card('Fuel', (k.fuelM3 || 0) + ' m³ delivered', (k.fuelings || 0) + ' hydrant fuellings')}
        ${card('Arrivals', (k.arrived || 0).toLocaleString() + ' arrived', 'First bag ' + (k.firstBag == null ? '–' : k.firstBag + ' min') + ' · last bag ' + (k.lastBag == null ? '–' : k.lastBag + ' min') + ' · ' + (k.pir || 0) + ' PIRs')}
        ${card('Screening outcomes', SK.agents.stats.secondary * P + ' bag searches', SK.agents.stats.patdown * P + ' pat-downs · ' + SK.agents.stats.k9 + ' K9 alerts')}
      </div>`;
    }
    if (learnTab === 'quiz') {
      if (!quiz) newQuiz();
      if (quiz.i >= quiz.qs.length) {
        return `<div class="quiz-q">You scored ${quiz.score} of ${quiz.qs.length}</div><p>${quiz.score >= 7 ? 'Ready for the ops floor.' : quiz.score >= 5 ? 'Solid. Replay the explainers you missed.' : 'Explore the zones and their SOP tabs, then try again.'}</p><button class="btn primary" id="qAgain">New quiz</button>`;
      }
      const q = quiz.qs[quiz.i];
      return `<div class="eyebrow">Question ${quiz.i + 1} of ${quiz.qs.length} · score ${quiz.score}</div><div class="quiz-q">${esc(q.q)}</div>` +
        q.o.map((o, i) => `<button class="quiz-o ${quiz.picked != null ? (i === q.a ? 'right' : i === quiz.picked ? 'wrong' : '') : ''}" data-o="${i}" ${quiz.picked != null ? 'disabled' : ''}>${esc(o)}</button>`).join('') +
        (quiz.picked != null ? `<p style="margin-top:10px">${quiz.picked === q.a ? '<b style="color:var(--ok)">Correct.</b> ' : '<b style="color:var(--bad)">Not quite.</b> '}${esc(q.why)}</p><div style="display:flex;gap:6px"><button class="btn" id="qShow">Show me in the airport</button><button class="btn primary" id="qNext">Next question</button></div>` : '');
    }
    if (learnTab === 'glossary') {
      const items = SK.GLOSSARY.filter((g) => !glossQ || SK.norm(g.term + ' ' + g.def).includes(SK.norm(glossQ)));
      return `<input id="glossSearch" type="search" placeholder="Filter ${SK.GLOSSARY.length} terms" value="${esc(glossQ)}" style="width:100%;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--chip);padding:0 10px;margin-bottom:12px" aria-label="Filter glossary">
        <dl class="gl">${items.map((g) => `<dt>${esc(g.term)}</dt><dd>${esc(g.def)}</dd>`).join('')}</dl>`;
    }
    const roles = Object.values(SK.CONTENT).filter((c) => c.kind === 'role');
    return `<div class="grid2">${roles.map((r) => `<button class="card2" data-role="${r.id}" style="text-align:left;cursor:pointer"><b>${esc(r.name)}</b><p style="margin:4px 0 0;color:var(--muted)">${esc(r.summary)}</p></button>`).join('')}</div>`;
  }
  function afterLearn(body) {
    if (learnTab === 'quiz') {
      body.querySelectorAll('[data-o]').forEach((b) => b.addEventListener('click', () => { quiz.picked = Number(b.dataset.o); if (quiz.picked === quiz.qs[quiz.i].a) quiz.score++; U.repaintModal(); }));
      const n = body.querySelector('#qNext'); if (n) n.addEventListener('click', () => { quiz.i++; quiz.picked = null; U.repaintModal(); });
      const s = body.querySelector('#qShow'); if (s) s.addEventListener('click', () => { const ref = quiz.qs[quiz.i].ref; U.closeModal(); U.flyEntry(SK.CONTENT[ref]); U.open(ref); });
      const a = body.querySelector('#qAgain'); if (a) a.addEventListener('click', () => { newQuiz(); U.repaintModal(); });
    }
    if (learnTab === 'glossary') {
      const i = body.querySelector('#glossSearch');
      i.addEventListener('input', () => { glossQ = i.value; const pos = i.selectionStart; U.repaintModal(); const j = document.getElementById('glossSearch'); j.focus(); j.setSelectionRange(pos, pos); });
    }
    if (learnTab === 'roles') body.querySelectorAll('[data-role]').forEach((b) => b.addEventListener('click', () => { U.closeModal(); U.open(b.dataset.role); }));
  }
  $('learnBtn').addEventListener('click', () => ED.openLearn('dash'));

  // ---------- onboarding tour ----------
  const TOUR = [
    { t: 'Welcome to SKY International', p: 'You are looking at a working international departures terminal. Every figure, bag and aircraft is simulated. The clock runs ' + SK.TIME_SCALE + ' times faster than real life.', el: null, cam: { x: -5, z: 8, d: 260 } },
    { t: 'Live KPIs', p: 'Security, check-in and passport waits are graded against IATA ADRM optimum ranges. Green is inside the range.', el: 'kpis' },
    { t: 'Zones and layers', p: 'Fly to any zone, switch on the heat map or flow lines, and in Operations mode run the staffing yourself.', el: 'left' },
    { t: 'Click anything', p: 'People, desks, scanners, bags and aircraft all open a card: the SOP, the rules behind it, benchmark data, and a live view.', el: null, cam: { x: -20, z: 14, d: 45 } },
    { t: 'Cameras and time', p: 'Switch to top-down, walk the floor, watch the CCTV feeds or let the drone orbit. Speed up time to see a whole wave of departures.', el: 'bottom' },
    { t: 'Your first flight', p: 'Follow one passenger party from the curb to their seat. Their journey log fills in as they go.', el: 'followPaxBtn', last: true },
  ];
  let tour = null;
  ED.startTour = function () { tour = 0; showTour(); };
  function showTour() {
    const s = TOUR[tour], box = $('tour');
    $('tourStep').textContent = 'Step ' + (tour + 1) + ' of ' + TOUR.length;
    $('tourTitle').textContent = s.t;
    $('tourText').textContent = s.p;
    $('tourNext').textContent = s.last ? 'Follow a passenger' : 'Next';
    box.classList.add('on');
    if (s.cam) SK.cam.flyTo({ x: s.cam.x, z: s.cam.z }, { dist: s.cam.d });
    const el = s.el && $(s.el);
    const r = el && el.getClientRects().length ? el.getBoundingClientRect() : null;
    const bw = box.offsetWidth, bh = box.offsetHeight;
    let x = innerWidth / 2 - bw / 2, y = innerHeight / 2 - bh / 2;
    if (r) {
      if (r.bottom + bh + 12 < innerHeight) y = r.bottom + 10; else y = r.top - bh - 10;
      x = SK.clamp(r.left + r.width / 2 - bw / 2, 8, innerWidth - bw - 8);
      if (s.el === 'left') { x = Math.min(innerWidth - bw - 8, r.right + 12); y = r.top + 20; }
    }
    box.style.left = x + 'px'; box.style.top = Math.max(8, y) + 'px';
    $('tourNext').focus();
  }
  function endTour() { tour = null; $('tour').classList.remove('on'); try { localStorage.setItem('skyops.tour', 'done'); } catch (e) { /* ignore */ } }
  $('tourNext').addEventListener('click', () => { if (TOUR[tour].last) { endTour(); U.followRandom(); return; } tour++; showTour(); });
  $('tourSkip').addEventListener('click', endTour);
  $('tourBtn').addEventListener('click', ED.startTour);

  // ---------- search ----------
  const input = $('search'), results = $('results');
  function index() {
    const items = [];
    SK.ZONES.forEach((z) => items.push({ id: z.id, type: 'zone', title: z.name, text: SK.CONTENT[z.id].summary, keywords: SK.CONTENT[z.id].keywords }));
    Object.values(SK.CONTENT).forEach((c) => { if (c.kind !== 'zone') items.push({ id: c.id, type: c.kind, title: c.name, text: c.summary, keywords: c.keywords }); });
    SK.GLOSSARY.forEach((g) => items.push({ id: g.term, type: 'glossary', title: g.term, text: g.def }));
    SK.L.gates.forEach((g) => items.push({ id: g.id, type: 'gate', title: 'Gate ' + g.id, keywords: g.id + (g.bus ? ' bus remote' : '') }));
    SK.ops.flightsAhead(30).forEach((f) => items.push({ id: f.id, type: 'flight', title: f.num + ' to ' + f.city, keywords: f.dest + ' ' + f.gate + ' ' + f.airline.name }));
    return items;
  }
  let res = [], sel = 0;
  function renderResults() {
    results.innerHTML = res.map((r, i) => `<button role="option" class="${i === sel ? 'sel' : ''}" data-i="${i}">${esc(r.title)}<small>${{ zone: 'Zone', object: 'Equipment / process', role: 'Role', glossary: 'Glossary', gate: 'Gate', flight: 'Flight' }[r.type]}</small></button>`).join('') || '<div style="padding:8px;color:var(--muted)">No match</div>';
    results.classList.toggle('on', !!input.value.trim());
    results.querySelectorAll('[data-i]').forEach((b) => b.addEventListener('mousedown', (e) => { e.preventDefault(); pick(res[Number(b.dataset.i)]); }));
  }
  function pick(r) {
    if (!r) return;
    input.value = ''; results.classList.remove('on'); input.blur();
    if (r.type === 'zone') U.goZone(r.id);
    else if (r.type === 'glossary') { glossQ = r.title; ED.openLearn('glossary'); }
    else if (r.type === 'gate') { const g = SK.L.gates.find((x) => x.id === r.id); SK.cam.flyTo({ x: g.x, z: -34 }, { dist: 40 }); U.open('gates'); }
    else if (r.type === 'flight') {
      const f = SK.ops.flights.find((x) => x.id === r.id);
      if (f.plane && f.plane.grp.visible) { SK.cam.flyTo({ x: f.plane.x, z: f.plane.z }, { dist: 90 }); U.open(f.wide ? 'aircraft_wide' : 'aircraft_narrow', { flight: f, plane: f.plane }); }
      else { const g = SK.L.gates.find((x) => x.id === f.gate); SK.cam.flyTo({ x: g.x, z: -34 }, { dist: 40 }); U.open('gates', { flight: f }); }
    } else { U.flyEntry(SK.CONTENT[r.id]); U.open(r.id); }
  }
  input.addEventListener('input', () => { res = SK.searchItems(index(), input.value, 8); sel = 0; renderResults(); });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { sel = Math.min(res.length - 1, sel + 1); renderResults(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { sel = Math.max(0, sel - 1); renderResults(); e.preventDefault(); }
    else if (e.key === 'Enter') pick(res[sel]);
    else if (e.key === 'Escape') { input.value = ''; results.classList.remove('on'); input.blur(); }
  });
  input.addEventListener('blur', () => setTimeout(() => results.classList.remove('on'), 150));

  ED.frame = function (dt) {
    if (ex) {
      ring.material.opacity = 0.55 + 0.4 * Math.sin(performance.now() * 0.006);
      ring.scale.setScalar(1 + 0.15 * Math.sin(performance.now() * 0.004));
      arrowTex.offset.x -= dt * 1.2;
      if (!ex.paused && !SK.cam.flying()) { ex.t += dt; if (ex.t > 6.5 && ex.i < ex.steps.length - 1) show(ex.i + 1); }
    }
  };
  return ED;
})();

// ===== main.js =====
// SkyOps bootstrap: build the schedule, warm the sim up headless, then start rendering.
SK.main = (function () {
  const E = SK.engine;
  const bar = document.getElementById('loadBar'), txt = document.getElementById('loadText');
  SK.ops.build();
  const START = SK.minutes(3 * 60 + 50), WARM_TO = SK.minutes(6 * 60 + 30);
  SK.sim.now = START;

  E.onFrame((dtGame, dtReal) => {
    SK.ops.update(dtGame);
    SK.ops.visual(dtGame, dtReal);
    SK.crowd.update(SK.agents.rendered());
    SK.sky.update(dtGame, dtReal, SK.sim.now);
    if (SK.ui) SK.ui.frame(dtGame, dtReal);
  });

  // warm-up in chunks so the loading bar can paint
  function warm() {
    const t0 = performance.now();
    while (SK.sim.now < WARM_TO && performance.now() - t0 < 40) SK.ops.update(0.25);
    const u = (SK.sim.now - START) / (WARM_TO - START);
    bar.style.width = Math.round(u * 100) + '%';
    txt.textContent = 'Running the early shift: ' + SK.fmtTime(SK.sim.now);
    if (SK.sim.now < WARM_TO) return setTimeout(warm, 0);
    SK.ops.visual(0, 1);
    SK.cam.flyTo({ x: -5, z: 8 }, { pos: [150, 175, 215], dur: 0 });
    E.start();
    document.getElementById('loading').remove();
    if (SK.ui) SK.ui.ready();
  }
  setTimeout(warm, 30);
  return {};
})();

} catch (e) {
  console.error(e);
  document.getElementById('err').style.display = 'grid';
}
})();
</script>
