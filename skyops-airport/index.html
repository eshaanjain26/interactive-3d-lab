<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SkyOps Airport Simulator</title>
<meta name="description" content="A 3D international airport operations simulator: curb, check-in, security, passport control, duty free, gates, baggage hall, apron and runway, with live passengers, bags, aircraft, KPIs, SOPs, quizzes and crisis scenarios.">
<style>
  :root {
    --bg: #dfe7ef;
    --panel: rgba(250, 252, 254, 0.92);
    --panel-solid: #f7f9fb;
    --border: rgba(20, 32, 48, 0.10);
    --ink: #132033;
    --muted: #5a6879;
    --faint: #8794a3;
    --line: rgba(20, 32, 48, 0.09);
    --accent: #1f5fbf;
    --accent-ink: #ffffff;
    --accent-soft: rgba(31, 95, 191, 0.12);
    --gold: #b27a12;
    --ok: #0f8a5f;
    --warn: #c77700;
    --bad: #c8343f;
    --chip: rgba(20, 32, 48, 0.055);
    --shadow: 0 10px 30px rgba(20, 40, 70, 0.16);
    --font: 13px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b121c; --panel: rgba(16, 24, 35, 0.9); --panel-solid: #121b27; --border: rgba(255,255,255,0.08); --ink: #e6edf5; --muted: #9eadbf; --faint: #6f7f92;
      --line: rgba(255,255,255,0.08); --accent: #5aa2ff; --accent-ink: #08111d; --accent-soft: rgba(90,162,255,0.16); --gold: #f2c25a; --ok: #3ccf8e; --warn: #f2a93b; --bad: #ff6b74;
      --chip: rgba(255,255,255,0.06); --shadow: 0 10px 30px rgba(0,0,0,0.45);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b121c; --panel: rgba(16, 24, 35, 0.9); --panel-solid: #121b27; --border: rgba(255,255,255,0.08); --ink: #e6edf5; --muted: #9eadbf; --faint: #6f7f92;
    --line: rgba(255,255,255,0.08); --accent: #5aa2ff; --accent-ink: #08111d; --accent-soft: rgba(90,162,255,0.16); --gold: #f2c25a; --ok: #3ccf8e; --warn: #f2a93b; --bad: #ff6b74;
    --chip: rgba(255,255,255,0.06); --shadow: 0 10px 30px rgba(0,0,0,0.45);
  }
  /* colour-blind safe status colours (Okabe-Ito) */
  :root[data-cb="on"] { --ok: #0072b2; --warn: #e69f00; --bad: #cc79a7; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font: 500 var(--font)/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  #scene { position: fixed; inset: 0; }
  #scene canvas { display: block; touch-action: none; outline: none; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .glass { background: var(--panel); border: 1px solid var(--border); box-shadow: var(--shadow); border-radius: 12px;
    backdrop-filter: blur(14px) saturate(1.3); -webkit-backdrop-filter: blur(14px) saturate(1.3); }
  .eyebrow { font-size: 10.5px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 11px; border-radius: 8px; border: 1px solid var(--border); background: var(--chip); font-weight: 650; white-space: nowrap; }
  .btn:hover { background: var(--accent-soft); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .btn[aria-pressed="true"], .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .seg { display: inline-flex; background: var(--chip); border-radius: 9px; padding: 3px; gap: 2px; border: 1px solid var(--border); }
  .seg button { border: 0; background: transparent; height: 28px; padding: 0 10px; border-radius: 7px; font-weight: 650; white-space: nowrap; }
  .seg button:hover { background: var(--accent-soft); }

  /* top bar */
  #top { position: fixed; top: 10px; left: 10px; right: 10px; display: flex; align-items: center; gap: 10px; padding: 7px 10px; z-index: 6; min-height: 52px; }
  .brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .brand .logo { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, #1f5fbf, #0f8a9f); display: grid; place-items: center; color: #fff; flex: none; }
  .brand .logo svg { width: 18px; height: 18px; fill: #fff; }
  .brand b { font-size: 14.5px; font-weight: 800; letter-spacing: -.01em; display: block; white-space: nowrap; }
  .brand small { color: var(--muted); font-size: 11px; white-space: nowrap; }
  .clock { font-variant-numeric: tabular-nums; font-weight: 800; font-size: 16px; padding: 4px 10px; border-radius: 8px; background: var(--chip); display: flex; align-items: center; gap: 7px; white-space: nowrap; }
  .clock span.d { font-size: 11px; font-weight: 700; color: var(--muted); }
  .kpis { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
  .kpis::-webkit-scrollbar { display: none; }
  .kpi { display: flex; flex-direction: column; padding: 3px 10px; border-radius: 8px; background: var(--chip); min-width: 84px; border: 1px solid transparent; text-align: left; }
  .kpi:hover { border-color: var(--border); }
  .kpi small { font-size: 10px; font-weight: 700; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
  .kpi b { font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .kpi b.ok { color: var(--ok); } .kpi b.warn { color: var(--warn); } .kpi b.bad { color: var(--bad); }
  .searchbox { position: relative; width: 210px; flex: none; }
  .searchbox input { width: 100%; height: 32px; border-radius: 8px; border: 1px solid var(--border); background: var(--chip); padding: 0 10px 0 30px; }
  .searchbox svg { position: absolute; left: 9px; top: 9px; width: 14px; height: 14px; stroke: var(--muted); fill: none; stroke-width: 2; }
  #results { position: absolute; top: 38px; left: 0; right: 0; max-height: 360px; overflow: auto; display: none; padding: 4px; z-index: 20; }
  #results.on { display: block; }
  #results button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 7px 9px; border-radius: 7px; }
  #results button:hover, #results button.sel { background: var(--accent-soft); }
  #results small { display: block; color: var(--muted); font-size: 11px; }

  /* left panel */
  #left { position: fixed; top: var(--hudTop, 72px); left: 10px; width: 262px; bottom: 132px; display: none; flex-direction: column; z-index: 5; overflow: hidden; }
  #left.on { display: flex; }
  #left .tabs { display: flex; gap: 2px; padding: 8px 8px 0; }
  #left .tabs button { flex: 1; border: 0; background: none; padding: 7px 4px; border-radius: 7px 7px 0 0; font-weight: 700; color: var(--muted); border-bottom: 2px solid transparent; }
  #left .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  #left .body { flex: 1; overflow-y: auto; padding: 8px 10px 12px; }
  .zone { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; background: none; padding: 6px 8px; border-radius: 8px; }
  .zone:hover { background: var(--accent-soft); }
  .zone .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .zone .k { margin-left: auto; font-size: 10.5px; color: var(--faint); font-weight: 700; }
  .zone.locked { color: var(--faint); }
  .group-h { margin: 10px 0 4px; }
  .row { display: flex; align-items: center; gap: 8px; padding: 5px 2px; }
  .row label { flex: 1; }
  .toggle { appearance: none; width: 34px; height: 20px; border-radius: 10px; background: var(--line); position: relative; cursor: pointer; flex: none; border: 1px solid var(--border); }
  .toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
  .toggle:checked { background: var(--accent); }
  .toggle:checked::after { left: 16px; }
  .lever { padding: 7px 0; border-bottom: 1px solid var(--line); }
  .lever .top { display: flex; align-items: center; gap: 6px; }
  .lever .top span { flex: 1; font-weight: 650; }
  .lever .stepper { display: inline-flex; align-items: center; gap: 4px; }
  .lever .stepper button { width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--border); background: var(--chip); font-weight: 800; }
  .lever .stepper b { min-width: 34px; text-align: center; font-variant-numeric: tabular-nums; }
  .lever small { color: var(--muted); font-size: 11px; }
  .bar { height: 5px; border-radius: 3px; background: var(--line); margin-top: 5px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--ok); }

  /* right info panel */
  #info { position: fixed; top: var(--hudTop, 72px); right: 10px; width: 360px; bottom: 132px; display: none; flex-direction: column; z-index: 7; overflow: hidden; }
  #info.on { display: flex; }
  #info header { padding: 12px 14px 8px; border-bottom: 1px solid var(--line); }
  #info header h2 { margin: 2px 0 4px; font-size: 17px; letter-spacing: -.01em; }
  #info header .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  #info .close { position: absolute; right: 10px; top: 10px; width: 30px; height: 30px; border-radius: 8px; border: 0; background: var(--chip); font-size: 16px; }
  #info .tabs { display: flex; gap: 2px; padding: 0 10px; border-bottom: 1px solid var(--line); }
  #info .tabs button { border: 0; background: none; padding: 8px 8px; font-weight: 700; color: var(--muted); border-bottom: 2px solid transparent; }
  #info .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  #info .content { flex: 1; overflow-y: auto; padding: 12px 14px 16px; }
  #info p { margin: 0 0 10px; }
  #info ol { margin: 0; padding-left: 20px; }
  #info ol li { margin-bottom: 6px; }
  .reg { padding: 8px 10px; border-radius: 8px; background: var(--chip); margin-bottom: 7px; }
  .reg b { display: block; font-size: 11.5px; color: var(--accent); }
  .data { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; }
  .data div:nth-child(odd) { color: var(--muted); }
  .data div:nth-child(even) { font-weight: 700; text-align: right; }
  .rolechip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 99px; background: var(--chip); border: 1px solid var(--border); margin: 0 6px 6px 0; }
  .timeline { list-style: none; padding: 0; margin: 0; }
  .timeline li { display: grid; grid-template-columns: 44px 1fr; gap: 8px; padding: 4px 0; border-bottom: 1px dashed var(--line); }
  .timeline li span { color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 700; }
  .live { padding: 9px 10px; border-radius: 9px; background: var(--accent-soft); margin-bottom: 10px; }
  .live b { color: var(--accent); }

  /* bottom bar */
  #bottom { position: fixed; left: 10px; right: 10px; bottom: 10px; display: flex; align-items: center; gap: 10px; padding: 7px 10px; z-index: 6; overflow-x: auto; scrollbar-width: none; }
  #bottom::-webkit-scrollbar { display: none; }
  #bottom .grp { display: flex; align-items: center; gap: 6px; flex: none; }
  #bottom select { height: 32px; border-radius: 8px; border: 1px solid var(--border); background: var(--chip); padding: 0 8px; font-weight: 650; }
  .fps { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 11.5px; white-space: nowrap; }

  /* minimap + log */
  #mini { position: fixed; right: 10px; bottom: 64px; width: 236px; height: 172px; padding: 6px; z-index: 5; }
  #mini canvas { width: 100%; height: 100%; display: block; border-radius: 8px; cursor: crosshair; }
  #log { position: fixed; left: 282px; bottom: 64px; width: 360px; max-height: 128px; overflow: hidden; padding: 7px 10px; z-index: 4; font-size: 12px; }
  #log ul { list-style: none; margin: 0; padding: 0; }
  #log li { display: flex; gap: 8px; padding: 1px 0; }
  #log li span { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
  #log li.warn b { color: var(--warn); } #log li.go b { color: var(--ok); } #log li b { font-weight: 600; }

  /* labels */
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .lbl { position: absolute; transform: translate(-50%, -100%); pointer-events: auto; padding: 3px 8px; border-radius: 99px; font-size: 11.5px; font-weight: 750; white-space: nowrap;
    background: rgba(12, 22, 36, 0.78); color: #fff; border: 1px solid rgba(255,255,255,0.18); cursor: pointer; }
  .lbl.locked { opacity: .65; }
  .lbl:hover { background: var(--accent); color: var(--accent-ink); }

  /* modals */
  .modal { position: fixed; inset: 0; display: none; place-items: center; z-index: 30; background: rgba(5, 10, 18, 0.45); padding: 16px; }
  .modal.on { display: grid; }
  .modal .card { width: min(860px, 100%); max-height: min(86vh, 900px); display: flex; flex-direction: column; overflow: hidden; background: var(--panel-solid); }
  .modal header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .modal header h2 { margin: 0; font-size: 17px; flex: 1; }
  .modal .content { overflow: auto; padding: 14px; }
  table.fl { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  table.fl th { text-align: left; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 6px; border-bottom: 1px solid var(--line); }
  table.fl td { padding: 7px 6px; border-bottom: 1px solid var(--line); }
  table.fl tr.click { cursor: pointer; }
  table.fl tr.click:hover td { background: var(--accent-soft); }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11.5px; font-weight: 750; background: var(--chip); }
  .pill.ok { color: var(--ok); } .pill.warn { color: var(--warn); } .pill.bad { color: var(--bad); }
  .quiz-q { font-size: 16px; font-weight: 700; margin: 4px 0 12px; }
  .quiz-o { display: block; width: 100%; text-align: left; padding: 10px 12px; margin-bottom: 7px; border-radius: 9px; border: 1px solid var(--border); background: var(--chip); }
  .quiz-o.right { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 15%, transparent); }
  .quiz-o.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 15%, transparent); }
  .gl { display: grid; grid-template-columns: 150px 1fr; gap: 6px 14px; }
  .gl dt { font-weight: 800; }
  .gl dd { margin: 0; color: var(--muted); }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .card2 { padding: 10px 12px; border-radius: 10px; background: var(--chip); border: 1px solid var(--border); }
  .spark { width: 100%; height: 48px; display: block; }

  /* explainer + cctv + follow */
  #explainer { position: fixed; left: 50%; bottom: 74px; transform: translateX(-50%); width: min(620px, calc(100% - 24px)); padding: 12px 14px; z-index: 12; display: none; }
  #explainer.on { display: block; }
  #explainer .steps { display: flex; gap: 4px; margin: 8px 0; }
  #explainer .steps i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
  #explainer .steps i.on { background: var(--accent); }
  #explainer p { margin: 0; font-size: 14px; font-weight: 600; }
  #explainer .acts { display: flex; gap: 6px; margin-top: 10px; justify-content: flex-end; }
  #cctv { position: fixed; inset: 0; pointer-events: none; z-index: 2; display: none; }
  #cctv.on { display: block; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.12) 0 1px, transparent 1px 3px); }
  #cctv .tag { position: absolute; top: calc(var(--hudTop, 72px) + 44px); left: 50%; transform: translateX(-50%); font: 700 13px ui-monospace, monospace; color: #fff; background: rgba(0,0,0,.55); padding: 4px 10px; border-radius: 6px; }
  #cctv .rec { color: #ff4d4d; }
  #chip { position: fixed; top: var(--hudTop, 72px); left: 50%; transform: translateX(-50%); padding: 6px 8px 6px 12px; z-index: 8; display: none; align-items: center; gap: 8px; font-weight: 650; }
  #chip.on { display: flex; }
  #crisis { position: fixed; top: calc(var(--hudTop, 72px) + 8px); left: 50%; transform: translateX(-50%); width: min(560px, calc(100% - 24px)); padding: 14px; z-index: 14; display: none; border: 2px solid var(--bad); }
  #crisis.on { display: block; }
  #crisis h3 { margin: 2px 0 6px; font-size: 16px; }
  #crisis .opts button { display: block; width: 100%; text-align: left; margin-top: 7px; padding: 9px 11px; border-radius: 9px; border: 1px solid var(--border); background: var(--chip); }
  #crisis .opts button:hover { background: var(--accent-soft); }
  #crisis .timer { height: 4px; background: var(--line); border-radius: 2px; margin: 8px 0; overflow: hidden; }
  #crisis .timer i { display: block; height: 100%; background: var(--bad); }
  #tour { position: fixed; z-index: 25; width: min(340px, calc(100% - 24px)); padding: 14px; display: none; }
  #tour.on { display: block; }
  #tour h3 { margin: 2px 0 6px; font-size: 15px; }
  #tour p { margin: 0 0 10px; }
  #joy { position: fixed; left: 22px; bottom: 80px; width: 110px; height: 110px; border-radius: 50%; z-index: 9; display: none; touch-action: none; }
  #joy.on { display: block; }
  #joy i { position: absolute; left: 35px; top: 35px; width: 40px; height: 40px; border-radius: 50%; background: var(--accent); opacity: .85; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 50; background: var(--bg); }
  #loading .in { text-align: center; }
  #loading .bar { width: 240px; height: 6px; margin: 14px auto 0; }
  #loading .bar i { width: 0; transition: width .2s; background: var(--accent); }
  #err { position: fixed; inset: 0; display: none; place-items: center; z-index: 60; background: var(--bg); padding: 20px; text-align: center; }

  .menu-btn { display: none; }
  @media (max-width: 1499px) { #top { flex-wrap: wrap; } .kpis { order: 5; flex-basis: 100%; } }
  @media (max-width: 1180px) { .searchbox { width: 160px; } #log { display: none; } }
  @media (max-width: 900px) {
    #top { flex-wrap: wrap; top: 8px; left: 8px; right: 8px; gap: 8px; }
    .brand small, .searchbox { display: none; }
    .kpis { order: 5; flex-basis: 100%; }
    #left, #info { top: auto; bottom: 64px; left: 8px; right: 8px; width: auto; max-height: 52vh; }
    #mini { display: none; }
    .menu-btn { display: inline-flex; }
    #bottom { left: 8px; right: 8px; bottom: 8px; }
    .modal { padding: 8px; }
    .gl { grid-template-columns: 1fr; }
    #explainer { bottom: 66px; }
  }
  @media (max-width: 560px) {
    .brand > div:last-child { display: none; }
    #top { gap: 6px; padding: 6px 8px; }
    .btn { height: 30px; padding: 0 8px; }
    .seg button { padding: 0 7px; height: 26px; }
    .clock { font-size: 14px; padding: 3px 8px; }
    .clock span.d { display: none; }
    .kpi { min-width: 74px; padding: 2px 8px; }
    .kpi b { font-size: 13.5px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="scene" aria-label="3D view of SKY International airport. Click objects and people to learn about them."></div>
<div id="labels" aria-hidden="true"></div>
<div id="cctv"><div class="tag"><span class="rec">● REC</span> <span id="cctvName"></span> <span id="cctvTime"></span></div></div>

<header id="top" class="glass">
  <div class="brand">
    <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg></div>
    <div><b>SkyOps</b><small>SKY International</small></div>
  </div>
  <button class="btn menu-btn" id="menuBtn" aria-label="Zones and layers">☰</button>
  <div class="clock" aria-live="off"><span id="dayIcon" aria-hidden="true">☀</span><span id="clock">06:00</span><span class="d" id="wxLabel">Clear</span></div>
  <div class="kpis" id="kpis" role="group" aria-label="Key performance indicators"></div>
  <div class="searchbox">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="search" type="search" placeholder="Search: security, K9, runway 27…" aria-label="Search the airport" autocomplete="off">
    <div id="results" class="glass" role="listbox"></div>
  </div>
  <div class="seg" role="group" aria-label="Mode">
    <button data-mode="sandbox" aria-pressed="true">Sandbox</button>
    <button data-mode="ops" aria-pressed="false">Operations</button>
    <button data-mode="crisis" aria-pressed="false">Crisis</button>
  </div>
  <button class="btn" id="flightsBtn" aria-label="Flight board">Flights</button>
  <button class="btn" id="learnBtn" aria-label="Learn: quiz, glossary, dashboard">Learn</button>
  <button class="btn" id="settingsBtn" aria-label="Settings and accessibility">⚙</button>
  <button class="btn" id="helpBtn" aria-label="Help and keyboard shortcuts">?</button>
</header>

<aside id="left" class="glass" aria-label="Zones, layers and staffing">
  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="zones">Zones</button>

    let best = null, bd = Infinity;
    Object.keys(N).forEach((k) => {
      if (filter && !filter(k)) return;
      const d = Math.hypot(N[k].x - x, N[k].z - z);
      if (d < bd) { bd = d; best = k; }
    });
    return best;
  };
  return L;
})();

  ],
};

SK.AIRCRAFT_TYPES = {
  narrow: { name: 'A321neo-class narrow-body', seats: 196, figures: 0, crew: { pilots: 2, cabin: 5 }, boardBefore: 40 },
  wide: { name: '787-9-class wide-body', seats: 296, figures: 0, crew: { pilots: 3, cabin: 10 }, boardBefore: 50 },
};

// Gate turn timing, in sim minutes relative to scheduled departure (STD)
SK.TURN = {
  inboundBlock: -80,     // inbound aircraft should be on stand by STD-80
  checkinClose: -60,
  bagCartLeaves: -28,
  gateClose: -15,
  spawnFrom: -205,       // first passengers reach the curb
  spawnTo: -100,
};

// Build departures for one gate list across a time window. Deterministic for a seed.
// Returns flights sorted by STD. Each flight: { id, airline, num, dest, city, gate, wide, std (sim s), loadFactor, pax, figures }
SK.buildSchedule = function (gates, fromSec, toSec, rng) {
  const out = [];
  let n = 0;
  gates.forEach((g, gi) => {
    const period = g.wide ? 135 : g.bus ? 120 : 100;   // minutes between departures on this gate
    let t = fromSec + SK.minutes(20 + gi * 23);
    while (t < toSec) {
      const al = SK.AIRLINES[(gi + n) % SK.AIRLINES.length];
      const kind = g.wide ? 'wide' : 'narrow';
      const d = SK.DESTS[kind][Math.floor(rng.next() * SK.DESTS[kind].length)];
      const lf = 0.74 + rng.next() * 0.2;
      const seats = SK.AIRCRAFT_TYPES[kind].seats;
      const pax = Math.round(seats * lf);
      out.push({
        id: 'F' + n, airline: al, num: al.code + ' ' + (100 + ((gi * 211 + n * 37) % 880)),
        dest: d[0], city: d[1], gate: g.id, wide: g.wide, bus: g.bus, std: t, etd: t,
        loadFactor: lf, pax, figures: Math.max(6, Math.round(pax / SK.PAX_PER_FIGURE)),
        status: 'Scheduled', delayMin: 0, boarded: 0, spawned: 0, bagsAccepted: 0, bagsLoaded: 0, bagsShort: 0,
      });
      n++;
      t += SK.minutes(period + Math.round(rng.range(-6, 10)));
    }
  });
  out.sort((a, b) => a.std - b.std);
  return out;
};

// Gate moves for a flight. A stand is busy from about STD-85 to STD+5, so two departures on one gate
// must be at least 90 minutes apart. Returns [{ gate, swap }]: a plain move when the gate is free,
// otherwise a swap with the one flight on that gate within 60 minutes, when both can move and both fit. Pure.
SK.gateOptions = function (flights, f, gates) {
  const GAP = SK.minutes(90);
  const fits = (fl, gid, ignore) => {
    const g = gates.find((x) => x.id === gid);
    return (!fl.wide || g.wide) && !flights.some((o) => o !== fl && !ignore.includes(o) && o.gate === gid && !o.departed && Math.abs(o.std - fl.std) < GAP);
  };
  const out = [];
  gates.forEach((g) => {
    if (g.id === f.gate) return;
    if (fits(f, g.id, [])) { out.push({ gate: g.id, swap: null }); return; }
    const near = flights.filter((o) => o !== f && o.gate === g.id && !o.departed && Math.abs(o.std - f.std) < SK.minutes(60));
    if (near.length !== 1) return;
    const o = near[0];
    if (!SK.gateChangeable(o) || !fits(f, g.id, [o]) || !fits(o, f.gate, [f])) return;
    out.push({ gate: g.id, swap: o });
  });
  return out;
};
// A gate can change only before the inbound aircraft is airborne toward it and before the crew walks there.
SK.gateChangeable = (f) => !f.plane && !f.crewSent && !f.boarding && !f.offBlock && !f.cargo;

// Departure board status from the current sim time and flight state
SK.flightStatus = function (f, now) {
  const m = (f.etd - now) / 60;
  if (f.departed) return 'Departed';
  if (f.offBlock) return 'Taxiing';
  if (f.gateClosed) return 'Gate closed';
  if (f.boarding) return m <= 25 ? 'Final call' : 'Boarding';
  if (f.delayMin >= 15) return 'Delayed';
  if (m <= -SK.TURN.checkinClose && m > -SK.TURN.gateClose) return 'Go to gate';
  if (m <= -SK.TURN.spawnFrom) return 'Check-in open';
  return 'Scheduled';
};

// ===== sim/queue.js =====
// SkyOps queues and stations. Pure logic: no DOM, no Three.js. Times are sim seconds.

// Serpentine (snake) queue inside a rectangle. Slot 0 is the head.
// headX: 'x0' | 'x1' side where the head row starts; headZ: 'z0' | 'z1' row nearest the servers.
SK.serpentine = function (rect, opts) {
  opts = opts || {};
  const sp = opts.spacing || 0.85, gap = opts.rowGap || 1.3;
  const headZ = opts.headZ || 'z0', headX = opts.headX || 'x0';
  const zDir = headZ === 'z0' ? 1 : -1;
  const zStart = rect[headZ] + zDir * gap * 0.5;
  const rows = Math.max(1, Math.floor(Math.abs(rect.z1 - rect.z0) / gap));
  const xa = rect.x0 + 0.6, xb = rect.x1 - 0.6;
  const perRow = Math.max(1, Math.floor((xb - xa) / sp) + 1);
  const slots = [], ropes = [], posts = [];
  for (let r = 0; r < rows; r++) {
    const z = zStart + zDir * r * gap;
    const forward = (r % 2 === 0) === (headX === 'x0');
    for (let i = 0; i < perRow; i++) {
      const x = forward ? xa + i * sp : xb - i * sp;
      slots.push({ x, z });
    }
    if (r < rows - 1) {
      // rope between this row and the next, open at the turning end
      const rz = z + zDir * gap * 0.5;
      const turnAtB = forward;
      const r0 = turnAtB ? rect.x0 : rect.x0 + 1.6, r1 = turnAtB ? rect.x1 - 1.6 : rect.x1;
      ropes.push([r0, rz, r1, rz]);
    }
  }
  // posts along each rope at ~2.4 m
  ropes.forEach((r) => {
    const n = Math.max(1, Math.round((r[2] - r[0]) / 2.4));
    for (let i = 0; i <= n; i++) posts.push([r[0] + ((r[2] - r[0]) * i) / n, r[1]]);
  });
  return { slots, ropes, posts };
};

SK.Queue = class {
  constructor(slots, overflow) {
    this.slots = slots;
    this.overflow = overflow || { dx: 0, dz: 0.8 };
    this.list = [];
    this.onShift = null;    // (agent, pos) => void
  }
  get length() { return this.list.length; }
  slotFor(i) {
    if (i < this.slots.length) return this.slots[i];
    const tail = this.slots[this.slots.length - 1];
    const k = i - this.slots.length + 1;
    // overflow spills out of the tail in a short zig so figures don't stack on one point
    return { x: tail.x + this.overflow.dx * k + (k % 2 ? 0.35 : -0.35), z: tail.z + this.overflow.dz * k };
  }
  join(agent) {
    this.list.push(agent);
    agent.queueIdx = this.list.length - 1;
    return this.slotFor(agent.queueIdx);
  }
  head() { return this.list[0] || null; }
  remove(agent) {
    const i = this.list.indexOf(agent);
    if (i < 0) return false;
    this.list.splice(i, 1);
    agent.queueIdx = -1;
    for (let k = i; k < this.list.length; k++) {
      this.list[k].queueIdx = k;
      if (this.onShift) this.onShift(this.list[k], this.slotFor(k));
    }
    return true;
  }
};

// A station has a queue and servers. Each server is a pipeline of one or more stages
// (a check-in desk is one stage; a security lane is divest -> scan -> recompose).
// An agent advances to the next stage only when that stage is empty, so the slowest
// stage sets the lane's throughput, as on a real checkpoint.
SK.Station = class {
  constructor(o) {
    this.name = o.name;
    this.queue = o.queue;
    this.service = o.service;            // (agent, stageIdx, server) => sim seconds
    this.onMove = o.onMove || null;      // (agent, pos, stageIdx, server) => void
    this.onDone = o.onDone || null;      // (agent, server) => void
    this.onStage = o.onStage || null;    // (agent, stageIdx, server) => void  (service starts)
    this.accept = o.accept || null;      // optional (agent, server) => bool  (e.g. e-gate eligibility)
    this.meanCycle = o.meanCycle || 120; // sim seconds per agent at the bottleneck stage, for predictions
    this.servers = o.servers.map((s, i) => ({
      id: i, label: s.label || String(i + 1), open: s.open !== false, x: s.x, z: s.z,
      stages: (s.stages || [{ x: s.x, z: s.z }]).map((p) => ({ x: p.x, z: p.z, virtual: !!p.virtual, agent: null, until: 0 })),
      served: 0, busySince: 0,
    }));
    this.served = 0;
    this.waits = [];                     // { t, w } sim seconds
  }
  openCount() { return this.servers.filter((s) => s.open).length; }
  setOpen(n) {
    this.servers.forEach((s, i) => (s.open = i < n));
  }
  idle(server) { return server.stages.every((st) => !st.agent); }
  update(now) {
    for (const s of this.servers) {
      const st = s.stages;
      for (let k = st.length - 1; k >= 0; k--) {
        const g = st[k];
        if (!g.agent) continue;
        // virtual stages (lane loading places) start their timer on assignment, not on arrival,
        // so several passengers can be walking toward one lane at once
        if (g.until === 0 && (g.agent.arrived || g.virtual)) {
          g.until = now + Math.max(1, this.service(g.agent, k, s));
          if (this.onStage) this.onStage(g.agent, k, s);
        }
        if (g.until > 0 && now >= g.until) {
          if (k === st.length - 1) {
            const a = g.agent;
            g.agent = null; g.until = 0;
            s.served++; this.served++;
            a.server = null;
            if (this.onDone) this.onDone(a, s);
          } else if (!st[k + 1].agent) {
            const a = g.agent;
            g.agent = null; g.until = 0;
            st[k + 1].agent = a; st[k + 1].until = 0;
            a.arrived = false;
            if (this.onMove) this.onMove(a, st[k + 1], k + 1, s);
          }
        }
      }
      // pull the next agent from the queue head when the first stage is free
      if (s.open && !st[0].agent) {
        const h = this.queue.head();
        if (h && h.arrived && (!this.accept || this.accept(h, s))) {
          this.queue.remove(h);
          this.waits.push({ t: now, w: now - (h.qJoin || now) });
          if (this.waits.length > 400) this.waits.splice(0, 100);
          st[0].agent = h; st[0].until = 0;
          h.server = s;
          h.arrived = false;
          if (this.onMove) this.onMove(h, st[0], 0, s);
        }
      }
    }
  }
  // Observed mean wait over a trailing window, in sim seconds
  observedWait(now, windowSec) {
    const from = now - (windowSec || 1800);
    let n = 0, sum = 0;
    for (const w of this.waits) if (w.t >= from) { n++; sum += w.w; }
    return n ? sum / n : 0;
  }
  // What an airport wait-time screen would show: queue length times bottleneck cycle over open servers
  predictedWait() {
    const open = this.openCount();
    if (!open) return this.queue.length ? Infinity : 0;
    return (this.queue.length * this.meanCycle) / open;
  }
};

// ===== sim/search.js =====
// SkyOps search. Pure logic. Items: { id, type, title, text, keywords? }
SK.norm = (s) => String(s || '').toLowerCase().replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();

SK.searchItems = function (items, query, limit) {
  const q = SK.norm(query);
  if (!q) return [];
  const qt = q.split(' ');
  const scored = [];
  for (const it of items) {
    const title = SK.norm(it.title);
    const hay = title + ' ' + SK.norm(it.keywords || '') + ' ' + SK.norm(it.text || '');
    let score = 0;
    if (title === q) score += 100;
    else if (title.startsWith(q)) score += 60;
    else if (title.includes(q)) score += 40;
    let all = true;
    for (const t of qt) {
      const words = hay.split(' ');
      if (words.some((w) => w === t)) score += 12;
      else if (words.some((w) => w.startsWith(t))) score += 8;
      else if (hay.includes(t)) score += 3;
      else all = false;
    }
    if (!all && score < 40) continue;
    if (it.type === 'zone') score += 4;
    scored.push({ it, score });
  }
  scored.sort((a, b) => b.score - a.score || a.it.title.length - b.it.title.length);
  return scored.slice(0, limit || 8).map((s) => s.it);
};

// ===== engine/renderer.js =====
// SkyOps engine: renderer, scene, camera, post-processing, main loop, picking, adaptive quality.
SK.engine = (function () {
  const E = {};
  const host = document.getElementById('scene');
  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(host.clientWidth, host.clientHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  host.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(42, host.clientWidth / host.clientHeight, 0.8, 4000);
  camera.position.set(150, 150, 190);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 0, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.maxPolarAngle = 1.47;
  controls.minDistance = 4;
  controls.maxDistance = 1100;
  controls.screenSpacePanning = false;
  controls.keyPanSpeed = 22;

  const composer = new THREE.EffectComposer(renderer);
  composer.addPass(new THREE.RenderPass(scene, camera));
  const bloom = new THREE.UnrealBloomPass(new THREE.Vector2(host.clientWidth, host.clientHeight), 0.35, 0.5, 0.86);
  composer.addPass(bloom);

  E.renderer = renderer; E.scene = scene; E.camera = camera; E.controls = controls; E.bloom = bloom; E.host = host;
  E.quality = { level: 3, bloom: true, shadows: true };

  function resize() {
    const w = host.clientWidth, h = host.clientHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
    composer.setSize(w, h);
  }
  window.addEventListener('resize', resize);

  // ---------- picking ----------
  // add(object, entryId | (hit) => {entry, target}) ; instanced meshes resolve by instanceId
  const pickables = [];
  const ray = new THREE.Raycaster();
  const ndc = new THREE.Vector2();
  E.pick = {
    add(obj, resolver) { obj.userData.pick = resolver; pickables.push(obj); },
    remove(obj) { const i = pickables.indexOf(obj); if (i >= 0) pickables.splice(i, 1); },
    at(clientX, clientY) {
      const r = renderer.domElement.getBoundingClientRect();
      ndc.set(((clientX - r.left) / r.width) * 2 - 1, -((clientY - r.top) / r.height) * 2 + 1);
      ray.setFromCamera(ndc, camera);
      const hits = ray.intersectObjects(pickables.filter((o) => o.visible && isShown(o)), true);
      for (const h of hits) {
        let o = h.object;
        while (o && !o.userData.pick) o = o.parent;
        if (!o) continue;
        const p = o.userData.pick;
        const res = typeof p === 'function' ? p(h) : { entry: p };
        if (res) return Object.assign({ point: h.point }, res);
      }
      return null;
    },
  };
  function isShown(o) { for (let p = o; p; p = p.parent) if (!p.visible) return false; return true; }

  // click vs drag: only treat as a click if the pointer barely moved
  let down = null;
  renderer.domElement.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; });
  renderer.domElement.addEventListener('pointerup', (e) => {
    if (!down) return;
    const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
    if (moved < 6 && performance.now() - down.t < 500) SK.bus.emit('click', { x: e.clientX, y: e.clientY, hit: E.pick.at(e.clientX, e.clientY) });
    down = null;
  });

  // ---------- loop ----------
  const updaters = [];   // fn(dtGame, dtReal, now)
  E.onFrame = (fn) => updaters.push(fn);
  E.speed = 1;
  E.paused = false;
  const clock = new THREE.Clock();
  let fpsAcc = 0, fpsFrames = 0, fpsAvg = 60, lowFor = 0, highFor = 0;
  E.fps = () => fpsAvg;

  function setQuality(level) {
    E.quality.level = level;
    const pr = Math.min(window.devicePixelRatio, 2);
    renderer.setPixelRatio(level >= 3 ? pr : level === 2 ? Math.min(pr, 1.25) : 1);
    E.quality.shadows = level >= 2;
    E.quality.bloom = level >= 1 && !E.reducedMotionBloomOff;
    bloom.enabled = E.quality.bloom;

// SkyOps sky: day/night lighting tied to the sim clock, and weather (rain, fog, snow, storm).
SK.sky = (function () {
  const E = SK.engine, scene = E.scene;
  const S = { night: 0, weather: 'clear', override: null, flash: 0 };

  const hemi = new THREE.HemisphereLight(0xdfeeff, 0x6b6250, 0.75);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xffffff, 2.2);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.bias = -0.0025;
  sun.shadow.normalBias = 0.12;
  scene.add(sun, sun.target);
  E.sun = sun;
  const fog = new THREE.Fog(0xcfe0ee, 500, 2600);
  scene.fog = fog;
  scene.background = new THREE.Color(0xbcd6ec);

  // stars
  const starGeo = new THREE.BufferGeometry();
  const sp = new Float32Array(1500 * 3);
  for (let i = 0; i < 1500; i++) {
    const th = Math.random() * Math.PI * 2, ph = Math.random() * 1.3;
    sp[i * 3] = 1800 * Math.sin(ph) * Math.cos(th); sp[i * 3 + 1] = 1800 * Math.cos(ph) + 100; sp[i * 3 + 2] = 1800 * Math.sin(ph) * Math.sin(th);
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(sp, 3));
  const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 2.2, sizeAttenuation: false, transparent: true, opacity: 0, fog: false, depthWrite: false });
  const stars = new THREE.Points(starGeo, starMat);
  scene.add(stars);

  // materials that glow at night: [material, dayIntensity, nightIntensity]
  const glows = [];
  S.glow = (mat, day, night) => { glows.push([mat, day, night]); mat.emissiveIntensity = day; };
  S.glow(SK.kit.mat.lightStrip, 0.0, 1.3);
  S.glow(SK.kit.mat.screen, 0.55, 1.0);
  S.glow(SK.kit.mat.screenWarm, 0.6, 1.1);

  const cDay = new THREE.Color(0xbcd6ec), cDusk = new THREE.Color(0xe7a77a), cNight = new THREE.Color(0x0b1424), cOvercast = new THREE.Color(0x9aa6b1), cStorm = new THREE.Color(0x4a525c);
  const tmpC = new THREE.Color();

  // ---------- weather ----------
  const W = {
    clear: { label: 'Clear', cloud: 0, fogNear: 500, fogFar: 2600, rain: 0, snow: 0, taxi: 1, delayMin: 0, ramp: true, vis: '10+ km' },
    rain: { label: 'Rain', cloud: 0.6, fogNear: 200, fogFar: 1300, rain: 1, snow: 0, taxi: 0.85, delayMin: 6, ramp: true, vis: '5 km' },
    fog: { label: 'Fog', cloud: 0.5, fogNear: 10, fogFar: 260, rain: 0, snow: 0, taxi: 0.6, delayMin: 18, ramp: true, vis: '400 m (LVP)' },
    snow: { label: 'Snow', cloud: 0.7, fogNear: 60, fogFar: 700, rain: 0, snow: 1, taxi: 0.7, delayMin: 22, ramp: true, vis: '1.5 km', deice: true },
    storm: { label: 'Thunderstorm', cloud: 1, fogNear: 80, fogFar: 900, rain: 2, snow: 0, taxi: 0.75, delayMin: 30, ramp: false, vis: '3 km' },
  };
  S.types = W;
  S.ops = () => W[S.weather];

  const RAIN_N = 4000, AREA = 120, TOP = 70;
  const rainPos = new Float32Array(RAIN_N * 6);
  for (let i = 0; i < RAIN_N; i++) {
    const x = (Math.random() - 0.5) * AREA, y = Math.random() * TOP, z = (Math.random() - 0.5) * AREA;
    rainPos.set([x, y, z, x + 0.15, y + 1.1, z], i * 6);
  }
  const rainGeo = new THREE.BufferGeometry();
  rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
  const rain = new THREE.LineSegments(rainGeo, new THREE.LineBasicMaterial({ color: 0xaac4dc, transparent: true, opacity: 0.45 }));
  rain.frustumCulled = false; rain.visible = false;
  scene.add(rain);

  const SNOW_N = 3500;
  const snowPos = new Float32Array(SNOW_N * 3);
  for (let i = 0; i < SNOW_N; i++) snowPos.set([(Math.random() - 0.5) * AREA, Math.random() * TOP, (Math.random() - 0.5) * AREA], i * 3);
  const snowGeo = new THREE.BufferGeometry();
  snowGeo.setAttribute('position', new THREE.BufferAttribute(snowPos, 3));
  const snow = new THREE.Points(snowGeo, new THREE.PointsMaterial({ map: SK.kit.puff, depthWrite: false, color: 0xffffff, size: 0.35, transparent: true, opacity: 0.9 }));
  snow.frustumCulled = false; snow.visible = false;
  scene.add(snow);

  S.setWeather = function (w) {
    if (!W[w]) return;
    S.weather = w;
    rain.visible = W[w].rain > 0;
    snow.visible = W[w].snow > 0;
    rain.material.opacity = W[w].rain > 1 ? 0.6 : 0.42;
    SK.bus.emit('weather', w);
  };

  let flashTimer = 8;
  S.update = function (dtGame, dtReal, simSec) {
    // ----- sun -----
    const hour = S.override != null ? S.override : (simSec / 3600) % 24;
    const dayT = (hour - 6) / 13;             // 0 at sunrise (06:00), 1 at sunset (19:00)
    const elev = Math.sin(Math.PI * SK.clamp(dayT, -0.25, 1.25));
    const az = Math.PI * SK.clamp(dayT, -0.2, 1.2);
    const w = W[S.weather];
    const t = E.controls.target;
    const dist = E.camera.position.distanceTo(t);
    const half = SK.clamp(dist * 0.7, 50, 300);
    // shadow box follows the view; snapped to a grid so shadows do not shimmer while panning
    const snap = half / 8;
    const cx = Math.round(t.x / snap) * snap, cz = Math.round(t.z / snap) * snap;
    const se = Math.max(0.12, elev);
    sun.position.set(cx + Math.cos(az) * 300, 40 + se * 300, cz + 120 + Math.sin(az) * 80);
    sun.target.position.set(cx, 0, cz);
    const sc = sun.shadow.camera;
    if (sc.right !== half) { sc.left = -half; sc.right = half; sc.top = half; sc.bottom = -half; sc.near = 10; sc.far = 900; sc.updateProjectionMatrix(); }

    const day = SK.clamp(elev * 2.2, 0, 1);       // 0 night .. 1 full day
    const dusk = SK.clamp(1 - Math.abs(elev) * 4, 0, 1) * (dayT > -0.2 && dayT < 1.2 ? 1 : 0);
    S.night = 1 - day;
    const overcast = w.cloud;
    sun.intensity = (0.1 + 1.0 * day) * (1 - overcast * 0.75);
    sun.color.setHSL(0.09 + 0.04 * day, 0.7 - 0.5 * day, 0.6 + 0.3 * day);
    if (S.night > 0.8) sun.color.set(0x9db4ff);
    hemi.intensity = 0.18 + 0.32 * day + (S.flash > 0 ? S.flash * 2.5 : 0);

    tmpC.copy(cNight).lerp(cDay, day);
    if (dusk > 0) tmpC.lerp(cDusk, dusk * 0.55);
    if (overcast) tmpC.lerp(S.weather === 'storm' ? cStorm : cOvercast, overcast * (0.4 + 0.6 * day) * 0.85);
    if (S.flash > 0) tmpC.lerp(new THREE.Color(0xdde6ff), S.flash);
    scene.background.copy(tmpC);
    fog.color.copy(tmpC);
    fog.near = w.fogNear; fog.far = w.fogFar * (0.75 + 0.25 * day);
    starMat.opacity = SK.clamp((S.night - 0.6) * 2.5, 0, 1) * (1 - overcast);
    E.renderer.toneMappingExposure = 0.9 - 0.08 * day;
    glows.forEach(([m, d, n]) => (m.emissiveIntensity = SK.lerp(d, n, S.night)));
    E.bloom.strength = 0.25 + 0.55 * S.night;

    // ----- precipitation follows the camera target -----
    if (rain.visible) {
      const fall = (w.rain > 1 ? 70 : 48) * dtReal;
      const p = rainGeo.attributes.position.array;
      for (let i = 0; i < RAIN_N; i++) {
        const o = i * 6;
        p[o + 1] -= fall; p[o + 4] -= fall;
        if (p[o + 1] < 0) { p[o + 1] += TOP; p[o + 4] += TOP; }
      }
      rainGeo.attributes.position.needsUpdate = true;
      rain.position.set(t.x, 0, t.z);
    }
    if (snow.visible) {
      const p = snowGeo.attributes.position.array, tt = performance.now() * 0.001;
      for (let i = 0; i < SNOW_N; i++) {
        const o = i * 3;
        p[o + 1] -= 2.2 * dtReal;
        p[o] += Math.sin(tt + i) * 0.6 * dtReal;
        if (p[o + 1] < 0) p[o + 1] += TOP;
      }
      snowGeo.attributes.position.needsUpdate = true;
      snow.position.set(t.x, 0, t.z);
    }
    // ----- lightning -----
    if (S.weather === 'storm') {
      flashTimer -= dtReal;
      if (flashTimer <= 0) { S.flash = 1; flashTimer = 4 + Math.random() * 9; SK.bus.emit('lightning'); }
    }
    if (S.flash > 0) S.flash = Math.max(0, S.flash - dtReal * (S.flash > 0.5 ? 6 : 2.5));
  };
  return S;
})();

    const polar = o.polar != null ? o.polar : C.mode === 'top' ? 0.02 : SK.clamp(a.polar, 0.5, 1.05);
    const az = o.az != null ? o.az : a.az;
    const endPos = o.pos ? new THREE.Vector3(o.pos[0], o.pos[1], o.pos[2]) : posFrom(target, r, polar, az);
    const dur = SK.reducedMotion ? 0 : o.dur != null ? o.dur : 1.4;
    fly = { t: 0, dur, p0: cam.position.clone(), p1: endPos, q0: ctl.target.clone(), q1: target, arc: Math.min(120, cam.position.distanceTo(endPos) * 0.25) };
    if (dur === 0) { cam.position.copy(endPos); ctl.target.copy(target); fly = null; }
  };
  C.flying = () => !!fly;

  C.follow = function (getter, label) {
    follow = getter;
    followLast = null;
    C.followLabel = label || '';
    C.setMode('follow', true);
    const p = getter();
    if (p) C.flyTo(p, { dist: 16, polar: 0.95, keepMode: true, dur: 1 });
  };
  C.stopFollow = function () { follow = null; if (C.mode === 'follow') C.setMode('strategy'); };

  C.setMode = function (m, internal) {
    const prev = C.mode;
    C.mode = m;
    ctl.enabled = m !== 'walk' && m !== 'cctv';
    ctl.autoRotate = m === 'drone';
    ctl.autoRotateSpeed = 0.35;
    ctl.enableRotate = m !== 'top';
    ctl.maxPolarAngle = m === 'walk' ? Math.PI : 1.47;
    if (m !== 'follow' && !internal) follow = null;
    if (m === 'top') C.flyTo(ctl.target, { polar: 0.001, dist: Math.max(120, currentAngles().r), keepMode: true });
    if (m === 'drone') C.flyTo({ x: 0, y: 0, z: -40 }, { dist: 420, polar: 0.95, keepMode: true, dur: 2 });
    if (m === 'walk') enterWalk(prev);
    if (m === 'cctv') C.cctv(C.cctvIndex);
    if (prev === 'walk' && m !== 'walk') { cam.up.set(0, 1, 0); }
    SK.bus.emit('camMode', m);
  };

  C.cctv = function (i) {
    C.cctvIndex = (i + C.CCTV.length) % C.CCTV.length;
    const c = C.CCTV[C.cctvIndex];
    fly = null;
    cam.position.set(c.pos[0], c.pos[1], c.pos[2]);
    ctl.target.set(c.at[0], c.at[1], c.at[2]);
    cam.lookAt(ctl.target);
    SK.bus.emit('cctv', c);
  };

  // ---------- walk mode ----------
  const walk = { yaw: 0, pitch: 0, keys: {}, drag: null };
  function enterWalk() {
    fly = null;
    const t = ctl.target;
    // drop to eye height at the current target, facing the way the camera faced
    const a = currentAngles();
    walk.yaw = a.az + Math.PI;
    walk.pitch = -0.05;
    cam.position.set(t.x, 1.7, t.z);
  }
  window.addEventListener('keydown', (e) => {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    walk.keys[e.key.toLowerCase()] = true;
  });
  window.addEventListener('keyup', (e) => { walk.keys[e.key.toLowerCase()] = false; });
  window.addEventListener('blur', () => { walk.keys = {}; });
  E.renderer.domElement.addEventListener('pointerdown', (e) => { if (C.mode === 'walk') walk.drag = { x: e.clientX, y: e.clientY }; });
  window.addEventListener('pointermove', (e) => {
    if (C.mode !== 'walk' || !walk.drag) return;
    walk.yaw -= (e.clientX - walk.drag.x) * 0.004;
    walk.pitch = SK.clamp(walk.pitch - (e.clientY - walk.drag.y) * 0.004, -1.2, 1.2);
    walk.drag = { x: e.clientX, y: e.clientY };
  });
  window.addEventListener('pointerup', () => { walk.drag = null; });

  function updateWalk(dt) {
    const k = walk.keys;
    let f = (k.w || k.arrowup ? 1 : 0) - (k.s || k.arrowdown ? 1 : 0) + -C.joy.y;
    let s = (k.d || k.arrowright ? 1 : 0) - (k.a || k.arrowleft ? 1 : 0) + C.joy.x;
    const sp = (k.shift ? 9 : 4) * dt;
    const fx = Math.sin(walk.yaw), fz = Math.cos(walk.yaw);
    cam.position.x += (fx * f - fz * s) * sp;
    cam.position.z += (fz * f + fx * s) * sp;
    cam.position.x = SK.clamp(cam.position.x, -470, 470);
    cam.position.z = SK.clamp(cam.position.z, -260, 140);
    cam.position.y = 1.7;
    v3.set(cam.position.x + Math.sin(walk.yaw) * Math.cos(walk.pitch), 1.7 + Math.sin(walk.pitch), cam.position.z + Math.cos(walk.yaw) * Math.cos(walk.pitch));
    cam.lookAt(v3);
    ctl.target.set(cam.position.x + Math.sin(walk.yaw) * 6, 0, cam.position.z + Math.cos(walk.yaw) * 6);
  }

  function updateStrategyKeys(dt) {
    const k = walk.keys;
    if (fly) return;
    const pan = (k.w || k.arrowup ? 1 : 0) - (k.s || k.arrowdown ? 1 : 0);
    const side = (k.d || k.arrowright ? 1 : 0) - (k.a || k.arrowleft ? 1 : 0);
    const rot = (k.e ? 1 : 0) - (k.q ? 1 : 0);
    const zoom = (k['-'] || k._ ? 1 : 0) - (k['='] || k['+'] ? 1 : 0);
    if (!pan && !side && !rot && !zoom) return;
    const a = currentAngles();
    const speed = a.r * 0.9 * dt;
    v3.set(-Math.sin(a.az), 0, -Math.cos(a.az));         // forward on the ground
    v3b.set(-v3.z, 0, v3.x);                             // right
    const d = v3.multiplyScalar(pan * speed).add(v3b.multiplyScalar(side * speed));
    ctl.target.add(d); cam.position.add(d);
    if (rot || zoom) {
      const r = SK.clamp(a.r * (1 + zoom * 1.2 * dt), ctl.minDistance, ctl.maxDistance);
      cam.position.copy(posFrom(ctl.target, r, a.polar, a.az + rot * 1.2 * dt));
    }
  }

  E.onFrame((dtGame, dtReal) => {
    if (fly) {
      fly.t += dtReal;
      const u = fly.dur ? SK.ease(SK.clamp(fly.t / fly.dur, 0, 1)) : 1;
      cam.position.lerpVectors(fly.p0, fly.p1, u);
      cam.position.y += Math.sin(Math.PI * u) * fly.arc;
      ctl.target.lerpVectors(fly.q0, fly.q1, u);
      if (u >= 1) fly = null;
    }
    if (C.mode === 'walk') { updateWalk(dtReal); return; }
    if (C.mode === 'cctv') { cam.lookAt(ctl.target); return; }
    if (C.mode === 'follow' && follow && !fly) {
      const p = follow();
      if (!p) { C.stopFollow(); return; }
      if (followLast) {
        v3.set(p.x - followLast.x, (p.y || 0) - followLast.y, p.z - followLast.z);
        cam.position.add(v3); ctl.target.add(v3);
      } else ctl.target.set(p.x, p.y || 0, p.z);
      followLast = { x: p.x, y: p.y || 0, z: p.z };
    }
    if (C.mode === 'strategy' || C.mode === 'top' || C.mode === 'follow') updateStrategyKeys(dtReal);
  });
  return C;
})();

        v.x += (li === 2 ? 1 : -1) * v.speed * dt;
        const zt = v.lane === 2 ? L.road.returnZ - 1.6 : L.road.laneZ[v.lane];
        v.z += SK.clamp(zt - v.z, -2 * dt, 2 * dt);
        v.g.position.set(v.x, 0, v.z);
        if ((li !== 2 && v.x < L.road.x0 - 6) || (li === 2 && v.x > L.road.x1 + 6)) v.dead = true;
      }
    }
    for (let i = S.vehicles.length - 1; i >= 0; i--) {
      const v = S.vehicles[i];
      if (!v.dead) continue;
      root.remove(v.g); E.pick.remove(v.g);
      v.g.traverse((o) => { if (o.geometry) o.geometry.dispose(); });
      S.vehicles.splice(i, 1);
    }

    // train: arrive, dwell, depart (every ~2.5 game minutes)
    T.timer -= dt;
    if (T.state === 'away' && T.timer <= 0) { T.state = 'arriving'; T.z = 160; }
    if (T.state === 'arriving') {
      const stopZ = L.rail.stopZ - 20;
      T.z -= Math.max(1.5, (T.z - stopZ) * 0.7) * dt;
      if (T.z - stopZ < 0.2) { T.z = stopZ; T.state = 'dwell'; T.timer = 8; deliverTrain(); }
    } else if (T.state === 'dwell' && T.timer <= 0) T.state = 'leaving';
    else if (T.state === 'leaving') { T.z += Math.min(18, 2 + (T.z - (L.rail.stopZ - 20)) * 0.6) * dt; if (T.z > 160) { T.state = 'away'; T.timer = 12; } }
    train.position.z = T.z;
    train.visible = T.z < 150;
  };
  function deliver(v) {
    v.riders.forEach((spec, i) => SK.bus.emit('deliver', { spec, x: v.x + (i - v.riders.length / 2) * 0.9, z: 62.5, node: null }));
    v.riders = [];
  }
  function deliverTrain() {
    const list = S.pending.rail.splice(0);
    list.forEach((spec, i) => SK.bus.emit('deliver', { spec, x: L.rail.x0 + 3 + (i % 3), z: L.rail.stopZ - 14 + ((i * 3.7) % 28), node: 'railPlat' }));
  }
  S.root = root;
  return S;
})();

// ===== world/terminal.js =====
// SkyOps terminal: building shell, check-in, security, passport, airside, gates.
// Also publishes station geometry (server and stage positions, queue rectangles, seats, staff posts) for the sim.
SK.terminal = (function () {
  const K = SK.kit, M = K.mat, L = SK.L, E = SK.engine;

  E.scene.add(root);
  const B = new K.Batch();
  const D = T.defs;
  D.staffPosts = [];
  const post = (role, x, z, ry, ref) => D.staffPosts.push({ role, x, z, ry, ref });
  const spread = (x0, x1, n) => Array.from({ length: n }, (_, i) => x0 + ((i + 0.5) * (x1 - x0)) / n);

  const tw = L.term.x1 - L.term.x0, td = L.term.z1 - L.term.z0, cx = (L.term.x0 + L.term.x1) / 2;

  // ---------- shell ----------
  K.ground(tw, L.term.z1 - L.secWallZ, M.floor, cx, 0.03, (L.term.z1 + L.secWallZ) / 2, root);
  K.ground(tw, L.secWallZ - L.term.z0, M.floorAir, cx, 0.03, (L.secWallZ + L.term.z0) / 2, root);
  B.box(tw + 2, 0.3, td + 2, M.concrete, cx, -0.3, (L.term.z0 + L.term.z1) / 2);
  // glass curtain walls with mullions; south facade has door gaps
  function glassWall(x0, z0, x1, z1, h, gaps) {
    const len = Math.hypot(x1 - x0, z1 - z0), ang = Math.atan2(z1 - z0, x1 - x0);
    const segs = [];
    let cur = 0;
    (gaps || []).slice().sort((a, b) => a[0] - b[0]).forEach(([g0, g1]) => { if (g0 > cur) segs.push([cur, g0]); cur = g1; });
    if (cur < len) segs.push([cur, len]);
    segs.forEach(([a, b]) => {
      const mid = (a + b) / 2, l = b - a;
      const mx = x0 + Math.cos(ang) * mid, mz = z0 + Math.sin(ang) * mid;
      B.add(K.geo.box(l, h, 0.12), M.glass, K.matrix(mx, h / 2, mz, -ang));
      for (let s = a; s <= b + 0.01; s += 4) B.box(0.18, h, 0.3, M.steel, x0 + Math.cos(ang) * s, 0, z0 + Math.sin(ang) * s);
    });
    // transom above gaps
    (gaps || []).forEach(([g0, g1]) => {
      const mid = (g0 + g1) / 2;
      B.add(K.geo.box(g1 - g0, h - 3.2, 0.12), M.glass, K.matrix(x0 + Math.cos(ang) * mid, 3.2 + (h - 3.2) / 2, z0 + Math.sin(ang) * mid, -ang));
    });
    B.box(len, 0.4, 0.4, M.steel, x0 + Math.cos(ang) * len / 2, h - 0.4, z0 + Math.sin(ang) * len / 2, -ang);
  }
  const H = 9;
  glassWall(L.term.x0, L.term.z1, L.term.x1, L.term.z1, H, L.doors.map((x) => [x - L.term.x0 - 2.5, x - L.term.x0 + 2.5]));
  glassWall(L.term.x0, L.term.z0, L.term.x0, L.term.z1, H, [[L.westDoor.z - L.term.z0 - 2.5, L.westDoor.z - L.term.z0 + 2.5]]);
  glassWall(L.term.x1, L.term.z0, L.term.x1, L.term.z1, H, [[L.crewRoom.door.z - L.term.z0 - 1.2, L.crewRoom.door.z - L.term.z0 + 1.2], [30 - L.term.z0 - 1, 30 - L.term.z0 + 1]]);
  glassWall(L.term.x0, L.term.z0, L.term.x1, L.term.z0, H, L.gates.map((g) => { const d = L.gateDoor(g); return [d.x - L.term.x0 - 1.3, d.x - L.term.x0 + 1.3]; }));
  // security boundary wall (frosted glass), open at the screening entrances

    const label = { priority: ['FIRST · BUSINESS', 'Priority check-in'], economy: ['ECONOMY', 'Check-in desks 1 to 10'], bagdrop: ['AUTO BAG DROP', 'Tag your bag, then drop it'], special: ['SPECIAL ASSISTANCE', 'Wheelchairs · Oversize'] }[k];
    const hs = K.sign(label, Math.min(14, g.x1 - g.x0 - 1), 1.6, { bg: k === 'priority' ? '#2b2116' : '#16324f', fg: k === 'priority' ? '#f2d38a' : '#ffffff', font: 'bold 70px system-ui, sans-serif', accent: '#f2b134' });
    hs.position.set((g.x0 + g.x1) / 2, 4.3, L.checkin.counterZ - 2.05); root.add(hs);
    const qr = { x0: g.x0 + 1, x1: g.x1 - 1, z0: L.checkin.counterZ + 2.6, z1: k === 'economy' ? 48 : 46 };
    D.checkin[k] = { servers, queue: SK.serpentine(qr, { headX: 'x0', headZ: 'z0' }) };
    K.hit(g.x1 - g.x0, 1.4, 3, (g.x0 + g.x1) / 2, 0, L.checkin.counterZ - 0.4, root, { priority: 'desk_priority', economy: 'desk_economy', bagdrop: 'bagdrop', special: 'special_desk' }[k]);

  K.hit(L.kiosks.x1 - L.kiosks.x0, 1.6, 7, (L.kiosks.x0 + L.kiosks.x1) / 2, 0, 45.2, root, 'kiosk');

  [[-10, 49, 0], [40, 49, 0], [0, -9.8, 0], [-60, -26.5, Math.PI], [60, -26.5, Math.PI]].forEach(([x, z, ry]) => {

    B.box(0.6, 1.1, 0.5, M.desk, bx - 1.3, 0, LN.xrayZ1 - 0.6);                                     // operator desk
    B.box(0.5, 0.35, 0.04, M.screen, bx - 1.3, 1.15, LN.xrayZ1 - 0.85);
    // body scanner portal (two curved panels approximated by boxes)
    const sx = lx + LN.scanDx;
    B.box(0.25, 2.3, 1.6, M.kiosk, sx - 0.85, 0, LN.scanZ);

      stages: [{ x: lx + 1.0, z: LN.entryZ + 2.0, virtual: true }, { x: lx + 0.2, z: LN.entryZ + 2.0, virtual: true }, { x: lx + 0.6, z: LN.entryZ + 0.9 }, { x: lx + 0.4, z: LN.divestZ }, { x: sx, z: LN.scanZ }, { x: lx + 0.4, z: LN.recompZ }],

  // secondary search tables + pat-down booth

  [[52, 0], [59, 0], [66, 0]].forEach(([x]) => post('r_tso', x, 10.1, 0, { st: 'search' }));
  B.box(3, 2.2, 0.1, M.glassDark, L.patdown.x, 0, L.patdown.z - 1.5);
  B.box(3.4, 0.03, 3, M.blueMark, L.patdown.x, 0.04, L.patdown.z);
  D.search = { tables: [{ x: 52, z: 12.2 }, { x: 59, z: 12.2 }, { x: 66, z: 12.2 }], patdown: { x: L.patdown.x, z: L.patdown.z } };
  K.hit(24, 1.2, 6, 59, 0, 11, root, 'secondary');
  K.hit(3.4, 2.2, 3, L.patdown.x, 0, L.patdown.z, root, 'patdown');
  K.ground(L.secQueue.x1 - L.secQueue.x0, L.secQueue.z1 - L.secQueue.z0, M.carpet, (L.secQueue.x0 + L.secQueue.x1) / 2, 0.035, (L.secQueue.z0 + L.secQueue.z1) / 2, root);

  // ---------- passport control ----------
  const P = L.passport;

  const hs = K.sign('27 - 09', 3.2, 1, { bg: '#c8382f', fg: '#ffffff', font: 'bold 150px system-ui, sans-serif' });

  [RW.x0 + 8, RW.x1 - 8].forEach((x) => { for (let k = -7; k <= 7; k++) if (k) B.box(30, 0.02, 1.8, M.marking, x, 0.03, RW.z + k * 2.8); });
  [RW.x0 + 150, RW.x1 - 150].forEach((x) => [-1, 1].forEach((s) => B.box(45, 0.02, 6, M.marking, x, 0.03, RW.z + s * 9)));
  B.box(RW.x1 - RW.x0, 0.02, 0.9, M.marking, 0, 0.03, RW.z - RW.w / 2 + 1);
  B.box(RW.x1 - RW.x0, 0.02, 0.9, M.marking, 0, 0.03, RW.z + RW.w / 2 - 1);
  K.paint('27', 40, 18, '#f2f2ee', root, RW.x1 - 55, RW.z, Math.PI / 2);

  K.hit(RW.x1 - RW.x0, 0.2, RW.w, 0, 0, RW.z, root, 'runway');

  // ---------- lights (instanced spheres; glow at night via emissive) ----------
  const lightGeo = new THREE.SphereGeometry(0.35, 6, 4);
  function lights(color, pts, size) {

    const m = new THREE.InstancedMesh(lightGeo, mat, pts.length);
    pts.forEach((p, i) => m.setMatrixAt(i, K.matrix(p[0], 0.3, p[1], 0, size || 1, size || 1, size || 1)));

    root.add(m);

  }
  const edge = [], centre = [], twy = [], thr = [], ends = [], appr = [];
  for (let x = RW.x0; x <= RW.x1; x += 30) { edge.push([x, RW.z - RW.w / 2 - 1.5], [x, RW.z + RW.w / 2 + 1.5]); }
  for (let x = RW.x0 + 15; x <= RW.x1 - 15; x += 15) centre.push([x, RW.z]);
  for (let x = RW.x0 + 30; x < RW.x1 - 30; x += 30) twy.push([x, L.taxiwayZ - 12], [x, L.taxiwayZ + 12]);
  for (let k = -9; k <= 9; k++) { thr.push([RW.x1 + 1, RW.z + k * 2.5]); ends.push([RW.x0 - 1, RW.z + k * 2.5]); }
  for (let x = RW.x1 + 30; x <= RW.x1 + 300; x += 30) for (let k = -2; k <= 2; k++) appr.push([x, RW.z + k * 1.8]);
  lights(0xfff3d6, edge, 1.1);

  // PAPI: 4 boxes left of the 27 threshold (aircraft heading west: left is south, +z)

  // ---------- stands + jet bridges ----------
  L.gates.forEach((g) => {
    if (g.bus) return;

    B.box(0.3, 0.02, L.stand.leadInZ - L.stand.noseZ, M.yellowMark, g.x, 0.025, (L.stand.leadInZ + L.stand.noseZ) / 2);

  // remote stand marking + air stairs
  const R = L.remote;
  B.box(36, 0.02, 0.3, M.yellowMark, R.x + 12, 0.025, R.z);
  K.paint('R1', 6, 4, '#f1c232', root, R.x + 4, R.z + 8, 0);

  function makeBridge(g) {
    const door = L.gateDoor(g);
    const grp = new THREE.Group();
    const rot = new THREE.Vector3(door.x, 0, L.term.z0 - 4.2);
    // fixed link from the terminal wall (ramp up) to the rotunda

    K.box(2.6, 0.25, 4, M.darkSteel, 0, 3.0, -2, link);
    K.box(0.1, 2.4, 4, M.glass, -1.3, 3.25, -2, link);
    K.box(0.1, 2.4, 4, M.glass, 1.3, 3.25, -2, link);
    K.box(2.7, 0.2, 4, M.steel, 0, 5.6, -2, link);
    K.cyl(0.25, 0.25, 3, M.steel, 0, 0, -2, link);
    link.position.set(door.x, 0, L.term.z0);
    grp.add(link);
    K.cyl(2.2, 2.2, 3, M.steel, rot.x, 2.8, rot.z, grp, 20);
    K.cyl(0.6, 0.6, 2.8, M.darkSteel, rot.x, 0, rot.z, grp, 10);
    // telescoping tunnel: outer + inner sections, cab at the far end

    arm.position.copy(rot);
    const outer = new THREE.Group(), inner = new THREE.Group(), cab = new THREE.Group();
    const tunnel = (grpX, len, w) => {

      K.box(0.1, 2.3, len, M.glass, -w / 2, 0.25, -len / 2, grpX);
      K.box(0.1, 2.3, len, M.glass, w / 2, 0.25, -len / 2, grpX);
      K.box(w + 0.1, 0.25, len, M.steel, 0, 2.55, -len / 2, grpX);
    };
    tunnel(outer, 8, 2.8);
    tunnel(inner, 8, 2.6);
    K.box(3.4, 3.0, 2.6, M.steel, 0, 0, -1.2, cab);
    K.box(3.0, 0.4, 0.4, M.rubber, 0, 2.6, -2.5, cab);
    const leg = new THREE.Group();
    K.box(0.4, 1, 0.4, M.darkSteel, 0, 0, 0, leg);
    K.box(2.4, 0.6, 0.8, M.darkSteel, 0, -0.6, 0, leg);
    arm.add(outer, inner, cab, leg);
    grp.add(arm);
    root.add(grp);
    E.pick.add(grp, 'jetbridge');
    const bridge = { g, rot, arm, outer, inner, cab, leg, u: 0, target: 0, dockAt: null, h: 3.0, park: { yaw: 0.35, len: 9 } };
    setBridge(bridge, 0);
    return bridge;
  }
  // u: 0 parked, 1 docked at bridge.dockAt {x, z, h}
  function setBridge(b, u) {
    const d = b.dockAt;
    let yaw = b.park.yaw, len = b.park.len, h = 3.0;
    if (d) {
      const dx = d.x + 1.6 - b.rot.x, dz = d.z - b.rot.z;
      const dyaw = Math.atan2(-dx, -dz), dlen = Math.hypot(dx, dz) - 2.4;
      yaw = SK.lerp(b.park.yaw, dyaw, u); len = SK.lerp(b.park.len, dlen, u); h = SK.lerp(3.0, d.h, u);
    }
    b.arm.rotation.y = yaw;
    b.arm.position.y = 2.9;
    const rise = h - 2.9;
    const tilt = Math.atan2(rise, len);
    b.arm.rotation.x = 0;
    b.outer.rotation.x = tilt; b.inner.rotation.x = tilt;
    b.outer.position.set(0, 0, 0);
    b.inner.position.set(0, Math.sin(tilt) * Math.max(0, len - 8), -Math.cos(tilt) * Math.max(0, len - 8));
    b.cab.position.set(0, rise, -len);
    b.leg.position.set(0, rise * 0.7 - 2.3, -len * 0.7);

  A.dock = function (gid, doorPos) { const b = A.bridges[gid]; if (!b) return; b.dockAt = doorPos; b.target = 1; };
  A.retract = function (gid) { const b = A.bridges[gid]; if (b) b.target = 0; };
  A.bridgeReady = (gid) => { const b = A.bridges[gid]; return !b || b.u > 0.99; };
  A.bridgeClear = (gid) => { const b = A.bridges[gid]; return !b || b.u < 0.01; };
  // world-space walking path for boarding: terminal door -> rotunda -> cab end
  A.bridgePath = function (gid) {
    const b = A.bridges[gid];
    const door = L.gateDoor(b.g);
    const end = { x: b.rot.x - Math.sin(b.yaw) * (b.len + 1.4), z: b.rot.z - Math.cos(b.yaw) * (b.len + 1.4), y: b.hNow };
    return [{ x: door.x, z: L.term.z0 - 0.4, y: 0.2 }, { x: door.x, z: L.term.z0 - 3.4, y: 3.0 }, { x: b.rot.x, z: b.rot.z, y: 3.0 }, end];
  };

  // ---------- ATC tower + radar ----------
  const TW = L.tower;
  K.cyl(3.2, 4.2, TW.h, M.concrete, TW.x, 0, TW.z, root, 16);
  const cab = new THREE.Mesh(new THREE.CylinderGeometry(7.5, 6, 5, 8), M.glassDark);
  cab.position.set(TW.x, TW.h + 2.5, TW.z); root.add(cab);

  K.cyl(0.4, 0.4, 5, M.steel, TW.x, TW.h + 5.8, TW.z, root, 8);
  const radar = new THREE.Group();
  K.box(7, 1.6, 0.4, M.white, 0, 0, 0, radar);
  K.box(0.6, 0.6, 1.4, M.darkSteel, 0, -0.4, 0.6, radar);
  radar.position.set(TW.x, TW.h + 10.6, TW.z);
  root.add(radar);
  A.radar = radar;
  const beacon = new THREE.MeshStandardMaterial({ color: 0xff2a1a, emissive: 0xff2a1a, emissiveIntensity: 1 });
  K.cyl(0.35, 0.35, 0.5, beacon, TW.x, TW.h + 12.2, TW.z, root, 8);
  A.towerBeacon = beacon;
  K.hit(16, TW.h + 6, 16, TW.x, 0, TW.z, root, 'tower');
  K.hit(8, 2.5, 3, TW.x, TW.h + 9.4, TW.z, root, 'radar');
  K.hit(30, 0.2, 30, TW.x, 0, TW.z + 20, root, 'tower');

  // pass 3 support zones (cargo, hangar, fuel, fire, ops centre, utilities) live in world/support.js

  B.build(root);

  // render-only animation
  A.visual = function (dtReal) {
    radar.rotation.y += dtReal * (Math.PI * 2 / 4.8);     // ~4.8 s per sweep
    beacon.emissiveIntensity = Math.sin(performance.now() * 0.004) > 0.2 ? 3 : 0.2;
  };
  // bridge movement is sim state: boarding waits for it, so it advances with the sim clock, not with frames
  A.update = function (dt) {
    Object.values(A.bridges).forEach((b) => {
      if (Math.abs(b.u - b.target) > 1e-4) setBridge(b, SK.clamp(b.u + Math.sign(b.target - b.u) * dt * 0.12, 0, 1));

})();

// ===== world/aircraft.js =====
// SkyOps aircraft: procedural aircraft models and the movement state machine
// (approach, landing, taxi-in, parking, turnaround, pushback, taxi-out, hold, take-off).
// Airside motion runs faster than real life (AIR) so a single runway keeps up with a compressed day.
SK.aircraft = (function () {
  const K = SK.kit, M = K.mat, L = SK.L, E = SK.engine, RW = L.runway;
  const A = { planes: [], runwayHolder: null, AIR: 1.6 };
  const root = new THREE.Group(); root.name = 'aircraft';
  E.scene.add(root);

  const DIM = {
    narrow: { len: 44.5, span: 35.8, r: 1.98, cy: 3.4, doorAft: 6.2, doorH: 3.4, finH: 6.4, engR: 1.05, engX: 5.8 },
    wide: { len: 62.8, span: 60.1, r: 2.9, cy: 4.6, doorAft: 9.5, doorH: 4.9, finH: 9.6, engR: 1.6, engX: 9.8 },
  };
  const liveries = {};
  function livery(al) {
    if (liveries[al.code]) return liveries[al.code];
    return (liveries[al.code] = {
      body: new THREE.MeshStandardMaterial({ color: 0xf4f5f6, roughness: 0.35, metalness: 0.2 }),
      tail: new THREE.MeshStandardMaterial({ color: al.color, roughness: 0.4, metalness: 0.2 }),
      accent: new THREE.MeshStandardMaterial({ color: al.tail, roughness: 0.4 }),
    });
  }
  const navRed = new THREE.MeshBasicMaterial({ color: 0xff2a1a });
  const navGreen = new THREE.MeshBasicMaterial({ color: 0x2aff6a });
  const strobe = new THREE.MeshBasicMaterial({ color: 0xffffff });

  function wingShape(rootLen, tipLen, half, sweep) {
    const s = new THREE.Shape();
    s.moveTo(0, 0); s.lineTo(half, -sweep); s.lineTo(half, -sweep - tipLen); s.lineTo(0, -rootLen); s.lineTo(0, 0);
    return s;
  }

  // Model faces +z with the nose tip at the origin, on the ground.
  function build(kind, al) {
    const d = DIM[kind], lv = livery(al);
    const g = new THREE.Group();
    const body = new THREE.Group();
    // fuselage profile along +y from tail (y=0) to nose (y=len), rotated to lie along -z..0
    const pts = [];
    const n = d.len;
    pts.push(new THREE.Vector2(0.05, 0));
    pts.push(new THREE.Vector2(d.r * 0.25, 0.8));
    pts.push(new THREE.Vector2(d.r * 0.6, n * 0.1));
    pts.push(new THREE.Vector2(d.r, n * 0.28));
    pts.push(new THREE.Vector2(d.r, n * 0.86));
    for (let i = 1; i <= 6; i++) { const t = i / 6; pts.push(new THREE.Vector2(d.r * Math.sqrt(1 - t * t * 0.96), n * 0.86 + t * n * 0.14)); }
    const fus = new THREE.Mesh(new THREE.LatheGeometry(pts, 20), lv.body);
    fus.rotation.x = Math.PI / 2;     // +y -> +z
    fus.position.set(0, d.cy, -n);
    fus.castShadow = true;
    body.add(fus);
    // cheatline + windows
    K.box(0.05, 0.26, n * 0.7, M.black, d.r * 0.98, d.cy + d.r * 0.25, -n * 0.47, body, { noShadow: true });
    K.box(0.05, 0.26, n * 0.7, M.black, -d.r * 0.98, d.cy + d.r * 0.25, -n * 0.47, body, { noShadow: true });
    K.box(0.06, 0.32, n * 0.75, lv.tail, d.r * 0.97, d.cy - d.r * 0.25, -n * 0.47, body, { noShadow: true });
    K.box(0.06, 0.32, n * 0.75, lv.tail, -d.r * 0.97, d.cy - d.r * 0.25, -n * 0.47, body, { noShadow: true });
    K.box(d.r * 1.1, 0.5, 0.8, M.black, 0, d.cy + d.r * 0.32, -1.6, body, { noShadow: true });
    // wings (right = -x, left = +x)
    const wroot = n * 0.4, half = d.span / 2 - d.r * 0.5, rootC = d.len * 0.2, tipC = rootC * 0.28, sweep = half * 0.55;
    const ws = wingShape(rootC, tipC, half, sweep);
    const wgeo = new THREE.ExtrudeGeometry(ws, { depth: 0.35, bevelEnabled: false });
    [1, -1].forEach((side) => {
      const w = new THREE.Mesh(wgeo, lv.body);
      w.rotation.x = Math.PI / 2;
      w.scale.x = side;
      w.position.set(side * d.r * 0.4, d.cy - d.r * 0.55, -wroot);
      w.rotation.z = 0;
      w.castShadow = true;
      const wg = new THREE.Group(); wg.add(w); wg.rotation.z = side * 0.06; body.add(wg);
      // engine
      const eng = new THREE.Mesh(new THREE.CylinderGeometry(d.engR, d.engR * 0.85, d.engR * 3.4, 16), lv.accent);
      eng.rotation.x = Math.PI / 2;
      eng.position.set(side * d.engX, d.cy - d.r - d.engR * 0.4, -wroot - d.engX * 0.55 + d.engR * 1.8);
      eng.castShadow = true;
      body.add(eng);
      const inlet = new THREE.Mesh(new THREE.CircleGeometry(d.engR * 0.9, 14), M.black);
      inlet.position.set(eng.position.x, eng.position.y, eng.position.z + d.engR * 1.71);
      body.add(inlet);
      // nav light at the tip: left red (+x), right green (-x)
      const nl = new THREE.Mesh(new THREE.SphereGeometry(0.22, 6, 4), side > 0 ? navRed : navGreen);
      nl.position.set(side * d.span / 2, d.cy - d.r * 0.55 + Math.sin(0.06) * half, -wroot - sweep - tipC * 0.4);
      body.add(nl);
      const st = new THREE.Mesh(new THREE.SphereGeometry(0.18, 6, 4), strobe);
      st.position.copy(nl.position); st.position.z -= 0.6;
      body.add(st);
      g.userData['strobe' + side] = st;
      // horizontal stabiliser
      const hs = new THREE.Mesh(new THREE.ExtrudeGeometry(wingShape(rootC * 0.45, rootC * 0.15, d.span * 0.16, d.span * 0.12), { depth: 0.2, bevelEnabled: false }), lv.body);
      hs.rotation.x = Math.PI / 2; hs.scale.x = side;
      hs.position.set(side * 0.3, d.cy + 0.4, -n * 0.88);
      body.add(hs);
    });
    // vertical fin
    const fs = new THREE.Shape();
    fs.moveTo(0, 0); fs.lineTo(-d.finH * 0.9, d.finH); fs.lineTo(-d.finH * 0.9 - d.finH * 0.35, d.finH); fs.lineTo(-n * 0.16, 0); fs.lineTo(0, 0);
    const fin = new THREE.Mesh(new THREE.ExtrudeGeometry(fs, { depth: 0.3, bevelEnabled: false }), lv.tail);
    fin.rotation.y = Math.PI / 2;
    fin.position.set(-0.15, d.cy + d.r * 0.6, -n * 0.8);
    fin.castShadow = true;
    body.add(fin);
    const beacon = new THREE.Mesh(new THREE.SphereGeometry(0.25, 6, 4), navRed);
    beacon.position.set(0, d.cy + d.r + 0.15, -n * 0.45);
    body.add(beacon);
    g.userData.beacon = beacon;
    // landing gear
    const gear = (x, z, r) => { const w = K.cyl(r, r, 0.5, M.rubber, x, 0, z, body); w.rotation.z = Math.PI / 2; w.position.y = r; K.cyl(0.12, 0.12, d.cy - d.r, M.steel, x, r, z, body); };
    gear(0, -3.5, 0.45);
    [-1, 1].forEach((s) => gear(s * d.r * 1.2, -wroot - rootC * 0.55, 0.65));
    g.add(body);
    g.userData.dim = d;
    return g;
  }

  // ---------- paths ----------
  function path(pts) {
    const c = new THREE.CatmullRomCurve3(pts.map((p) => new THREE.Vector3(p[0], p[2] || 0, p[1])), false, 'centripetal');
    c.arcLengthDivisions = 400;
    return { c, len: c.getLength() };
  }
  const TL = L.taxilaneZ, TW = L.taxiwayZ;
