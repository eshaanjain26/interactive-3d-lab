<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ChainVerse 3D</title>
<meta name="description" content="A 3D global supply chain simulator: a globe of real shipping lanes, ports and chokepoints, zoom-in dioramas from mine to doorstep, and scored scenario missions on lead time, cost per TEU, carbon and service level.">
<style>
  :root {
    --bg: #e7edf3;
    --panel: rgba(255, 255, 255, 0.9);
    --border: rgba(255, 255, 255, 0.95);
    --ink: #13202f;
    --muted: #55657a;
    --faint: #8794a3;
    --line: rgba(19, 32, 47, 0.1);
    --accent: #0a8fb0;
    --accent-ink: #ffffff;
    --accent-soft: rgba(10, 143, 176, 0.12);
    --ok: #12a167;
    --warn: #c98200;
    --fault: #d8324a;
    --seller: #2f6fde;
    --buyer: #e07a1f;
    --chip: #eef2f6;
    --shadow: 0 10px 30px rgba(20, 40, 70, 0.16);
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #070d16; --panel: rgba(14, 22, 33, 0.9); --border: rgba(255,255,255,0.08); --ink: #e6edf5; --muted: #9eadbf; --faint: #718196;
      --line: rgba(255,255,255,0.1); --accent: #3fd0ef; --accent-ink: #04212b; --accent-soft: rgba(63,208,239,0.14); --chip: rgba(255,255,255,0.06);
      --seller: #6f9dff; --buyer: #ffa35a; --shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"] {
    --bg: #070d16; --panel: rgba(14, 22, 33, 0.9); --border: rgba(255,255,255,0.08); --ink: #e6edf5; --muted: #9eadbf; --faint: #718196;
    --line: rgba(255,255,255,0.1); --accent: #3fd0ef; --accent-ink: #04212b; --accent-soft: rgba(63,208,239,0.14); --chip: rgba(255,255,255,0.06);
    --seller: #6f9dff; --buyer: #ffa35a; --shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font: 13px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; }
  #scene { position: fixed; inset: 0; }
  #scene canvas { display: block; touch-action: none; }
  .glass { position: fixed; z-index: 5; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%); }
  .sec { margin: 0 0 8px; font: 700 10.5px/1.2 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border-radius: 999px; background: var(--chip); font-size: 11.5px; font-weight: 600; }
  .btn { appearance: none; border: 1px solid var(--line); background: var(--chip); padding: 7px 12px; border-radius: 9px; cursor: pointer; font-weight: 600; min-height: 34px; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .btn.ghost { background: transparent; }
  .btn:focus-visible, .seg button:focus-visible, .node-row:focus-visible, .lab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn[disabled] { opacity: .5; cursor: default; }

  #loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 50; background: var(--bg); color: var(--muted); font-weight: 600; letter-spacing: .02em; transition: opacity .5s; }
  #loading.done { opacity: 0; pointer-events: none; }
  #err { display: none; position: fixed; inset: 0; z-index: 60; place-items: center; background: var(--bg); color: var(--fault); font-weight: 600; padding: 24px; text-align: center; }
  #fade { position: fixed; inset: 0; z-index: 4; background: #000; opacity: 0; pointer-events: none; transition: opacity .35s; }
  #fade.on { opacity: 1; }

  /* top bar */
  #topbar { top: 12px; left: 12px; right: 12px; height: 54px; display: flex; align-items: center; gap: 12px; padding: 0 12px; }
  .brand { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
  .brand .eyebrow { font: 700 10px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
  .brand b { font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #backBtn { display: none; }
  body[data-view="diorama"]:not(.inmission) #left { display: none; }
  body[data-view="diorama"]:not(.inmission) #card { left: 12px; }
  body[data-view="diorama"]:not(.inmission) .mtabs button[data-tab="left"] { display: none; }
  body[data-view="diorama"] #backBtn { display: inline-flex; }
  .clock { display: flex; align-items: baseline; gap: 6px; padding: 4px 10px; border-radius: 9px; background: var(--chip); }
  .clock small { font-size: 10px; font-weight: 700; letter-spacing: .1em; color: var(--muted); }
  .clock span { font: 700 15px var(--mono); }
  .seg { display: inline-flex; background: var(--chip); border-radius: 10px; padding: 3px; gap: 2px; }
  .seg button { border: 0; background: transparent; padding: 6px 10px; border-radius: 8px; cursor: pointer; font-weight: 650; font-size: 12px; color: var(--muted); min-height: 30px; }
  .seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  .spacer { flex: 1; }
  .iconbtn { display: inline-flex; align-items: center; gap: 6px; }
  .iconbtn svg { width: 14px; height: 14px; fill: currentColor; }

  /* collapsible panels and focus mode */
  .pmin { position: sticky; top: -6px; float: right; margin: -6px -6px 4px 8px; width: 32px; height: 32px; display: grid; place-items: center; border: 0; border-radius: 8px; background: var(--panel); color: var(--muted); cursor: pointer; z-index: 2; }
  .pmin svg { width: 14px; height: 14px; fill: currentColor; }
  .pmin:hover { background: var(--chip); color: var(--ink); }
  .pmin:focus-visible, .edgetab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .edgetab { display: none; top: 50%; transform: translateY(-50%); padding: 16px 9px; border-radius: 12px; cursor: pointer; font: 700 11px var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); writing-mode: vertical-rl; }
  .edgetab:hover { color: var(--accent); }
  #leftTab { left: 6px; transform: translateY(-50%) rotate(180deg); }
  #rightTab { right: 6px; }
  body.lc #left, body.rc #right { display: none; }
  body.lc #leftTab, body.rc #rightTab { display: block; }
  body.lc #card { left: 56px; }
  body[data-view="diorama"]:not(.inmission) #leftTab { display: none; }
  #kpiStrip { display: none; gap: 12px; font-size: 12px; white-space: nowrap; }
  #kpiStrip span { display: inline-flex; gap: 4px; align-items: baseline; }
  #kpiStrip small { color: var(--muted); font: 600 10px var(--sans); letter-spacing: .06em; text-transform: uppercase; }
  #kpiStrip .bad { color: var(--fault); } #kpiStrip .good { color: var(--ok); }
  body.focus #left, body.focus #right, body.focus .edgetab, body.focus .mtabs, body.focus #card { display: none !important; }
  body.focus #topbar { left: 50%; right: auto; transform: translateX(-50%); width: max-content; max-width: calc(100vw - 24px); height: 46px; }
  body.focus .brand, body.focus #btnMissions, body.focus #btnLearn, body.focus .spacer { display: none; }
  body.focus.inmission #kpiStrip { display: flex; }
  #focusBtn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .cbar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; gap: 1px; background: var(--line); margin-top: 4px; }
  .cbar i { display: block; min-width: 3px; }
  .cleg { display: grid; gap: 3px; margin-top: 8px; font-size: 11.5px; }
  .cleg span { display: grid; grid-template-columns: 10px 1fr auto; gap: 6px; align-items: center; color: var(--muted); }
  .cleg span i { width: 9px; height: 9px; border-radius: 2px; }
  .cleg b { font: 600 11.5px var(--mono); color: var(--ink); }
  .cleg .tot { grid-template-columns: 1fr auto; border-top: 1px solid var(--line); padding-top: 4px; color: var(--ink); font-weight: 650; }

  /* left panel */
  #left { top: 78px; left: 12px; width: 300px; bottom: 12px; padding: 14px; overflow: auto; }
  .grp { margin-bottom: 14px; }
  .node-row { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; background: transparent; padding: 6px 8px; border-radius: 8px; cursor: pointer; min-height: 34px; }
  .node-row:hover { background: var(--accent-soft); }
  .node-row i { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .node-row span { flex: 1; min-width: 0; }
  .node-row small { color: var(--faint); font-size: 11px; }
  .dis { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .dis:last-child { border-bottom: 0; }
  .dis span { font-weight: 600; }
  .dis small { display: block; color: var(--faint); font-weight: 400; font-size: 11px; }
  .toggle { position: relative; width: 36px; height: 20px; flex: none; }
  .toggle input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
  .toggle .sw { position: absolute; inset: 0; border-radius: 999px; background: var(--line); transition: background .2s; }
  .toggle .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .2s; }
  .toggle input:checked + .sw { background: var(--fault); }
  .toggle input:checked + .sw::after { transform: translateX(16px); }
  .toggle input:focus-visible + .sw { outline: 2px solid var(--accent); outline-offset: 2px; }

  .legs { list-style: none; margin: 0; padding: 0; position: relative; }
  .legs li { position: relative; padding: 4px 0 10px 22px; }
  .legs li::before { content: ""; position: absolute; left: 6px; top: 8px; width: 9px; height: 9px; border-radius: 50%; background: var(--line); border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--line); }
  .legs li::after { content: ""; position: absolute; left: 10px; top: 20px; bottom: -2px; width: 1px; background: var(--line); }
  .legs li:last-child::after { display: none; }
  .legs li.done::before { background: var(--ok); }
  .legs li.now::before { background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .legs li.alt { opacity: .55; }
  .legs b { display: block; font-size: 12.5px; }
  .legs small { color: var(--muted); font-size: 11px; }
  .legs .lbtn { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-size: 11px; font-weight: 650; }

  .incobar { display: grid; grid-template-columns: repeat(11, 1fr); gap: 2px; margin: 6px 0 4px; }
  .incobar div { height: 16px; border-radius: 3px; position: relative; }
  .incobar .s { background: var(--seller); }
  .incobar .b { background: var(--buyer); }
  .incobar .risk::after { content: ""; position: absolute; right: -3px; top: -5px; bottom: -5px; width: 3px; border-radius: 2px; background: var(--ink); }
  .incoleg { display: flex; gap: 12px; font-size: 11px; color: var(--muted); flex-wrap: wrap; }
  .incoleg i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }

  /* right panel */
  #right { top: 78px; right: 12px; width: 300px; bottom: 12px; padding: 14px; overflow: auto; }
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .kpi { background: var(--chip); border-radius: 10px; padding: 9px 10px; }
  .kpi .v { font: 700 17px/1.1 var(--mono); }
  .kpi .l { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .kpi .t { font-size: 10.5px; color: var(--faint); font-family: var(--mono); }
  .kpi.bad .v { color: var(--fault); }
  .kpi.good .v { color: var(--ok); }
  .block { margin-top: 16px; }
  #log { list-style: none; margin: 0; padding: 0; font-size: 11.5px; max-height: 220px; overflow: auto; }
  #log li { padding: 5px 0; border-bottom: 1px solid var(--line); display: flex; gap: 8px; }
  #log li span.mono { color: var(--faint); flex: none; font-size: 10.5px; padding-top: 1px; }
  #log li.warn { color: var(--warn); }
  #log li.bad { color: var(--fault); }
  .track { background: var(--chip); border-radius: 10px; padding: 10px; font-size: 12px; }
  .track .row { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; }
  .track .row span:first-child { color: var(--muted); }
  .track .row span:last-child { font-family: var(--mono); text-align: right; }
  .rt { display: grid; grid-template-columns: 1fr auto auto auto; gap: 6px; padding: 2px 0; font-size: 11.5px; }
  .rt span:not(:first-child) { font-family: var(--mono); text-align: right; }
  .rt span:first-child { color: var(--muted); }
  #coldChart { width: 100%; height: 70px; display: block; margin-top: 6px; }
  .empty { color: var(--faint); font-size: 12px; }

  /* info card */
  #card { left: 324px; bottom: 12px; width: 380px; max-height: 60vh; overflow: auto; padding: 16px 16px 14px; display: none; z-index: 7; }
  #card.on { display: block; }
  #card h3 { margin: 6px 0 6px; font-size: 16px; }
  #card p { margin: 0 0 8px; color: var(--ink); }
  #card .meta { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 12px; margin: 8px 0; }
  #card .meta dt { color: var(--muted); font-weight: 600; }
  #card .meta dd { margin: 0; }
  #card .x { position: absolute; top: 8px; right: 8px; border: 0; background: transparent; cursor: pointer; font-size: 18px; width: 34px; height: 34px; border-radius: 8px; color: var(--muted); }
  #card .x:hover { background: var(--chip); }
  .rel { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .rel button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 4px 10px; font-size: 11.5px; font-weight: 600; cursor: pointer; color: var(--accent); min-height: 28px; }

  /* floating labels */
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; overflow: hidden; }
  .lab { position: absolute; left: 0; top: 0; transform: translate(-50%, -130%); white-space: nowrap; font-size: 11px; font-weight: 650; padding: 3px 8px; border-radius: 999px; background: var(--panel); color: var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,.18); pointer-events: auto; cursor: pointer; border: 1px solid var(--line); }
  .lab i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
  .lab.hero { background: #ff7a1a; color: #fff; border-color: transparent; }
  .lab.closed { background: var(--fault); color: #fff; border-color: transparent; }
  .lab.minor { font-size: 10px; padding: 2px 6px; opacity: .92; }
  body.nolabels .lab:not(.hero) { display: none; }

  /* modal */
  #modal { position: fixed; inset: 0; z-index: 20; display: none; place-items: center; background: rgba(5, 10, 20, .45); padding: 16px; }
  #modal.on { display: grid; }
  #modal .box { position: relative; width: min(760px, 100%); max-height: calc(100vh - 32px); overflow: auto; padding: 22px; background: var(--panel); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
  #modal h2 { margin: 2px 0 6px; font-size: 20px; }
  #modal p { margin: 0 0 10px; }
  #modal .x { position: absolute; top: 10px; right: 10px; border: 0; background: transparent; cursor: pointer; font-size: 20px; width: 36px; height: 36px; border-radius: 8px; color: var(--muted); }
  .mgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin-top: 12px; }
  .mcard { text-align: left; border: 1px solid var(--line); background: var(--chip); border-radius: 12px; padding: 12px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; min-height: 150px; }
  .mcard:hover { border-color: var(--accent); }
  .mcard b { font-size: 14px; }
  .mcard small { color: var(--muted); }
  .mcard .tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: auto; }
  .mcard .best { font-family: var(--mono); font-size: 11px; color: var(--ok); }
  .opts { display: grid; gap: 8px; margin: 10px 0; }
  .opt { text-align: left; border: 1px solid var(--line); background: var(--chip); border-radius: 12px; padding: 11px 12px; cursor: pointer; }
  .opt:hover, .opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .opt b { display: block; }
  .opt small { color: var(--muted); }
  .opt .fx { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; font: 600 11px var(--mono); color: var(--muted); }
  .plan h4 { margin: 14px 0 4px; font-size: 13px; }
  details.bg { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 8px; }
  details.bg summary { cursor: pointer; color: var(--accent); font-weight: 650; min-height: 28px; }
  details.bg p { color: var(--muted); margin: 6px 0 0; }
  .facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin: 10px 0; }
  .fact { background: var(--chip); border-radius: 10px; padding: 8px 10px; }
  .fact b { display: block; font: 700 15px var(--mono); }
  .fact small { color: var(--muted); font-size: 11px; }
  .score { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; margin: 12px 0; }
  .score .fact.pass b { color: var(--ok); }
  .score .fact.fail b { color: var(--fault); }
  .grade { font: 800 44px/1 var(--mono); color: var(--accent); }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 12px; }
  .gl { display: grid; grid-template-columns: 220px 1fr; gap: 14px; }
  .gl nav { display: flex; flex-direction: column; gap: 2px; max-height: 60vh; overflow: auto; }
  .gl nav button { text-align: left; border: 0; background: transparent; padding: 6px 8px; border-radius: 8px; cursor: pointer; font-weight: 600; min-height: 32px; }
  .gl nav button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
  .gl nav .cat { font: 700 10px var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--faint); padding: 10px 8px 2px; }
  .incogrid { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; }
  .incogrid button { border: 1px solid var(--line); background: var(--chip); border-radius: 8px; padding: 6px 10px; font: 700 12px var(--mono); cursor: pointer; min-height: 32px; }
  .incogrid button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .incosteps { display: grid; gap: 4px; margin-top: 8px; }
  .incosteps div { display: grid; grid-template-columns: 1fr 70px; gap: 8px; align-items: center; font-size: 12px; padding: 5px 8px; border-radius: 6px; background: var(--chip); }
  .incosteps div b { font-size: 11px; text-align: center; border-radius: 5px; padding: 2px 0; color: #fff; }
  .incosteps .rk { box-shadow: inset 0 -2px 0 var(--ink); }

  /* toast */
  #toast { left: 50%; top: 78px; transform: translateX(-50%); width: min(520px, calc(100vw - 680px)); min-width: 300px; padding: 12px 14px; display: none; z-index: 8; }
  #toast.on { display: block; animation: drop .35s cubic-bezier(.2,.8,.2,1); }
  #toast b { display: block; margin-bottom: 2px; }
  #toast .acts { display: flex; gap: 8px; margin-top: 8px; }
  @keyframes drop { from { opacity: 0; transform: translate(-50%, -8px); } to { opacity: 1; transform: translate(-50%, 0); } }

  .mtabs { display: none; }
  @media (max-width: 1100px) {
    #toast { width: calc(100vw - 32px); min-width: 0; }
    #card { left: 12px; }
  }
  @media (max-width: 820px) {
    #topbar { flex-wrap: wrap; height: auto; padding: 8px 10px; gap: 8px; }
    .spacer { display: none; }
    .brand b { font-size: 13px; }
    .hide-sm { display: none !important; }
    .pmin { display: grid; } .edgetab { display: none !important; }
    body.lc #left, body.rc #right { display: none; }
    body.focus #topbar { height: auto; flex-wrap: nowrap; }
    body.focus.inmission #kpiStrip { display: none; }
    #left, #right { top: auto; bottom: 12px; left: 12px; right: 12px; width: auto; max-height: 40vh; display: none; padding: 12px; }
    body[data-tab="left"] #left, body[data-tab="right"] #right { display: block; }
    .mtabs { display: flex; position: fixed; left: 12px; right: 12px; bottom: 12px; gap: 6px; z-index: 6; justify-content: center; }
    body[data-tab="left"] .mtabs, body[data-tab="right"] .mtabs { bottom: calc(40vh + 20px); }
    .mtabs button { border: 0; padding: 8px 14px; border-radius: 999px; font-weight: 650; background: var(--panel); box-shadow: var(--shadow); cursor: pointer; min-height: 36px; }
    .mtabs button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
    #card { left: 12px; right: 12px; width: auto; bottom: 60px; max-height: 46vh; }
    #toast { top: auto; bottom: 64px; }
    .gl { grid-template-columns: 1fr; }
    .gl nav { flex-direction: row; flex-wrap: wrap; max-height: 120px; }
    .gl nav .cat { width: 100%; }
    #modal .box { padding: 16px; }
  }
  @media (prefers-reduced-motion: reduce) { #toast.on { animation: none; } #fade { transition: none; } }
</style>
</head>

'use strict';
if (!window.THREE || !THREE.OrbitControls) { document.getElementById('err').style.display = 'grid'; throw new Error('three missing'); }
/* ================= CORE: renderer, math, labels, picking ================= */
const DEG = Math.PI / 180, R = 10, EARTH_KM = 6371;
const $ = (s, r = document) => r.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt$ = v => '$' + Math.round(v).toLocaleString('en-US');
// Colours are authored in sRGB; the renderer outputs sRGB, so convert to linear first
const C = hex => new THREE.Color(hex).convertSRGBToLinear();
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const store = {
  get(k, d) { try { const v = localStorage.getItem('chainverse:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('chainverse:' + k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } },
};

const host = $('#scene');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
host.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 4000);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

const narrow = () => innerWidth < 600;
function isDark() {
  const t = document.documentElement.getAttribute('data-theme');
  if (t) return t === 'dark';
  return matchMedia('(prefers-color-scheme: dark)').matches;
}

/* ---------- geo ---------- */
function ll2v(lat, lon, r = 1, out = new THREE.Vector3()) {
  const phi = (90 - lat) * DEG, th = (lon + 180) * DEG;
  return out.set(-r * Math.sin(phi) * Math.cos(th), r * Math.cos(phi), r * Math.sin(phi) * Math.sin(th));
}
function nodeLL(id) { const n = NODES[id]; return [n.lat, n.lon]; }
function resolvePts(pts) { return pts.map(p => typeof p === 'string' ? nodeLL(p) : p); }

// A path over the sphere: densified with slerp, measured in km, with an altitude profile by kind.
class GeoPath {
  constructor(lls, kind = 'sea') {
    this.kind = kind;
    const units = lls.map(([la, lo]) => ll2v(la, lo, 1));
    this.pts = [units[0].clone()];
    for (let i = 1; i < units.length; i++) {
      const a = units[i - 1], b = units[i];
      const ang = a.angleTo(b);
      const n = Math.max(1, Math.ceil(ang / (1.2 * DEG)));
      for (let k = 1; k <= n; k++) this.pts.push(slerpV(a, b, k / n));
    }
    this.cum = [0];
    for (let i = 1; i < this.pts.length; i++) this.cum.push(this.cum[i - 1] + this.pts[i - 1].angleTo(this.pts[i]));
    this.ang = this.cum[this.cum.length - 1];
    this.km = this.ang * EARTH_KM;
  }
  alt(f) {
    if (this.kind === 'air') return 0.012 + Math.min(0.14, 0.03 + this.ang * 0.06) * Math.sin(Math.PI * f);
    if (this.kind === 'sea') return 0.004;
    return 0.007 + 0.01 * Math.sin(Math.PI * f);
  }
  unitAt(f, out = new THREE.Vector3()) {
    const s = clamp(f, 0, 1) * this.ang;
    let lo = 0, hi = this.cum.length - 1;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (this.cum[m] <= s) lo = m; else hi = m; }
    const seg = this.cum[hi] - this.cum[lo] || 1;
    return slerpV(this.pts[lo], this.pts[hi], (s - this.cum[lo]) / seg, out);
  }
  at(f, out = new THREE.Vector3()) { return this.unitAt(f, out).multiplyScalar(R * (1 + this.alt(f))); }
  points(n = 0) {
    const N = n || Math.max(24, Math.ceil(this.ang / DEG) * 2);
    const a = [];
    for (let i = 0; i <= N; i++) a.push(this.at(i / N));
    return a;
  }
}
function slerpV(a, b, t, out = new THREE.Vector3()) {
  const ang = a.angleTo(b);
  if (ang < 1e-6) return out.copy(a);
  const s = Math.sin(ang);
  const wa = Math.sin((1 - t) * ang) / s, wb = Math.sin(t * ang) / s;
  return out.set(a.x * wa + b.x * wb, a.y * wa + b.y * wb, a.z * wa + b.z * wb);
}
const PATHS = {};
function lanePath(id) { return PATHS['lane:' + id] || (PATHS['lane:' + id] = new GeoPath(resolvePts(LANES[id].pts), 'sea')); }
function directPath(from, to, kind) {
  const k = kind + ':' + from + '>' + to;
  return PATHS[k] || (PATHS[k] = new GeoPath([nodeLL(from), nodeLL(to)], kind === 'air' ? 'air' : 'land'));
}

/* ---------- floating labels ---------- */
const Labels = {
  layer: $('#labels'), list: [],
  add(scope, target, html, opts = {}) {
    const el = document.createElement(opts.button === false ? 'div' : 'button');
    el.className = 'lab ' + (opts.cls || '');
    el.innerHTML = html;
    if (opts.title) el.title = opts.title;
    if (opts.onClick) el.addEventListener('click', e => { e.stopPropagation(); opts.onClick(); });
    else el.style.pointerEvents = 'none';
    this.layer.appendChild(el);
    const rec = { el, scope, target, off: opts.off || 0, maxDist: opts.maxDist || 0, globe: !!opts.globe, hidden: false };
    this.list.push(rec);
    return rec;
  },
  remove(rec) { if (!rec) return; rec.el.remove(); const i = this.list.indexOf(rec); if (i >= 0) this.list.splice(i, 1); },
  clearScope(scope) { this.list.filter(r => r.scope === scope).forEach(r => this.remove(r)); },
  _v: new THREE.Vector3(), _w: new THREE.Vector3(), _n: new THREE.Vector3(),
  update(scope) {
    const W = innerWidth, H = innerHeight, camDist = camera.position.length();
    for (const r of this.list) {
      let show = r.scope === scope && !r.hidden;
      if (show) {
        const p = this._v;
        if (r.target.isObject3D) r.target.getWorldPosition(p); else p.copy(r.target);
        p.y += r.off;
        if (r.globe) {
          this._n.copy(p).normalize();
          this._w.copy(camera.position).sub(p).normalize();
          if (this._n.dot(this._w) < 0.12) show = false;
          if (r.maxDist && camDist > r.maxDist) show = false;
        } else if (r.maxDist && camera.position.distanceTo(p) > r.maxDist) show = false;
        if (show) {
          p.project(camera);
          if (p.z > 1 || p.z < -1) show = false;
          else r.el.style.transform = `translate(${(p.x * 0.5 + 0.5) * W}px, ${(-p.y * 0.5 + 0.5) * H}px) translate(-50%, -130%)`;
        }
      }
      if (show !== r._shown) { r.el.style.display = show ? '' : 'none'; r._shown = show; }
    }
  },
};

/* ---------- picking ---------- */
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
function pickAt(cx, cy, list) {
  ndc.set(cx / innerWidth * 2 - 1, -(cy / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(list, true);
  for (const h of hits) {
    let o = h.object;
    while (o) { if (o.userData.pick) return o.userData.pick; o = o.parent; }
  }
  return null;
}

/* ---------- camera tween ---------- */
const CamTween = {
  active: null,
  to(pos, target, dur = 1.4, onDone) {
    if (reduceMotion) dur = 0.01;
    this.active = { p0: camera.position.clone(), t0: controls.target.clone(), p1: pos.clone(), t1: target.clone(), k: 0, dur, onDone, sph: false };
  },
  // Arc over the globe so the camera never cuts through the earth
  toGlobe(dir, dist, dur = 1.6, onDone) {
    if (reduceMotion) dur = 0.01;
    dist *= narrow() ? 1.45 : 1;
    this.active = { d0: camera.position.clone().normalize(), r0: camera.position.length(), d1: dir.clone().normalize(), r1: dist, t0: controls.target.clone(), t1: new THREE.Vector3(), k: 0, dur, onDone, sph: true };
  },
  step(dt) {
    const a = this.active; if (!a) return;
    a.k = Math.min(1, a.k + dt / a.dur);
    const e = ease(a.k);
    if (a.sph) {
      const d = slerpV(a.d0, a.d1, e);
      const r = lerp(a.r0, a.r1, e) + Math.sin(Math.PI * e) * a.d0.angleTo(a.d1) * 3;
      camera.position.copy(d.multiplyScalar(r));
      controls.target.lerpVectors(a.t0, a.t1, e);
    } else {
      camera.position.lerpVectors(a.p0, a.p1, e);
      controls.target.lerpVectors(a.t0, a.t1, e);
    }
    if (a.k >= 1) { this.active = null; a.onDone && a.onDone(); }
  },
};

/* ---------- seeded RNG ---------- */
function rng(seed) {
  let s = seed >>> 0 || 1;
  return () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
}

/* ---------- ISO 6346 container numbers with a real check digit ---------- */
function iso6346(owner, serial) {
  const map = {}; let v = 10;
  for (const c of 'ABCDEFGHIJKLMNOPQRSTUVWXYZ') { if (v % 11 === 0) v++; map[c] = v++; }
  const code = owner + 'U' + String(serial).padStart(6, '0');
  let sum = 0;
  for (let i = 0; i < 10; i++) { const ch = code[i]; sum += (map[ch] || +ch) * Math.pow(2, i); }
  return code + ' ' + (sum % 11 % 10);
}

    docs: 'Booking confirmation, bill of lading, export declaration, VGM, terminal EDI (COPARN, BAPLIE)', kpi: 'Crane moves per hour, berth productivity, container dwell time, truck turn time', rel: ['bol', 'edi', 'demurrage', 'customs'] },
  transship: { t: 'Transshipment hub', tag: 'Ocean network', b: 'Hub ports such as Singapore move most of their boxes from one ship to another rather than to local customers. Mainline vessels drop containers that feeder ships carry on to smaller ports. Missing a connection at a hub can cost a week until the next sailing.',

  rail: { t: 'Intermodal rail ramp', tag: 'Inland transport', b: 'In North America containers ride double-stacked on well cars, which roughly halves the train length per box. Ramps use gantry cranes or side loaders to move boxes between rail cars and truck chassis. Rail is slower than truck over short hauls but cheaper and lower-carbon over long ones.',

  dc: { t: 'Distribution center', tag: 'Warehousing', b: 'The DC receives containers, unloads and checks them, then either puts stock away or cross-docks it straight to outbound doors. Orders are picked, packed and handed to parcel carriers or fleets. Many DCs are run by a 3PL on behalf of the brand.',

  lastmile: { t: 'Last-mile delivery', tag: 'Final leg', b: 'The final leg from a local hub to the customer is often the most expensive part of the journey per parcel: dense routes, parking, failed attempts and returns. Vans, cargo bikes, parcel lockers and drones each trade cost, speed and reach.',

  air: { t: 'Air cargo hub', tag: 'Air freight', b: 'Air freight moves in unit load devices (ULDs) on dedicated freighters or in passenger aircraft bellies. IATA estimates air carries under 1% of world trade by volume but roughly a third by value. It is the expedite lever when a deadline is at risk, at many times the cost and carbon of ocean.',
    docs: 'Air waybill (AWB), house AWB, security declaration', kpi: 'Cost per kg, transit time, uplift reliability', rel: ['co2', 'leadtime'] },

  // ---------- chokepoints ----------
  suez: { t: 'Suez Canal', tag: 'Chokepoint', b: 'A sea-level canal with no locks, about 193 km long, linking the Mediterranean and the Red Sea. Ships transit in convoys. In March 2021 the Ever Given grounded and blocked it for six days. From late 2023, attacks on shipping near Bab-el-Mandeb pushed most large container lines to sail around Africa instead.',
    docs: 'Suez Canal transit dues, convoy booking', kpi: 'Transit queue, war-risk premium, days added by reroute', rel: ['cape', 'bab'] },
  panama: { t: 'Panama Canal', tag: 'Chokepoint', b: 'Locks lift ships about 26 m to Gatun Lake and back down. Every transit uses fresh water from the lake, so drought limits both the number of daily slots and the draft ships may load to. The 2023 to 2024 drought forced the canal authority to cut transits and sell scarce slots at auction. The Neopanamax locks opened in 2016.',

  bab: { t: 'Bab-el-Mandeb', tag: 'Chokepoint', b: 'The narrow strait between Yemen and Djibouti/Eritrea that joins the Red Sea and Gulf of Aden. Any Asia to Europe ship using Suez must pass it, so a security threat here closes the Suez route in practice.',

  malacca: { t: 'Strait of Malacca', tag: 'Chokepoint', b: 'The main sea route between the Indian Ocean and the South China Sea. It narrows to under 3 km in the Singapore Strait, one of the busiest stretches of water on the planet.',

  cape: { t: 'Cape of Good Hope', tag: 'Alternative route', b: 'The long way round Africa. It avoids Suez and the Red Sea but adds thousands of kilometres, more fuel, more carbon and rougher winter seas. Carriers absorb part of the extra days by sailing faster, which burns even more fuel.',

  // ---------- diorama objects ----------
  excavator: { t: 'Hydraulic excavator', tag: 'Mine equipment', b: 'Loads ore and overburden into haul trucks. The match between bucket size and truck body decides how many passes each load takes, which drives the whole pit cycle time.', kpi: 'Passes per truck, tonnes per hour', rel: ['mine'] },
  haultruck: { t: 'Haul truck', tag: 'Mine equipment', b: 'Carries ore from the face to the crusher or leach pads. Haul distance and road grade set fuel use and cycle time.', kpi: 'Cycle time, payload, fuel per tonne', rel: ['mine'] },
  conveyor: { t: 'Conveyor', tag: 'Material handling', b: 'Moves crushed ore or finished cartons continuously. Conveyors cut handling cost but are a single point of failure: a jam stops the line.', kpi: 'Throughput, uptime', rel: ['mine', 'factory'] },
  leach: { t: 'Leach pads and processing', tag: 'Mine processing', b: 'Rare earths in ion-adsorption clays are washed out with a salt solution, then precipitated and separated into individual oxides. Processing, not digging, is where most of the value and the environmental risk sits.', kpi: 'Recovery rate, water use', rel: ['mine'] },
  assembly: { t: 'Assembly line', tag: 'Production', b: 'Robot arms and operators build the product station by station. Line speed and first-pass yield decide how many units are ready for the container cut-off.', kpi: 'Takt time, first-pass yield', rel: ['factory'] },
  stuffing: { t: 'Container stuffing', tag: 'Origin handling', b: 'Cartons are loaded into the container at the factory (FCL) or at a consolidator warehouse (LCL). Good load planning maximises cubic use and secures the cargo so it survives the sea.', docs: 'Load plan, packing list, seal number', kpi: 'Cube utilisation, damage rate', rel: ['fcl', 'vgm', 'teu'] },
  scale: { t: 'Weighbridge and VGM', tag: 'Compliance', b: 'Under the SOLAS rule in force since July 2016 the shipper must declare the verified gross mass of every packed export container. No VGM, no loading.', docs: 'VGM declaration', kpi: 'VGM submitted before cut-off', rel: ['vgm'] },
  sts: { t: 'Ship-to-shore crane', tag: 'Port equipment', b: 'The giant quay crane that lifts boxes on and off the ship. Its trolley runs out along the boom over the vessel, the spreader locks onto the container corners and lifts. Each crane typically manages a few dozen moves per hour, and several work one ship at once.', kpi: 'Gross crane moves per hour', rel: ['port'] },
  straddle: { t: 'Straddle carrier / yard vehicle', tag: 'Port equipment', b: 'Carries containers between the quay and the stacking yard. Automated terminals such as Rotterdam Maasvlakte use driverless vehicles for this run.', kpi: 'Cycle time, yard moves per hour', rel: ['port'] },
  yard: { t: 'Container yard', tag: 'Port storage', b: 'Boxes are stacked in blocks grouped by vessel, destination and weight so they can be loaded in the right order. Every extra day a box sits here is dwell time, and beyond the free days it costs demurrage.', kpi: 'Dwell time, yard utilisation', rel: ['demurrage', 'teu'] },
  reeferrack: { t: 'Reefer stacks', tag: 'Cold chain', b: 'Refrigerated containers plug into power points in a dedicated part of the yard. Staff or remote monitoring check that each unit holds its set point.', kpi: 'Plug-in time, alarms resolved', rel: ['reefer', 'coldchain'] },
  gate: { t: 'Terminal gate', tag: 'Port access', b: 'Trucks check in with an appointment. Cameras read the container number and seal, and the driver gets a yard slot. Gate queues spill onto city roads when the terminal is congested.', docs: 'Equipment interchange receipt (EIR)', kpi: 'Truck turn time, gate transactions per hour', rel: ['drayage', 'edi'] },
  xray: { t: 'Customs X-ray scanner', tag: 'Customs', b: 'Non-intrusive inspection scans a whole container in minutes. Customs targets boxes using risk scores built from advance data (manifests, ISF, declarations). Flagged boxes go to a physical exam, which adds days and fees.', docs: 'Customs exam notice', kpi: 'Exam rate, clearance time', rel: ['customs', 'isf', 'hs'] },
  customsoff: { t: 'Customs officer', tag: 'Customs', b: 'Checks that what is declared matches what is in the box: description, HS code, value, origin and quantity. Mismatches lead to holds, penalties and duty adjustments.', rel: ['customs', 'hs', 'tariff'] },
  ship: { t: 'Container ship', tag: 'Ocean carriage', b: 'The largest container ships now carry over 24,000 TEU. Most lines sail slower than the design speed (slow steaming) to save fuel. A weekly service rotates several ships around a fixed loop of ports.', docs: 'Bill of lading, cargo manifest, bay plan (BAPLIE)', kpi: 'Schedule reliability, fuel per TEU', rel: ['bol', 'teu', 'co2'] },
  lashing: { t: 'Lashing crew', tag: 'Port labour', b: 'Lashers fix twist-locks and lashing rods so the stack stays put in heavy seas. Lost containers overboard usually trace back to stack weight errors or parametric rolling in storms.', rel: ['vgm', 'ship'] },
  mule: { t: 'Locomotive "mule"', tag: 'Panama Canal', b: 'Electric locomotives on rails beside the original Panama locks keep ships centred as they move through the chambers. The newer Neopanamax locks use tugboats instead.', rel: ['panama'] },
  locks: { t: 'Lock chambers', tag: 'Panama Canal', b: 'Water fills or drains each chamber by gravity to raise or lower the ship one step at a time. No pumps are used, which is why lake level and rainfall govern canal capacity.', rel: ['panama'] },
  convoy: { t: 'Canal convoy', tag: 'Suez Canal', b: 'Ships enter Suez in scheduled northbound and southbound convoys and pass each other in bypass sections and the Great Bitter Lake.', rel: ['suez'] },
  storm: { t: 'Weather at sea', tag: 'Disruption', b: 'Storms force speed reductions and detours, and in the worst cases cause container losses. Weather routing services plan voyages around forecast systems.', kpi: 'Days lost, containers lost', rel: ['ship', 'leadtime'] },
  doublestack: { t: 'Double-stack train', tag: 'Rail', b: 'Two containers high on low-slung well cars. Clearance limits rule this out on most European and Asian networks, which is one reason North American intermodal is so cost-efficient over long distances.', kpi: 'Boxes per train, cost per container-mile', rel: ['rail'] },
  railcrane: { t: 'Rail-mounted gantry', tag: 'Rail equipment', b: 'Spans several tracks and truck lanes to transfer boxes between well cars and chassis.', kpi: 'Lifts per hour', rel: ['rail'] },
  chassis: { t: 'Container chassis', tag: 'Equipment', b: 'The trailer frame a container sits on for road moves. Chassis shortages at US ports were a hidden cause of congestion in 2021.', rel: ['drayage'] },
  forklift: { t: 'Forklift / reach truck', tag: 'Warehouse equipment', b: 'Unloads pallets and puts them away into racking. Reach trucks lift to high bays in narrow aisles.', kpi: 'Pallet moves per hour', rel: ['dc'] },
  racks: { t: 'Pallet racking', tag: 'Warehouse storage', b: 'Reserve stock lives here. Slotting places fast movers near the dock to cut travel time.', kpi: 'Storage utilisation, travel time', rel: ['dc'] },
  crossdockln: { t: 'Cross-dock lane', tag: 'Warehouse flow', b: 'Inbound pallets go straight to an outbound door without being stored. It needs tight timing and good advance data (the ASN).', rel: ['crossdock', 'edi'] },
  dockdoor: { t: 'Dock door', tag: 'Warehouse', b: 'Trucks back in, the leveler bridges the gap, and a restraint holds the trailer so a forklift can drive in safely.', kpi: 'Door utilisation, unload time', rel: ['dc'] },
  van: { t: 'Delivery van', tag: 'Last mile', b: 'Route planning packs 100 or more stops into a shift. Each failed attempt adds a second trip.', kpi: 'Stops per hour, first-attempt rate', rel: ['lastmile'] },
  drone: { t: 'Delivery drone', tag: 'Last mile', b: 'Small parcels flown from a local hub, mainly in suburbs. Fast and low-carbon per parcel, limited by payload, weather and airspace rules.', kpi: 'Minutes to door, payload', rel: ['lastmile', 'co2'] },
  dronehub: { t: 'Drone hub', tag: 'Last mile', b: 'Launch and landing pads with battery swap and parcel loading.', rel: ['drone'] },
  locker: { t: 'Parcel locker', tag: 'Last mile', b: 'Customers collect from a locker instead of a doorstep, so a driver drops dozens of parcels in one stop.', kpi: 'Drops per stop', rel: ['lastmile'] },
  doorstep: { t: 'Doorstep', tag: 'Customer', b: 'Where the service level is judged. On time, undamaged and with proof of delivery.', rel: ['servicelevel'] },
  courier: { t: 'Courier', tag: 'Last mile', b: 'Walks the final metres, scans the parcel and captures proof of delivery.', rel: ['lastmile'] },
  packhouse: { t: 'Packhouse', tag: 'Farm', b: 'Bananas are de-handed, washed in tanks to stop latex staining, graded, packed and palletised. Pallets go to a pre-cooling room before the reefer is loaded.', kpi: 'Cartons per hour, reject rate', rel: ['farm', 'coldchain'] },
  reefertruck: { t: 'Reefer truck', tag: 'Cold chain', b: 'Carries the reefer container from farm to port with its unit running on a genset.', rel: ['reefer', 'coldchain'] },
  plane: { t: 'Freighter aircraft', tag: 'Air freight', b: 'Main-deck freighters carry pallets and ULDs that will not fit in passenger bellies.', kpi: 'Payload, block hours', rel: ['air'] },
  uld: { t: 'Unit load device (ULD)', tag: 'Air freight', b: 'Shaped containers and pallets that match the aircraft hold contour.', rel: ['air'] },
  worker: { t: 'Logistics worker', tag: 'People', b: 'Every node runs on people: crane operators, lashers, customs officers, rail crews, forklift drivers and couriers. Labour disputes at a single port or railroad can stall a whole region.', rel: ['strike'] },
  anchorage: { t: 'Anchorage queue', tag: 'Congestion', b: 'When berths are full, arriving ships wait at anchor. In early 2022 more than 100 ships were waiting for the Los Angeles and Long Beach terminals.', kpi: 'Ships waiting, days at anchor', rel: ['congestion'] },

  cableway: { t: 'Cableway', tag: 'Farm', b: 'Banana plantations hang an overhead cable through the rows. Workers hook cut bunches onto it and pull trains of them to the packhouse, so the fruit is not bruised by carrying or trucking.', kpi: 'Bunches per hour, bruise rate', rel: ['packhouse'] },
  bluebag: { t: 'Bunch covers', tag: 'Farm', b: 'Growing bunches are wrapped in blue polyethylene bags that shield the fruit from insects, scarring and sun, and keep it slightly warmer so it fills out.', rel: ['farm'] },
  // ---------- glossary ----------
  incoterms: { g: 'Trade terms', t: 'Incoterms 2020', b: 'The ICC\'s eleven three-letter rules that say who arranges and pays each part of the journey, where risk passes from seller to buyer, and who clears export and import customs. They do not transfer ownership, set the price or decide payment terms. Seven work for any mode (EXW, FCA, CPT, CIP, DAP, DPU, DDP) and four only for sea and inland waterway (FAS, FOB, CFR, CIF). Open the Incoterms explorer to see each one on the route.', rel: ['tariff', 'customs'] },
  hs: { g: 'Customs', t: 'HS codes', b: 'The Harmonized System from the World Customs Organization classifies goods with a 6-digit code: 2 digits for the chapter, 4 for the heading, 6 for the subheading. Over 200 countries use it. Countries add digits for their own tariff lines, for example the 10-digit US HTS. Example: 6109.10 is T-shirts, knitted or crocheted, of cotton. The code sets the duty rate, quotas and licence rules, so a wrong code means wrong duty, penalties and holds.', rel: ['tariff', 'customs'] },
  bol: { g: 'Documents', t: 'Bill of lading', b: 'Issued by the carrier when it takes the goods. It does three jobs: receipt for the cargo, evidence of the contract of carriage, and (when negotiable) a document of title the buyer must present to collect the box. A master B/L runs carrier to forwarder; a house B/L runs forwarder to shipper. A sea waybill is a non-negotiable alternative used when no bank needs to hold title.', rel: ['edi', 'nvocc'] },
  edi: { g: 'Data', t: 'EDI messages', b: 'Electronic data interchange carries structured messages between trading partners. North America mostly uses ANSI X12: 850 purchase order, 856 advance ship notice, 810 invoice, 214 carrier status, 315 ocean container status. International shipping uses UN/EDIFACT: IFTMIN booking instruction, COPARN container announcement, BAPLIE bay plan, CUSCAR customs cargo report. APIs are replacing some flows, and DCSA publishes open standards for track and trace.', rel: ['bol'] },
  pl34: { g: 'Roles', t: '3PL and 4PL', b: 'A 3PL (third-party logistics provider) runs logistics work for a shipper: warehousing, transport, customs, fulfilment. A 4PL sits one level up and manages the whole chain, including several 3PLs and carriers, often without owning trucks or warehouses. 1PL is the shipper doing it themselves; 2PL is an asset carrier.', rel: ['nvocc', 'dc'] },
  nvocc: { g: 'Roles', t: 'Freight forwarder and NVOCC', b: 'A forwarder books space, consolidates shipments and arranges documents for shippers. A non-vessel-operating common carrier (NVOCC) issues its own house bills of lading while buying space from ocean carriers.', rel: ['bol', 'fcl'] },
  broker: { g: 'Roles', t: 'Customs broker', b: 'A licensed agent who files entries, classifies goods, calculates duty and talks to customs for the importer of record.', rel: ['customs', 'hs'] },
  tariff: { g: 'Customs', t: 'Tariffs and duties', b: 'Import duties are mostly ad valorem (a % of customs value), sometimes specific (per unit or kg) or both. The US values goods on a transaction value that excludes international freight (close to FOB); the EU includes freight and insurance (close to CIF). Rules of origin decide whether a free trade agreement rate applies. Extra measures such as anti-dumping duties or US Section 301 tariffs sit on top.', rel: ['hs', 'incoterms', 'coo'] },
  customs: { g: 'Customs', t: 'Customs clearance', b: 'Export clearance tells the origin country what is leaving. Import clearance declares the goods, pays duty and taxes and gets release. Customs targets shipments using advance data, scans some and opens a few. The importer of record carries the legal responsibility.', rel: ['hs', 'isf', 'broker'] },
  isf: { g: 'Customs', t: 'ISF (10+2)', b: 'For ocean shipments into the US, the importer must file an Importer Security Filing 24 hours before the cargo is loaded at the foreign port. Late or missing filings can draw liquidated damages of up to $5,000 per violation and a hold on the box.', rel: ['customs'] },
  vgm: { g: 'Documents', t: 'VGM (verified gross mass)', b: 'Required by SOLAS since 1 July 2016. The shipper declares the weighed mass of each packed container so the ship\'s stowage plan is safe.', rel: ['stuffing'] },
  coo: { g: 'Documents', t: 'Certificate of origin', b: 'Shows where goods were made. Preferential certificates qualify goods for free trade agreement duty rates; non-preferential ones support quotas, labelling and trade remedy rules.', rel: ['tariff'] },
  teu: { g: 'Units', t: 'TEU and FEU', b: 'A TEU is a twenty-foot equivalent unit, the standard measure of container capacity. A 40-foot box is two TEU (one FEU). Rates and port capacity are quoted in TEU.', rel: ['fcl'] },
  fcl: { g: 'Units', t: 'FCL and LCL', b: 'Full container load: one shipper fills the box. Less than container load: a consolidator combines several shippers in one box, which is cheaper for small volumes but adds handling time.', rel: ['nvocc', 'teu'] },
  reefer: { g: 'Equipment', t: 'Reefer container', b: 'An insulated container with its own refrigeration unit, powered from ship or yard sockets or a clip-on genset. It holds a set point, logs temperature and can control the atmosphere for produce.', rel: ['coldchain'] },
  coldchain: { g: 'Operations', t: 'Cold chain', b: 'The unbroken temperature-controlled path from farm or plant to shelf. A breach anywhere, even a few hours unplugged at a port, can cut shelf life or ruin the load. Data loggers prove the chain held.', rel: ['reefer'] },
  drayage: { g: 'Operations', t: 'Drayage', b: 'Short truck moves of containers between ports, rail ramps and nearby warehouses. Small in distance, large in cost per km and in congestion impact.', rel: ['chassis', 'gate'] },
  crossdock: { g: 'Operations', t: 'Cross-docking', b: 'Moving goods from inbound to outbound docks with little or no storage. It cuts inventory but needs reliable arrival times.', rel: ['dc'] },
  demurrage: { g: 'Costs', t: 'Demurrage and detention', b: 'Terminals and carriers give a few free days, then charge by the day. In common US usage, demurrage is charged when a container stays inside the terminal beyond its free days; detention is charged when the shipper keeps the carrier\'s box outside the terminal too long. Congestion can trigger both even when the shipper did nothing wrong.', rel: ['yard', 'congestion'] },
  congestion: { g: 'Operations', t: 'Port congestion', b: 'When arrivals beat terminal capacity, ships queue, yards fill, and empty containers pile up in the wrong places. Effects ripple for months because ships and boxes run late on their next loops.', rel: ['anchorage', 'demurrage'] },
  strike: { g: 'Operations', t: 'Labour disruption', b: 'Strikes and slowdowns at ports or railroads stop flows fast. In October 2024 a three-day strike closed ports on the US East and Gulf coasts, and backlogs took weeks to clear.', rel: ['worker'] },
  bullwhip: { g: 'Operations', t: 'Bullwhip effect', b: 'Small changes in consumer demand get amplified into large swings in orders further up the chain, because each tier adds safety stock and batches orders. Shared demand data dampens it.', rel: ['leadtime'] },
  leadtime: { g: 'KPIs', t: 'Lead time', b: 'Elapsed days from the start of the order (here: raw materials or harvest) to delivery at the doorstep. Variability matters as much as the average, because safety stock grows with it.', rel: ['servicelevel'] },
  costteu: { g: 'KPIs', t: 'Cost per TEU', b: 'Door-to-door logistics cost divided by TEU shipped. In this model it includes freight, handling, customs fees, surcharges and last mile, and excludes import duty, which is shown separately.', rel: ['tariff', 'teu'] },
  co2: { g: 'KPIs', t: 'Carbon footprint', b: 'Emissions per TEU from each leg: distance × tonnes × a factor per mode. Ocean is lowest per tonne-km, air is highest by far. Companies report with the GLEC Framework and ISO 14083. The factors in this model are illustrative.', rel: ['cape', 'air'] },
  servicelevel: { g: 'KPIs', t: 'Service level', b: 'Share of demand served on time and in sellable condition. In this model every day a unit arrives late loses a slice of its sales (5 to 15% a day by mission), and spoiled units count as lost.', rel: ['leadtime', 'coldchain', 'safetystock'] },
  landed: { g: 'KPIs', t: 'Landed cost', b: 'Everything it costs to put a unit on the shelf beyond its purchase price: freight, handling, fees, duty, inventory carrying cost and carbon. In this model it is shown per TEU and also includes late penalties. A cheap slow route can lose on landed cost once carrying cost and lost sales are counted.', rel: ['carrying', 'tariff', 'ets'] },
  carrying: { g: 'Costs', t: 'Inventory carrying cost', b: 'Goods tie up money. Carrying cost is commonly put at 20 to 30% of inventory value a year: capital, insurance, storage and obsolescence. Goods at sea count too. One extra week at sea on $200,000 of laptops costs about $1,000 at 25% a year.', rel: ['landed', 'safetystock'] },
  safetystock: { g: 'Operations', t: 'Safety stock', b: 'Extra inventory held to cover swings in demand and lead time. Longer and less reliable supply lines need more of it, which is a hidden cost of every reroute and delay.', rel: ['reliability', 'bullwhip'] },
  slowsteam: { g: 'Operations', t: 'Slow steaming', b: 'Fuel burn per hour rises roughly with the cube of speed, so per kilometre it rises with the square. Since the late 2000s carriers have cut speeds to save fuel and absorb surplus ships. At 14 knots a ship burns about a quarter less fuel per km than at 16.', rel: ['co2', 'ets'] },

  if (m.flags.tariffDay && m.day > m.flags.tariffDay) {
    m.dutyPerTeu = m.valuePerTeu * 0.265;
    m.note(`Entry filed on day ${m.day.toFixed(1)}, after the tariff change. Duty now 26.5%: ${fmt$(m.dutyPerTeu)}/TEU.`, 'bad');
  }
}

    st.add(box(L + 12, top, 6, '#c9ced4', cx(c), 0, -44), box(L + 12, top, 14, '#c9ced4', cx(c), 0, 0), box(L + 12, top, 6, '#c9ced4', cx(c), 0, 44));
    for (const z of lanes) st.add(box(3, top + 1, W, '#6b7682', cx(c) - L / 2 - 4, 0, z));

  }

/* ================= SIM: mission engine ================= */
const DAYS_PER_SEC = 0.5;
const EU_CC = new Set(['NL']);
const KM_PER_DAY_PER_KNOT = 44.448;

function resolveLeg(raw, m) {
  const l = Object.assign({}, raw);
  if (l.kind === 'move') {
    const path = l.lane ? lanePath(l.lane) : directPath(l.from, l.to, l.mode);
    l.km = path.km;
    l.ets = 0;
    const lm = MODEL.lastMile[l.mode];
    if (lm) { l.days = lm.days; l.cost = lm.cost; l.co2 = lm.co2; }
    else if (l.mode === 'sea') {
      const kn = (m && m.kn) || 16, f = Math.pow(kn / 16, 2);
      l.kn = kn;
      l.days = l.km / (kn * KM_PER_DAY_PER_KNOT);
      l.cost = l.km * (MODEL.seaBasePerTeuKm + MODEL.seaFuelPerTeuKm * f) * (m && m.fuelIndex || 1);
      l.co2 = l.km * MODEL.tonnesPerTeu * MODEL.co2gPerTkm.sea * f / 1e6;
      // EU ETS: half of the emissions on voyages into or out of the EU
      if (EU_CC.has(NODES[l.to].cc) !== EU_CC.has(NODES[l.from].cc)) l.ets = l.co2 * 0.5 * MODEL.etsUsdPerT;
    } else {
      const sp = MODEL.speedKmDay[l.mode];
      l.days = l.mode === 'air' ? l.km / sp + 0.3 : l.mode === 'rail' ? l.km / sp + 0.5 : Math.max(0.25, l.km / sp);
      l.cost = l.km * MODEL.costPerTeuKm[l.mode] + (l.extraCost || 0);
      l.co2 = l.km * MODEL.tonnesPerTeu * MODEL.co2gPerTkm[l.mode] / 1e6;
    }
  } else {
    l.days = Math.max(0.05, l.days);
    l.cost = l.cost || 0;
    l.co2 = 0.004 * l.days;
    l.ets = 0;
  }
  return l;
}
function legTitle(l) {
  if (l.kind === 'dwell') return l.label;
  return l.label || `${modeName(l.mode)}: ${NODES[l.from].short} to ${NODES[l.to].short}`;
}

class Mission {
  constructor(def, plan, seed, dry) {
    this.def = def; this.plan = plan; this.dry = !!dry;
    this.kn = plan.kn || 16;
    this.rand = rng(seed || ((Math.random() * 1e9) | 0));
    this.day = 0; this.cost = 0; this.co2 = 0; this.ets = 0; this.carry = 0; this.dem = 0;
    this.items = []; this.flags = {}; this.fired = new Set();
    this.log = []; this.ms = []; this.decisions = []; this.done = false; this.blocked = null; this.version = 0;
    this.temps = []; this.reeferLoss = 0; this.fault = null;
    this.valuePerTeu = def.value / def.teu;
    this.dutyPerTeu = def.dutyPerTeu != null ? def.dutyPerTeu : def.dutyRate != null ? this.valuePerTeu * def.dutyRate : 0;
    const serial = 100000 + ((this.rand() * 899999) | 0);
    this.boxId = iso6346('CVL', serial);
    this.bol = 'CVLB' + String(serial * 7).slice(0, 9);
    this.seal = 'H' + String(((this.rand() * 1e7) | 0)).padStart(7, '0');
    this.cohorts = def.build.call(def, plan, this).map(c => this.cohort(c.name, c.share, c.legs.map(l => resolveLeg(l, this))));
    this.deadline = def.targets.lead;
  }
  cohort(name, share, legs, quality = 1, termDays = 0) { return { name, share, legs, i: 0, t: 0, started: false, done: false, quality, deliveredDay: null, termDays }; }
  get main() { return this.cohorts[0]; }
  get carryPerDay() { return this.valuePerTeu * MODEL.carryRatePerYear / 365; }

  // ---- effects API used by mission events ----
  find(id, c = this.cur || this.main) { for (let i = c.i; i < c.legs.length; i++) if (c.legs[i].id === id) return i; return -1; }
  replaceLane(id, lane, label) { const c = this.cur || this.main, i = this.find(id, c); if (i < 0) return; c.legs[i] = resolveLeg(Object.assign({}, c.legs[i], { lane, label }), this); this.touch(); }
  replaceMode(id, mode, label) { const c = this.cur || this.main, i = this.find(id, c); if (i < 0) return; c.legs[i] = resolveLeg(Object.assign({}, c.legs[i], { mode, label, lane: null }), this); this.touch(); }
  setDays(id, days) { const c = this.cur || this.main, i = this.find(id, c); if (i < 0) return; c.legs[i] = resolveLeg(Object.assign({}, c.legs[i], { days }), this); this.touch(); }
  removeLeg(id) { const c = this.cur || this.main, i = this.find(id, c); if (i > c.i || (i === c.i && !c.started)) { c.legs.splice(i, 1); this.touch(); } }
  replaceFrom(id, legs) { const c = this.cur || this.main, i = this.find(id, c); if (i < 0) return; c.legs.splice(i, c.legs.length - i, ...legs.map(l => resolveLeg(l, this))); this.touch(); }
  insertBefore(id, leg) { const c = this.cur || this.main, i = this.find(id, c); if (i < 0) return; c.legs.splice(i, 0, resolveLeg(leg, this)); this.touch(); }
  insertAfterCurrentDelay(days, why) { const c = this.cur || this.main, l = c.legs[c.i]; l.days += days; this.note(`${why}: +${days} day${days > 1 ? 's' : ''}.`, 'warn'); this.touch(); }
  legNode(id) { const c = this.cur || this.main, i = this.find(id, c); const l = c.legs[i]; return l.kind === 'move' ? l.from : l.node; }
  addCost(perTeu, why) { this.cost += perTeu; this.items.push({ why, v: perTeu }); if (!this.dry) this.note(`${why}: +${fmt$(perTeu)}/TEU`, 'warn'); }
  note(text, cls) { if (this.dry) return; this.log.unshift({ day: this.day, text, cls }); this.touch(); }
  splitCohort(share, delay, label) {
    const c = this.cur || this.main;
    const rest = c.legs.slice(c.i).map(l => Object.assign({}, l));
    const here = c.legs[c.i], node = here.kind === 'dwell' ? here.node : here.from;
    rest.unshift(resolveLeg(dw('roll', node, label, delay), this));
    c.share -= share;
    this.cohorts.push(this.cohort('Rolled', share, rest, c.quality, c.termDays));
    this.note(`${Math.round(share * 100)}% of volume rolled to the next sailing (+${delay} days).`, 'warn');
    this.touch();
  }
  reeferFault(unresolved) { this.fault = { day: this.day, unresolved }; if (unresolved) this.reeferLoss = 0.1; this.touch(); }
  touch() { this.version++; }

  // ---- projections ----
  remaining(c) { if (c.done) return 0; let d = c.legs[c.i].days - c.t; for (let i = c.i + 1; i < c.legs.length; i++) d += c.legs[i].days; return d; }
  eta(c) { return c.done ? c.deliveredDay : this.day + this.remaining(c); }
  // Demurrage: terminal days past the free time, per TEU
  demFor(before, add) { const F = MODEL.freeDays; return (Math.max(0, before + add - F) - Math.max(0, before - F)) * MODEL.demurragePerDay; }
  projected() {
    let cost = this.cost, co2 = this.co2, ets = this.ets, carry = this.carry, dem = this.dem, eta = 0, sl = 0, late = 0, conf = 0;
    for (const c of this.cohorts) {
      if (!c.done) {
        let term = c.termDays;
        for (let i = c.i; i < c.legs.length; i++) {
          const l = c.legs[i], f = i === c.i ? 1 - c.t / l.days : 1;
          cost += l.cost * c.share * f; co2 += l.co2 * c.share * f; ets += l.ets * c.share * f;
          if (l.term) { dem += this.demFor(term, l.days * f) * c.share; term += l.days * f; }
          if (l.mode === 'sea' && !(i === c.i && c.started)) conf += l.days * MODEL.seaDelaySd;
        }

      let q = c.quality;
      if (this.def.reefer && !c.done) { const over = this.ageAtRipen(c) - this.def.reefer.greenLife; if (over > 0) q *= Math.max(0, 1 - 0.04 * over); }
      const lateDays = Math.max(0, e - this.deadline);

      late += (this.def.latePerTeuDay || 0) * lateDays * c.share;
    }
    sl = Math.max(0, sl - this.reeferLoss);
    const parts = { logistics: cost, fees: dem, duty: this.dutyPerTeu, carry, ets, late };
    const landed = cost + dem + this.dutyPerTeu + carry + ets + late;
    return { cost, co2, eta, sl: sl * 100, landed, parts, conf };
  }

  ageAtRipen(c) {
    let d = this.day - c.t;

  eventFor(c, leg, f0, f1) {

      leg.varied = true;
      const g = (this.rand() + this.rand() + this.rand() - 1.5) * 2;
      const factor = clamp(1 + MODEL.seaDelayMean + g * MODEL.seaDelaySd, 0.95, 1.25);
      const delta = leg.days * (factor - 1);
      leg.days *= factor;
      if (Math.abs(delta) >= 0.4 && c === this.main) this.note(`Schedule reliability: vessel running ${Math.abs(delta).toFixed(1)} days ${delta > 0 ? 'late' : 'early'} against plan.`, delta > 0 ? 'warn' : '');
    }
    if (this.def.reefer && leg.ripen) {
      const over = this.day - this.def.reefer.greenLife;
      if (over > 0) { c.quality *= Math.max(0, 1 - 0.04 * over); this.note(`Fruit reached ripening ${over.toFixed(1)} days past green life. Quality ${Math.round(c.quality * 100)}%.`, 'bad'); }
    }
    if (!this.dry && c === this.main) UI.legStarted(this, leg);
  }
  exit(c, leg) {
    if (leg.ms) leg.ms.forEach(t => this.milestone(null, leg, t));
    if (leg.ediEnd) this.milestone(leg.ediEnd, leg);
    if (leg.final) this.milestone(null, leg, 'Delivered, proof of delivery captured');
    if (leg.onExit) leg.onExit(this, c);
  }
  milestone(code, leg, text) {
    const names = { I: 'Gate in at terminal', AE: 'Loaded on vessel', VD: 'Vessel departed', VA: 'Vessel arrived', UV: 'Unloaded from vessel', OA: 'Gate out from terminal' };
    const where = leg.kind === 'dwell' ? NODES[leg.node].short : code === 'VD' ? NODES[leg.from].short : NODES[leg.to].short;
    this.ms.unshift({ day: this.day, code, text: text || names[code], where });
    this.touch();
  }
  accrue(c, leg, d) {
    const f = d / leg.days;
    this.cost += leg.cost * c.share * f;
    this.co2 += leg.co2 * c.share * f;
    this.ets += leg.ets * c.share * f;
    this.carry += this.carryPerDay * d * c.share;
    if (leg.term) {
      const fee = this.demFor(c.termDays, d);
      if (fee > 0 && c.termDays <= MODEL.freeDays && c === this.main) this.note(`Free time used up at ${NODES[leg.node].short}. Demurrage now ${fmt$(MODEL.demurragePerDay)}/TEU per day.`, 'warn');
      this.dem += fee * c.share; c.termDays += d;
    }
  }
  step(dt) {
    if (this.done || this.blocked || dt <= 0) return;
    this.day += dt;
    for (const c of this.cohorts) {
      let rem = dt;
      while (rem > 1e-9 && !c.done) {
        const leg = c.legs[c.i];
        if (!c.started) {
          const ev = this.eventFor(c, leg, 0, 0);
          if (ev) { this.day -= rem; if (this.trigger(ev, c)) return; this.day += rem; continue; }
          this.enter(c, leg);
        }
        const f0 = c.t / leg.days, s = Math.min(rem, leg.days - c.t), f1 = (c.t + s) / leg.days;
        const ev = this.eventFor(c, leg, f0, f1);
        if (ev) {
          const s2 = Math.max(0, ev.at * leg.days - c.t);
          this.accrue(c, leg, s2); c.t += s2; rem -= s2;
          if (this.trigger(ev, c)) { this.day -= rem; return; }
          continue;
        }
        this.accrue(c, leg, s); c.t += s; rem -= s;
        if (c.t >= leg.days - 1e-9) {
          this.exit(c, leg);
          c.i++; c.t = 0; c.started = false;
          if (c.i >= c.legs.length) { c.done = true; c.i = c.legs.length - 1; c.t = c.legs[c.i].days; c.deliveredDay = this.day - rem; this.note(`${this.cohorts.length > 1 ? c.name + ' volume' : 'Shipment'} delivered on day ${c.deliveredDay.toFixed(1)}.`, c.deliveredDay <= this.deadline ? '' : 'bad'); }
          this.touch();
        }
      }
    }
    if (this.def.reefer) this.sampleTemp();
    if (this.cohorts.every(c => c.done)) this.finish();
  }
  sampleTemp() {
    const last = this.temps[this.temps.length - 1];
    if (last && this.day - last.d < 0.25) return;
    const set = this.def.reefer.set;
    let v = set + (this.rand() - 0.5) * 0.5;
    if (this.fault) {
      const since = this.day - this.fault.day;
      v = this.fault.unresolved ? Math.min(19, 16.5 + since * 0.8) + (this.rand() - 0.5) * 0.4 : since < 0.4 ? 17 - since * 9 : v;
    }
    this.temps.push({ d: this.day, v });
  }
  finish() {
    this.done = true;
    const p = this.projected();
    this.result = { lead: Math.max(...this.cohorts.map(c => c.deliveredDay)), landed: p.landed, parts: p.parts, co2: p.co2, sl: p.sl };
    this.result.score = scoreOf(this.result, this.def.targets);
    this.touch();
    if (!this.dry) UI.debrief(this);
  }
  static preview(def, plan) {
    const m = new Mission(def, plan, 1, true);
    const p = m.projected();
    return { days: p.eta, landed: p.landed, co2: p.co2, parts: p.parts };
  }
}

function scoreOf(r, t) {
  const parts = {
    lead: r.lead <= t.lead ? 25 : 25 * Math.max(0, 1 - (r.lead / t.lead - 1) * 2.5),
    cost: r.landed <= t.landed ? 25 : 25 * Math.max(0, 1 - (r.landed / t.landed - 1) * 2),
    co2: r.co2 <= t.co2 ? 25 : 25 * Math.max(0, 1 - (r.co2 / t.co2 - 1) * 1.2),
    sl: r.sl >= t.sl ? 25 : 25 * Math.max(0, 1 - ((t.sl - r.sl) / t.sl) * 3),
  };
  const total = Math.round(parts.lead + parts.cost + parts.co2 + parts.sl);
  return { parts, total, grade: total >= 90 ? 'A' : total >= 75 ? 'B' : total >= 60 ? 'C' : 'D' };
}

  drawCold() {
    const c = $('#coldChart'), m = App.mission; if (!c || !m) return;

    c.width = W * dpr; c.height = H * dpr;
    const g = c.getContext('2d'); g.scale(dpr, dpr);

    const span = Math.max(m.deadline, m.day), y = v => H - 4 - (v - 10) / 10 * (H - 8), x = d => d / span * W;
    g.fillStyle = css.getPropertyValue('--chip'); g.fillRect(0, 0, W, H);
    g.strokeStyle = css.getPropertyValue('--fault'); g.setLineDash([3, 3]); g.beginPath(); g.moveTo(0, y(14.5)); g.lineTo(W, y(14.5)); g.stroke();

{ const u = store.get('ui', {}); if (innerWidth > 820) { document.body.classList.toggle('lc', !!u.lc); document.body.classList.toggle('rc', !!u.rc); } UI.layoutCam(); }
$('#btnMissions').onclick = () => UI.missions();
$('#btnLearn').onclick = () => UI.learn();
$('#playBtn').onclick = () => { App.paused = !App.paused; UI.syncPlay(); };
$('#speedSeg').querySelectorAll('button').forEach(b => b.onclick = () => {
  App.speed = +b.dataset.s;
  $('#speedSeg').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
});
document.querySelectorAll('.mtabs button').forEach(b => b.onclick = () => {
  const on = document.body.dataset.tab !== b.dataset.tab;
  document.body.dataset.tab = on ? b.dataset.tab : 'none';
  document.querySelectorAll('.mtabs button').forEach(x => x.setAttribute('aria-pressed', String(on && x === b)));
});
modal.addEventListener('click', e => { if (e.target === modal && !(App.mission && App.mission.blocked)) UI.closeModal(); });
addEventListener('keydown', e => {
  if ((e.key === 'f' || e.key === 'F') && !e.metaKey && !e.ctrlKey && !e.altKey && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && !modal.classList.contains('on')) { UI.focus(); return; }
  if (e.key !== 'Escape') return;
  if (modal.classList.contains('on')) { if (!(App.mission && App.mission.blocked)) UI.closeModal(); }
  else if (card.classList.contains('on')) card.classList.remove('on');
  else if (document.body.classList.contains('focus')) UI.focus(false);
  else UI.back();
});

// click vs drag on the canvas
let down = null;
renderer.domElement.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY }; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6) { down = null; return; }
  down = null;
  const list = App.view === 'globe' ? Globe.pickables : App.stage.pick;
  const hit = pickAt(e.clientX, e.clientY, list);
  if (!hit) { card.classList.remove('on'); return; }
  if (hit.type === 'node') UI.openNode(hit.id);
  else if (hit.type === 'ship') UI.openNode('open_sea');
  else if (hit.type === 'info') UI.info(hit.key);
});
let hoverT = 0;
renderer.domElement.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse' || performance.now() - hoverT < 60) return;
  hoverT = performance.now();
  const list = App.view === 'globe' ? Globe.pickables : App.stage ? App.stage.pick : [];
  renderer.domElement.style.cursor = pickAt(e.clientX, e.clientY, list) ? 'pointer' : '';
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  UI.layoutCam();
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (App.view === 'diorama') UI.openNode(App.nodeId); });

let lastInteract = 0, dragging = false;
controls.addEventListener('start', () => { dragging = true; });
controls.addEventListener('end', () => { dragging = false; lastInteract = performance.now(); });
const clock = new THREE.Clock();
let t = 0, uiT = 0;
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, clock.getDelta());
  const run = App.paused || App.pausedByEvent || modal.classList.contains('on') ? 0 : App.speed;
  const simDays = dt * run * DAYS_PER_SEC;
  t += dt * (App.paused ? 0 : 1);
  const m = App.mission;
  if (m) {
    if (!m.done) m.step(simDays);
    $('#clock').textContent = m.day.toFixed(1);
    // keep the shipment in view unless the user has just moved the camera
    if (App.view === 'globe' && !m.done && !CamTween.active && !dragging && performance.now() - lastInteract > 5000) {
      const p = Globe.moverPos(0);
      if (p && p.lengthSq() > 1) {
        const cur = camera.position.clone().normalize(), want = p.clone().normalize();
        if (cur.angleTo(want) > 0.35) camera.position.copy(slerpV(cur, want, Math.min(1, dt * 0.6)).multiplyScalar(camera.position.length()));
      }
    }
  }
  CamTween.step(dt);
  controls.update();
  if (App.view === 'globe') {
    renderer.toneMappingExposure = 1;
    Globe.update(dt, t, simDays || (App.paused ? 0 : dt * DAYS_PER_SEC * App.speed * 0.4));
    if (m) Globe.updateMovers(m);
    Labels.update('globe');
    renderer.render(Globe.scene, camera);
  } else {
    renderer.toneMappingExposure = App.stage.exposure;
    App.stage.update(dt * (App.paused ? 0 : Math.min(2, App.speed)), t);
    Labels.update('dio');
    renderer.render(App.stage.scene, camera);
  }
  uiT += dt;
  if (m && (m.version !== App.lastVer && uiT > 0.25 || uiT > 1)) {
    uiT = 0;
    if (m.version !== App.lastVer) { if (App.lastLegs !== legSig(m)) { Globe.drawRoute(m.cohorts); App.lastLegs = legSig(m); } UI.renderLeft(); }
    App.lastVer = m.version;
    UI.renderRight();
  }
}
const legSig = m => m.cohorts.map(c => c.i + ':' + c.legs.map(l => l.id + (l.lane || l.mode || '')).join(',')).join('|');

requestAnimationFrame(frame);
setTimeout(() => { $('#loading').classList.add('done'); if (!store.get('seen', false)) { store.set('seen', true); UI.welcome(); } }, 400);
</script>
</body>
</html>
