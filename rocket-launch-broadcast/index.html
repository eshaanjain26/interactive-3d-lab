<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meridian Launch Broadcast</title>
<style>
:root{
  --bg:#04060a; --panel:rgba(8,12,18,.76); --panel2:rgba(12,18,26,.9);
  --line:rgba(150,185,220,.14); --line2:rgba(150,185,220,.28);
  --text:#e9eff6; --mute:#8193a7; --dim:#56677a;
  --orange:#ff7a1a; --orange2:#ffb066; --cyan:#2ee6ff; --red:#ff3d3d; --green:#3dff9a;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ui{position:fixed;pointer-events:none;z-index:5}
.ui *{pointer-events:auto}
.panel{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:4px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* mission bug */
#bug{top:18px;left:18px;display:flex;align-items:center;gap:12px;padding:10px 14px 10px 10px}
#bug .mark{width:34px;height:34px;border-radius:3px;background:linear-gradient(135deg,var(--orange),#ff3d00);display:grid;place-items:center;font-weight:800;font-size:15px;color:#140700;letter-spacing:-.5px}
#bug h1{margin:0;font-size:13px;letter-spacing:.18em;font-weight:700}
#bug p{margin:2px 0 0;font-size:10.5px;color:var(--mute);letter-spacing:.14em}
#live{margin-left:6px;display:flex;align-items:center;gap:6px;font-size:10px;font-weight:700;letter-spacing:.16em;color:#fff;background:rgba(255,61,61,.14);border:1px solid rgba(255,61,61,.4);padding:4px 8px;border-radius:2px}
#live i{width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}

/* mission clock */
#clock{top:16px;left:50%;transform:translateX(-50%);text-align:center;padding:8px 22px 10px;pointer-events:none}
#clock .ph{font-size:10.5px;letter-spacing:.28em;color:var(--cyan);font-weight:700}
#clock .t{font-family:var(--mono);font-size:30px;font-weight:600;letter-spacing:.04em;margin-top:2px;font-variant-numeric:tabular-nums}
#clock .t b{color:var(--orange);font-weight:600}

/* countdown */
#count{top:50%;left:50%;transform:translate(-50%,-62%);text-align:center;pointer-events:none;opacity:0;transition:opacity .4s}
#count.on{opacity:1}
#countNum{display:block;font-family:var(--sans);font-weight:800;font-size:min(30vw,260px);line-height:.9;color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.85);text-shadow:0 0 40px rgba(255,122,26,.35);letter-spacing:-.04em}
#countNum.go{color:var(--orange);-webkit-text-stroke:0;font-size:min(16vw,150px);letter-spacing:.06em;text-shadow:0 0 50px rgba(255,122,26,.7)}
#countNum.pulse{animation:pulse 1s cubic-bezier(.2,.7,.2,1)}
@keyframes pulse{0%{transform:scale(1.28);opacity:0;filter:blur(6px)}18%{opacity:1;filter:blur(0)}100%{transform:scale(1);opacity:.92}}
#count small{display:block;margin-top:10px;font-size:12px;letter-spacing:.5em;color:var(--orange2);font-weight:700}

/* notifications */
#notes{top:18px;right:18px;width:290px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.note{position:relative;padding:10px 14px 10px 16px;background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--orange);border-radius:3px;transform:translateX(120%);opacity:0;transition:transform .55s cubic-bezier(.2,.9,.2,1),opacity .4s}
.note.in{transform:none;opacity:1}
.note.out{transform:translateX(120%);opacity:0}
.note.c{border-left-color:var(--cyan)}
.note .tag{font-family:var(--mono);font-size:10px;color:var(--mute);letter-spacing:.08em}
.note b{display:block;font-size:14px;letter-spacing:.14em;margin-top:2px}
.note small{display:block;font-size:11.5px;color:#b5c3d2;margin-top:2px}

/* altitude tape */
#tape{position:fixed;right:18px;top:50%;transform:translateY(-50%);width:96px;height:min(52vh,420px);z-index:4;pointer-events:none}

/* telemetry HUD */
#hud{left:18px;bottom:96px;width:300px;padding:12px 14px 12px;transition:opacity .35s,transform .35s}
#hud.off{opacity:0;transform:translateX(-20px);pointer-events:none}
.hud-h{display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:.24em;color:var(--mute);font-weight:700;margin-bottom:8px}
.hud-h span:last-child{color:var(--cyan)}
.row{display:grid;grid-template-columns:86px 1fr 34px;align-items:baseline;gap:2px 8px;padding:5px 0;border-top:1px solid var(--line)}
.row label{font-size:10px;letter-spacing:.16em;color:var(--mute)}
.row b{font-family:var(--mono);font-size:17px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.row i{font-style:normal;font-size:10px;color:var(--dim)}
.bar{grid-column:1/-1;height:3px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden}
.bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),#9ff6ff);transition:width .25s linear}
.row.o .bar span{background:linear-gradient(90deg,var(--orange),var(--orange2))}
.fuel{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding-top:8px;border-top:1px solid var(--line);margin-top:2px}
.fuel div{font-size:9.5px;letter-spacing:.14em;color:var(--mute)}
.fuel em{font-style:normal;float:right;font-family:var(--mono);color:var(--text);letter-spacing:0}
.fuel .tank{height:30px;margin-top:5px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:2px;position:relative;overflow:hidden}
.fuel .tank span{position:absolute;left:0;right:0;bottom:0;height:100%;background:linear-gradient(0deg,rgba(255,122,26,.85),rgba(255,176,102,.55));transition:height .25s linear}
.fuel .sep span{background:rgba(120,140,160,.25)}
.fuel .sep em{color:var(--dim)}

/* labels + reticles */
#labels,#reticles{position:fixed;inset:0;pointer-events:none;z-index:3}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;font-size:11px;letter-spacing:.06em;color:#dff8ff;display:none}
.lbl::before{content:"";position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.lbl .ln{position:absolute;top:0;height:1px;background:rgba(46,230,255,.7);width:44px}
.lbl .tx{position:absolute;top:-10px;padding:3px 7px;background:rgba(4,14,22,.82);border:1px solid rgba(46,230,255,.45);border-radius:2px}
.lbl.r .ln{left:4px}.lbl.r .tx{left:48px}
.lbl.l .ln{right:4px}.lbl.l .tx{right:48px}
.ret{position:absolute;left:0;top:0;width:44px;height:44px;margin:-22px 0 0 -22px;display:none}
.ret::before,.ret::after{content:"";position:absolute;inset:0;border:1.5px solid var(--cyan);clip-path:polygon(0 0,30% 0,30% 2px,2px 2px,2px 30%,0 30%,0 0,70% 0,100% 0,100% 30%,calc(100% - 2px) 30%,calc(100% - 2px) 2px,70% 2px,70% 0,100% 70%,100% 100%,70% 100%,70% calc(100% - 2px),calc(100% - 2px) calc(100% - 2px),calc(100% - 2px) 70%,100% 70%,0 70%,2px 70%,2px calc(100% - 2px),30% calc(100% - 2px),30% 100%,0 100%)}
.ret.o::before{border-color:var(--orange)}
.ret span{position:absolute;left:52px;top:8px;font-family:var(--mono);font-size:11px;white-space:nowrap;color:var(--cyan);text-shadow:0 0 6px #000}
.ret.o span{color:var(--orange2)}

/* spec panel */
#spec{top:84px;right:18px;width:320px;padding:16px 18px 14px;transform:translateX(calc(100% + 40px));transition:transform .45s cubic-bezier(.2,.9,.2,1);z-index:7}
#spec.open{transform:none}
#spec .k{font-size:10px;letter-spacing:.26em;color:var(--orange);font-weight:700}
#spec h2{margin:6px 0 2px;font-size:20px;letter-spacing:.04em}
#spec p{margin:0 0 12px;color:var(--mute);font-size:12px;line-height:1.45}
#spec table{width:100%;border-collapse:collapse;font-size:12.5px}
#spec td{padding:7px 0;border-top:1px solid var(--line)}
#spec td:first-child{color:var(--mute);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase}
#spec td:last-child{text-align:right;font-family:var(--mono)}
#spec .st{margin-top:12px;font-size:11px;letter-spacing:.12em;color:var(--cyan);font-family:var(--mono)}
#spec button{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:3px;border:1px solid var(--line);background:transparent;color:var(--mute);cursor:pointer;font-size:16px}
#spec button:hover{color:var(--text);border-color:var(--line2)}

/* bottom bar */
#bar{left:18px;right:18px;bottom:16px;display:flex;align-items:center;gap:14px;padding:10px 14px}
.btn{height:34px;min-width:34px;border-radius:3px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--text);cursor:pointer;display:inline-grid;place-items:center;font:600 11px var(--sans);letter-spacing:.06em;padding:0 9px}
.btn:hover{border-color:var(--line2);background:rgba(255,255,255,.06)}
.btn:focus-visible,.tg input:focus-visible+span,#range:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
#play{width:40px;background:var(--orange);border-color:var(--orange);color:#160800}
#play:hover{background:#ff8f3d}
#play svg{width:14px;height:14px}
.speeds{display:flex;gap:3px}
.speeds .btn{min-width:46px;font-family:var(--mono);font-weight:500}
.speeds .btn.on{border-color:var(--cyan);color:var(--cyan);background:rgba(46,230,255,.08)}
#scrub{position:relative;flex:1;min-width:160px;height:34px}
#marks{position:absolute;left:8px;right:8px;top:0;height:12px}
#marks button{position:absolute;top:0;width:12px;height:12px;margin-left:-6px;padding:0;border:0;background:transparent;cursor:pointer}
#marks button::after{content:"";position:absolute;left:5px;top:1px;width:2px;height:9px;background:var(--mute);border-radius:1px}
#marks button.k::after{background:var(--orange)}
#marks button:hover::after{background:var(--cyan)}
#range{-webkit-appearance:none;appearance:none;position:absolute;left:0;right:0;bottom:2px;width:100%;height:18px;background:transparent;margin:0;cursor:pointer}
#range::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--orange) 0,var(--orange) var(--p,0%),rgba(255,255,255,.12) var(--p,0%))}
#range::-moz-range-track{height:4px;border-radius:2px;background:rgba(255,255,255,.12)}
#range::-moz-range-progress{height:4px;border-radius:2px;background:var(--orange)}
#range::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-5px;border-radius:50%;background:#fff;border:3px solid var(--orange);box-shadow:0 0 12px rgba(255,122,26,.6)}
#range::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:#fff;border:3px solid var(--orange)}
#readT{font-family:var(--mono);font-size:13px;min-width:78px;text-align:right;color:var(--orange2)}
.toggles{display:flex;gap:6px;flex-wrap:wrap}
.tg{position:relative;cursor:pointer}
.tg input{position:absolute;opacity:0;width:1px;height:1px}
.tg span{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 10px;border:1px solid var(--line);border-radius:3px;font-size:11px;letter-spacing:.06em;color:var(--mute);background:rgba(255,255,255,.03)}
.tg span::before{content:"";width:8px;height:8px;border-radius:50%;border:1.5px solid var(--dim)}
.tg input:checked+span{color:var(--text);border-color:rgba(46,230,255,.45)}
.tg input:checked+span::before{background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 8px var(--cyan)}
#hint{left:50%;bottom:72px;transform:translateX(-50%);font-size:11px;letter-spacing:.12em;color:var(--mute);pointer-events:none;transition:opacity 1s;text-shadow:0 1px 4px #000}

#loading{position:fixed;inset:0;z-index:20;background:var(--bg);display:grid;place-items:center;transition:opacity .8s}
#loading div{font-size:11px;letter-spacing:.4em;color:var(--mute)}
#loading div::after{content:"";display:block;margin:14px auto 0;width:160px;height:2px;background:linear-gradient(90deg,transparent,var(--orange),transparent);animation:ld 1.2s infinite}
@keyframes ld{0%{transform:scaleX(.2)}50%{transform:scaleX(1)}100%{transform:scaleX(.2)}}

@media (max-width:900px){
  #bar{flex-wrap:wrap;gap:8px;left:8px;right:8px;bottom:8px;padding:8px}
  #scrub{order:-1;flex-basis:100%}
  #hud{left:8px;bottom:142px;width:230px;padding:9px 10px}
  .row{grid-template-columns:70px 1fr 28px}.row b{font-size:14px}
  #notes{right:8px;top:auto;bottom:250px;width:220px}
  #tape{right:6px;width:76px;height:34vh}
  #bug{top:8px;left:8px;padding:6px 10px 6px 6px}#bug p,#live{display:none}
  #clock{top:58px}#clock .t{font-size:22px}
  #spec{top:auto;bottom:142px;right:8px;width:min(320px,calc(100% - 16px))}
  #hint{display:none}
  .speeds .btn{min-width:40px}
}
</style>
</head>
<body>
<div id="loading"><div>INITIALIZING RANGE</div></div>
<canvas id="gl"></canvas>

<header id="bug" class="ui panel">
  <div class="mark">M</div>
  <div><h1>MERIDIAN HEAVY</h1><p>FLIGHT 01 · LEO DEMO</p></div>
  <div id="live"><i></i>LIVE</div>
</header>
<div id="clock" class="ui"><div class="ph" id="phase">TERMINAL COUNT</div><div class="t" id="mclock">T−00:00:10</div></div>
<div id="count" class="ui"><span id="countNum">10</span><small id="countSub">T-MINUS</small></div>
<div id="notes" class="ui" aria-live="polite"></div>
<canvas id="tape"></canvas>
<div id="labels"></div>
<div id="reticles"></div>

<section id="hud" class="ui panel" aria-label="Telemetry">
  <div class="hud-h"><span>TELEMETRY</span><span id="hudStage">STAGE 1 · HOLD</span></div>
  <div class="row"><label>ALTITUDE</label><b id="vAlt">0.00</b><i>km</i><div class="bar"><span id="bAlt"></span></div></div>
  <div class="row"><label>VELOCITY</label><b id="vVel">0</b><i>km/h</i><div class="bar"><span id="bVel"></span></div></div>
  <div class="row"><label>DOWNRANGE</label><b id="vDr">0.0</b><i>km</i><div class="bar"><span id="bDr"></span></div></div>
  <div class="row o"><label>ACCEL</label><b id="vAcc">0.00</b><i>g</i><div class="bar"><span id="bAcc"></span></div></div>
  <div class="row o"><label>DYN PRESS</label><b id="vQ">0.0</b><i>kPa</i><div class="bar"><span id="bQ"></span></div></div>
  <div class="fuel">
    <div id="fB">BOOST <em id="fBv">100%</em><div class="tank"><span id="fBb"></span></div></div>
    <div id="fS1">STG 1 <em id="fS1v">100%</em><div class="tank"><span id="fS1b"></span></div></div>
    <div id="fS2">STG 2 <em id="fS2v">100%</em><div class="tank"><span id="fS2b"></span></div></div>
  </div>
</section>

<aside id="spec" class="ui panel" aria-live="polite">
  <button id="specX" aria-label="Close specs">×</button>
  <div class="k" id="specK">VEHICLE ELEMENT</div>
  <h2 id="specT">Stage 1</h2>
  <p id="specD"></p>
  <table id="specTbl"></table>
  <div class="st" id="specS"></div>
</aside>

<div id="hint" class="ui">DRAG TO ORBIT · SCROLL TO ZOOM · CLICK A STAGE FOR SPECS</div>

<footer id="bar" class="ui panel">
  <button id="play" class="btn" aria-label="Pause"><svg viewBox="0 0 14 14"><rect x="2" y="1" width="3.4" height="12" fill="currentColor"/><rect x="8.6" y="1" width="3.4" height="12" fill="currentColor"/></svg></button>
  <button id="restart" class="btn" aria-label="Restart from T-10" title="Restart">↺</button>
  <div class="speeds" role="group" aria-label="Playback speed">
    <button class="btn" data-s="0.25">0.25×</button><button class="btn" data-s="0.5">0.5×</button><button class="btn on" data-s="1">1×</button><button class="btn" data-s="2">2×</button>
  </div>
  <div id="scrub"><div id="marks"></div><input id="range" type="range" min="-10" max="300" step="0.05" value="-10" aria-label="Mission timeline"></div>
  <div id="readT">T−10.0</div>
  <div class="toggles">
    <label class="tg"><input type="checkbox" id="tTel" checked><span>Telemetry</span></label>
    <label class="tg"><input type="checkbox" id="tTraj"><span>Trajectory</span></label>
    <label class="tg"><input type="checkbox" id="tCut"><span>Cutaway</span></label>
    <label class="tg"><input type="checkbox" id="tDir" checked><span>Director cam</span></label>
  </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
'use strict';
/* =====================================================================
   MERIDIAN HEAVY · procedural launch broadcast
   Units: metres, seconds. One global timeline variable `S.t` runs from
   T-10 to T+300 and every visual state is a pure function of it, so the
   scrubber can jump anywhere. Particles are the only stateful element;
   they are cleared and pre-warmed on every jump.
   ===================================================================== */

const T_START = -10, T_END = 300;
const R_E = 6371000;              // Earth radius
const PAD_H = 8;                  // launch-mount deck height: rocket body base sits here
const G0 = 9.81;
const EARTH_C = new THREE.Vector3(0, -R_E, 0);
const SUN = new THREE.Vector3(-0.45, 0.62, 0.64).normalize();
const AX_Z = new THREE.Vector3(0, 0, 1), AX_X = new THREE.Vector3(1, 0, 0), AX_Y = new THREE.Vector3(0, 1, 0);
const ONE = new THREE.Vector3(1, 1, 1);

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const sstep = (e0, e1, x) => { const k = clamp((x - e0) / (e1 - e0), 0, 1); return k * k * (3 - 2 * k); };
const rnd = (a, b) => a + Math.random() * (b - a);
const ease = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;

/* ---------------------------------------------------------------------
   Mission event times (single source of truth for state transitions)
   --------------------------------------------------------------------- */
const TM = {
  cables: [-9.0, -8.2, -7.4, -6.6, -5.8],   // umbilical release, one by one
  deluge: -7.5,                              // sound-suppression water on
  arms: [[-6.0, -3.6], [-5.5, -3.1], [-5.0, -2.6]], // swing-arm retract windows
  ignition: 0, liftoff: 0.8,                 // hold-downs release at T+0.8
  pitch: 8, beco: 104.5, boosterSep: 105,
  meco: 118, stageSep: 120, ses1: 122.5,
  fairing: 180, seco: 240, orbit: 255
};

/* ---------------------------------------------------------------------
   Trajectory: 2D point-mass integration (downrange x, altitude y) with a
   pitch program, then wrapped onto the curved Earth for rendering.
   Gravity is relieved by (vx/7.8 km/s)^2 so the vehicle holds altitude
   once it reaches orbital speed.
   --------------------------------------------------------------------- */
function thrustAcc(t) {
  if (t < TM.liftoff) return 0;
  if (t < TM.meco) { const r = Math.min(1, (t - TM.liftoff) / 3); return G0 * (1 + 0.5 * r + 3.1 * Math.pow(t / 118, 2)); }
  if (t < TM.ses1) return 0;
  if (t < TM.seco) { const s = (t - TM.ses1) / (TM.seco - TM.ses1), r = Math.min(1, (t - TM.ses1) / 1.5); return G0 * r * (1.2 + 11.5 * s * s); }
  return 0;
}
function pitchProg(t) { if (t < TM.pitch) return 0; const s = Math.min(1, (t - TM.pitch) / 222); return Math.PI / 2 * Math.pow(s, 0.78); }

const TRJ = (() => {
  const dt = 0.05, n = Math.round(T_END / dt) + 1;
  const x = new Float64Array(n), y = new Float64Array(n), vx = new Float64Array(n), vy = new Float64Array(n);
  const att = new Float64Array(n), acc = new Float64Array(n), q = new Float64Array(n);
  let X = 0, Y = 0, VX = 0, VY = 0, maxQ = 0, tMaxQ = 0;
  for (let i = 0; i < n; i++) {
    const t = i * dt, a = thrustAcc(t), th = pitchProg(t);
    const ge = G0 * Math.max(0, 1 - Math.pow(VX / 7800, 2));
    let ax = a * Math.sin(th), ay = a * Math.cos(th) - ge;

  // far-range reticles: main vehicle, and stage 1 during entry
  const rs = cam.dist > 2500 && project(cam.focus);
  if (rs) { retMain.style.display = 'block'; retMain.style.transform = `translate(${rs[0]}px,${rs[1]}px)`; retMain.firstChild.textContent = (t < TM.stageSep ? 'MERIDIAN' : 'STAGE 2') + ' · ' + (o.y / 1000).toFixed(1) + ' KM'; } else retMain.style.display = 'none';
  const P1 = parts.stage1;
  const r1 = P1.heat > .05 && P1.g.visible && project(_e.copy(P1.center).applyMatrix4(P1.g.matrix));
  if (r1) { retS1.style.display = 'block'; retS1.style.transform = `translate(${r1[0]}px,${r1[1]}px)`; retS1.firstChild.textContent = 'STAGE 1 · ENTRY'; } else retS1.style.display = 'none';
  // glows
  const engThr = Math.max(thr1(t), thrB(t), thr2(t));
  engineGlow.visible = engThr > .01 && cam.dist > 1500;
  if (engineGlow.visible) { _e.set(0, t < TM.stageSep ? -3 : 44, 0).applyMatrix4(ROOT); engineGlow.position.copy(_e); const s = .035 * sstep(1500, 6000, cam.dist) * engThr; engineGlow.scale.set(s, s, 1); }
  fireball.visible = P1.heat > .02 && P1.g.visible;
  if (fireball.visible) { fireball.position.copy(_e.copy(P1.center).applyMatrix4(P1.g.matrix)); const s = .05 * P1.heat * (.85 + .3 * Math.random()); fireball.scale.set(s, s, 1); }
  // trajectory split
  if (S.traj) { const idx = Math.round(clamp(t, 0, T_END) / T_END * (TRAJ_N - 1)); trajPast.geometry.setDrawRange(0, idx + 1); trajFut.geometry.setDrawRange(idx, TRAJ_N - idx); }
  // motion blur: subtle, only while accelerating hard and close
  const blurTarget = t > 2 && t < TM.seco ? clamp(v / 4000, 0, 1) * .022 * (1 - sstep(800, 3000, cam.dist)) * (o.acc > 0 ? 1 : .3) : 0;
  finalPass.uniforms.uBlur.value = lerp(finalPass.uniforms.uBlur.value, blurTarget, .1);
  const c = project(cam.focus); if (c) finalPass.uniforms.uCenter.value.set(c[0] / innerWidth, 1 - c[1] / innerHeight);
}

/* =====================================================================
   MAIN LOOP
   ===================================================================== */
let prevWall = performance.now(), hintTimer = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const realDt = clamp((now - prevWall) / 1000, 0, .05); prevWall = Math.max(prevWall, now);
  const wall = now / 1000;
  let simDt = 0;
  if (S.playing && !scrubbing) {
    simDt = realDt * S.speed;
    S.t = Math.min(T_END, S.t + simDt);
    if (S.t >= T_END) setPlaying(false);
  }
  // state transitions: fire events crossed during forward play only
  if (S.t > lastT && S.t - lastT < 1.5) {
    for (const ev of EVENTS) if (ev.t > lastT && ev.t <= S.t) { notify(ev); if (ev.burst) burst(ev.burst, ev.t); }
  }
  lastT = S.t;
  setParts(S.t);
  applyState(S.t, simDt, realDt, wall);
  updateCamera(S.t, realDt);
  updateDishes(cam.focus, realDt);
  const camAlt = applyEnvironment(wall);
  updateUI(S.t, camAlt);
  finalPass.uniforms.uTime.value = wall % 100;
  composer.render();
  hintTimer += realDt; if (hintTimer > 9) ui.hint.style.opacity = 0;
}
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); updatePointScale();
});
// boot
jumpTo(T_START);
setCutaway(false);
cam.snap = true;
requestAnimationFrame(t => { prevWall = t; requestAnimationFrame(frame); setTimeout(() => { $('loading').style.opacity = 0; setTimeout(() => $('loading').remove(), 900); }, 250); });
</script>
</body>
</html>
